{id:'q90',topic:'financing-sources',type:'single',source:'practice',
 text:'Чем венчурное финансирование принципиально отличается от банковского кредита для стартапа?',
 options:['Венчурный инвестор получает долю в капитале и разделяет риск, кредит нужно возвращать независимо от успеха проекта','Венчурное финансирование всегда дешевле кредита','Кредит не нужно возвращать, если проект провалился','Это полные синонимы'],
 correct:0, explanation:'Ключевое отличие — распределение риска: венчурный инвестор становится совладельцем и теряет деньги вместе с проектом при неудаче, тогда как кредит нужно обслуживать и возвращать независимо от результата бизнеса.'},
{id:'q91',topic:'financing-sources',type:'single',source:'practice',
 text:'Компания привлекает краудфандинг на запуск новой линейки товаров вместо кредита. Как это обычно влияет на долю основателя в капитале?',
 options:['Доля основателя обычно сохраняется полностью (в отличие от венчурного раунда), так как краудфандинг чаще не требует доли в капитале','Доля основателя падает так же, как при венчурном раунде','Краудфандинг всегда требует залога личным имуществом, как кредит','Краудфандинг доступен только публичным компаниям'],
 correct:0, explanation:'Товарный/реворд-краудфандинг (в отличие от equity-краудфандинга или венчурных раундов) обычно не требует отдавать долю в капитале — вкладчики получают продукт или бонус, а не акции.'},
{id:'q92',topic:'financing-sources',type:'single',source:'practice',
 text:'Начинающий предприниматель без кредитной истории и залога обращается за кредитом. Что для него наиболее вероятно?',
 options:['Повышенная процентная ставка по сравнению со зрелым бизнесом с залогом','Автоматически льготная ставка ниже рыночной','Банк обязан выдать кредит по любой ставке','Отказ от процентов вовсе'],
 correct:0, explanation:'У начинающего предпринимателя минимальные шансы получить кредит по льготной ставке под залог — банки закладывают более высокий риск в ставку.'},
{id:'q93',topic:'financing-sources',type:'single',source:'practice',
 text:'Проект получает грант на развитие. Как это отражается на денежном потоке в год получения?',
 options:['Положительный приток в финансовом денежном потоке, без обязательства возврата','Отток денежных средств','Не влияет на денежный поток вовсе','Уменьшает выручку компании'],
 correct:0, explanation:'Грант — безвозмездное поступление средств (в отличие от кредита), которое увеличивает финансовый денежный поток компании в периоде получения и не требует возврата.'},
{id:'q94',topic:'financing-sources',type:'single',source:'practice',
 text:'Компания выбирает между лизингом и покупкой оборудования в кредит. Что верно для лизинга?',
 options:['Ниже первоначальные вложения и риск, но обычно выше совокупная стоимость владения со временем','Всегда дешевле в сумме, чем покупка в кредит','Требует полной единовременной оплаты','Недоступен для малого бизнеса в принципе'],
 correct:0, explanation:'Лизинг — компромиссный вариант: меньше давления на стартовый капитал и риск, но в долгосрочной перспективе обычно обходится дороже прямой покупки/кредита.'},
{id:'q94b',topic:'financing-sources',type:'multi',source:'real',
 text:'Укажите источники финансирования с помощью ЗАЁМНЫХ и ПРИВЛЕЧЁННЫХ средств (несколько ответов)',
 options:['Резервный фонд (для непредвиденных расходов)','Целевой фонд (для финансирования определённых проектов)','Краткосрочные кредиты и займы','Дивидендные выплаты','Нераспределённая прибыль прошлых периодов','Долгосрочные кредиты и займы','Прибыль текущего периода','Внесение уставного капитала собственниками','Средства от эмиссии ценных бумаг','Средства от дополнительного размещения акций'],
 correct:[2,5,7,8,9], explanation:'Заёмные средства — это кредиты и займы: краткосрочные (C) и долгосрочные (F). Привлечённые средства — внешний капитал от третьих лиц без статуса кредита: взнос в уставный капитал собственниками (H), эмиссия ценных бумаг (I) и дополнительное размещение акций (J). Резервный и целевой фонды (A, B), нераспределённая прибыль (E) и прибыль текущего периода (G) — это СОБСТВЕННЫЕ средства компании, а не заёмные/привлечённые. Дивидендные выплаты (D) — это вообще не источник финансирования, а отток денег из компании.'},
{id:'q94c',topic:'financing-sources',type:'single',source:'practice',
 text:'Чем «привлечённые» средства (например, взнос нового инвестора в уставный капитал) принципиально отличаются от «заёмных» (кредит)?',
 options:['Привлечённые средства не создают долгового обязательства и обязательства возврата — инвестор становится совладельцем, а не кредитором','Привлечённые средства всегда нужно возвращать с процентами, как кредит','Это полные синонимы','Привлечённые средства доступны только государственным компаниям'],
 correct:0, explanation:'Ключевое отличие — правовая природа: заёмные средства (кредит) создают долг, который нужно вернуть независимо от результата бизнеса; привлечённые средства (взнос в капитал, размещение акций) делают инвестора совладельцем, разделяющим риск, без обязательства возврата конкретной суммы.'},
{id:'q94d',topic:'financing-sources',type:'multi',source:'real',
 data:'ООО «Дюрсо» планирует запустить новую инновационную линию стоимостью 300 млн руб. по производству моющих средств и увеличить выпуск продукции в два раза. Чистая прибыль компании за предыдущий год составила 150 млн руб. (ROS=14%). Коэффициент текущей ликвидности = 1,8 (норма: больше 2,0). Свободного залогового имущества, кроме приобретаемого оборудования, компания не имеет. Рыночная репутация и кредитная история — положительные.',
 text:'Определите, какие источники финансирования из списка относятся к ЗАЁМНЫМ средствам и при этом реалистичны для компании в сложившихся условиях (несколько ответов)',
 options:['Краткосрочные кредиты и займы','Проектное финансирование от ФРП (Фонд развития промышленности)','Прибыль текущего периода','Нераспределённая прибыль прошлых периодов','Средства от дополнительного размещения акций','Внесение уставного капитала собственниками','Целевой фонд компании (для финансирования определённых проектов)','Средства от эмиссии облигаций','Долгосрочные кредиты и займы','Грант от Фонда содействия инновациям','Резервный фонд (для непредвиденных расходов)','Дивидендные выплаты'],
 correct:[1,8], explanation:'Сначала отсеиваем НЕ заёмные варианты: прибыль текущего периода (C), нераспределённая прибыль (D), взносы/акции (E, F) — это собственный или привлечённый (не долговой) капитал; целевой и резервный фонды (G, K) — тоже собственные средства компании; грант (J) — безвозмездное финансирование, не долг; дивиденды (L) — это отток денег, а не источник финансирования вовсе. Остаются четыре заёмных варианта: A, B, H, I. Теперь проверяем РЕАЛИСТИЧНОСТЬ для конкретной ситуации: коэффициент текущей ликвидности (1,8) НИЖЕ нормы (2,0) — это сигнал слабой краткосрочной платёжеспособности, из-за чего банки неохотно дают НОВЫЕ краткосрочные кредиты (A) поверх уже напряжённого баланса, к тому же короткий срок кредита плохо подходит под длинный инвестиционный проект. Эмиссия облигаций (H) обычно требует более крупного масштаба и публичной кредитной истории на рынке долга, что не описано в условии. Долгосрочный кредит (I) в целом реалистичен, поскольку САМО приобретаемое оборудование может выступить залогом, а положительные репутация и кредитная история — это ровно то, что рассматривает банк при таком обеспеченном кредите. Проектное финансирование от ФРП (B) — практически идеальное совпадение: это государственный инструмент именно для проектов модернизации/расширения промышленного производства, оценивающий бизнес-план и репутацию заявителя, а не требующий значительного дополнительного залога. Реалистичные заёмные источники — B и I.'},

/* ================= ebit-profitability ================= */
{id:'q95',topic:'ebit-profitability',type:'numeric',source:'real',
 data:'Продано 140 единиц по цене 85 руб. Издержки — 2 500 руб. Налог на прибыль — 20%. Инвестиции — 2 600 руб.',
 text:'Рассчитайте ROS (рентабельность продаж по чистой прибыли), округлите до целого числа в процентах.',
 answer:63, tolerance:2, unit:'%',
 explanation:'Выручка = 140×85 = 11 900 руб. Прибыль до налога = 11 900−2 500 = 9 400 руб. Чистая прибыль = 9 400×(1−20%) = 7 520 руб. ROS = Чистая прибыль/Выручка = 7 520/11 900 ≈ 63,2% ≈ 63%.'},
{id:'q96',topic:'ebit-profitability',type:'single',source:'practice',
 text:'В чём разница между EBIT и чистой прибылью?',
 options:['EBIT — прибыль ДО вычета процентов и налогов, чистая прибыль — уже ПОСЛЕ их вычета','Это полные синонимы','EBIT всегда меньше чистой прибыли','Чистая прибыль не учитывает налоги вовсе'],
 correct:0, explanation:'EBIT (операционная прибыль) считается до финансовых расходов (процентов) и налога на прибыль; чистая прибыль — финальный результат после их вычета.'},
{id:'q97',topic:'ebit-profitability',type:'single',source:'practice',
 text:'Компания X имеет ROS = 8%, компания Y — ROS = 15% при одинаковой выручке. Что это означает?',
 options:['Компания Y эффективнее конвертирует выручку в прибыль','Компания X зарабатывает больше в абсолютных числах','ROS не связан с прибылью вообще','Компания X имеет более высокие инвестиции'],
 correct:0, explanation:'ROS = Прибыль/Выручка — чем выше показатель, тем большая доля каждого рубля выручки превращается в прибыль, то есть тем эффективнее компания управляет затратами относительно продаж.'},
{id:'q98',topic:'ebit-profitability',type:'numeric',source:'practice',
 data:'Инвестиции в проект — 2 000 000 руб. Чистая прибыль за год — 500 000 руб.',
 text:'Рассчитайте ROI за год в процентах (округлите до целого).',
 answer:25, tolerance:1, unit:'%',
 explanation:'ROI = Чистая прибыль/Инвестиции × 100% = 500 000/2 000 000×100% = 25%.'},
{id:'q99',topic:'ebit-profitability',type:'single',source:'practice',
 text:'Зачем инвестору важна не только чистая прибыль, но и EBIT (операционная прибыль)?',
 options:['EBIT показывает эффективность именно операционной деятельности, не искажённую структурой долга и налоговой ставкой','EBIT — то же самое, что чистая прибыль, просто другое название','EBIT всегда больше выручки','EBIT не имеет отношения к оценке эффективности'],
 correct:0, explanation:'EBIT «очищен» от способа финансирования (проценты по долгу) и налогового режима, поэтому позволяет сравнивать операционную эффективность компаний с разной структурой капитала.'},
{id:'q99b',topic:'ebit-profitability',type:'numeric',source:'practice',
 data:'Выручка компании — 8 400 000 руб. Себестоимость — 5 100 000 руб. Управленческие и коммерческие расходы — 1 200 000 руб. Амортизация — 300 000 руб.',
 text:'Рассчитайте EBIT (операционную прибыль), в рублях.',
 answer:1800000, tolerance:5000, unit:'₽',
 explanation:'EBIT = Выручка − Себестоимость − Упр./комм. расходы − Амортизация = 8 400 000 − 5 100 000 − 1 200 000 − 300 000 = 1 800 000 руб.'},
{id:'q99c',topic:'ebit-profitability',type:'single',source:'practice',
 text:'Компания А: EBIT=2 млн, проценты по кредиту=800 тыс. Компания Б: EBIT=2 млн, кредитов нет вовсе. У кого выше чистая прибыль при одинаковой ставке налога на прибыль?',
 options:['У компании Б — она не платит проценты, поэтому её налогооблагаемая база и итоговая чистая прибыль выше','У компании А — долг всегда увеличивает чистую прибыль','У обеих одинаковая чистая прибыль, раз EBIT совпадает','Сравнить невозможно без данных о выручке'],
 correct:0, explanation:'При равном EBIT компания без долговой нагрузки (Б) не платит проценты, поэтому её прибыль до налога (EBT) и, соответственно, чистая прибыль после налога выше, чем у закредитованной компании А — именно поэтому EBIT НЕ равен чистой прибыли и не заменяет её при сравнении итоговой доходности для собственников.'},
{id:'q99d',topic:'ebit-profitability',type:'numeric',source:'real',
 data:'Выручка компании «Магнит» за квартал — 600 млрд руб. Себестоимость — 450 млрд руб. Коммерческие расходы — 50 млрд руб. Управленческие расходы — 30 млрд руб.',
 text:'Рассчитайте операционную прибыль (EBIT), млрд руб.',
 answer:70, tolerance:1, unit:'млрд руб.',
 explanation:'EBIT = Выручка − Себестоимость − Коммерческие расходы − Управленческие расходы = 600 − 450 − 50 − 30 = 70 млрд руб.'},
{id:'q99e',topic:'ebit-profitability',type:'numeric',source:'real',
 data:'Компания показала EBIT = 4 000 тыс. руб., проценты по кредиту = 600 тыс. руб., налог на прибыль = 25%.',
 text:'Рассчитайте чистую прибыль, тыс. руб.',
 answer:2550, tolerance:20, unit:'тыс. руб.',
 explanation:'EBT = EBIT − Проценты = 4 000 − 600 = 3 400 тыс. руб. Чистая прибыль = EBT × (1 − 0,25) = 3 400 × 0,75 = 2 550 тыс. руб.'},
{id:'q99f',topic:'ebit-profitability',type:'numeric',source:'real',
 data:'Компания «СтройМаркет» (вариант 2): портфель продукции — 30% Продукт 1, 70% Продукт 2, всего 140 шт. Цена П1 (в т.ч. НДС 22%) = 85 тыс. руб., цена П2 (в т.ч. НДС 22%) = 70 тыс. руб. Себестоимость — 20 тыс. руб./шт. (одинакова). Управленческие расходы = 1 200 тыс. руб. Коммерческие расходы = 2 000 тыс. руб. Проценты по кредиту = 130 тыс. руб. Амортизация = 210 тыс. руб. Планируемый остаток продукции на конец периода = 20 шт. Налог на прибыль = 25%.',
 text:'Рассчитайте ROS operating (округлите до целого числа, в процентах).',
 answer:27, tolerance:2, unit:'%',
 explanation:'Units: П1=140×30%=42 шт., П2=140×70%=98 шт. Цены без НДС: П1=85/1,22≈69,67 тыс., П2=70/1,22≈57,38 тыс. Выручка=42×69,67+98×57,38≈8 549 тыс. руб. Себестоимость реализованной продукции считается по 140 ПРОДАННЫМ шт. (не по 160 произведённым с учётом остатка): 140×20=2 800 тыс. руб. Валовая прибыль=8 549−2 800=5 749 тыс. EBIT=5 749−1 200−2 000−210=2 339 тыс. ROS operating=EBIT/Выручка=2 339/8 549≈27,4%≈27%.'},
{id:'q99g',topic:'ebit-profitability',type:'numeric',source:'real',
 data:'Продолжение предыдущей задачи «СтройМаркет»: EBIT≈2 339 тыс. руб., проценты по кредиту=130 тыс. руб., налог на прибыль=25%, инвестиции в оборудование=2 900 тыс. руб.',
 text:'Рассчитайте ROI (округлите до целого числа, в процентах).',
 answer:57, tolerance:3, unit:'%',
 explanation:'EBT=2 339−130=2 209 тыс. Налог=2 209×25%≈552 тыс. Чистая прибыль=2 209−552≈1 657 тыс. ROI=Чистая прибыль/Инвестиции=1 657/2 900≈57,1%≈57%.'},

/* ================= cash-flows ================= */
{id:'q100',topic:'cash-flows',type:'multi',source:'real',
 text:'Что из перечисленного относится к ОПЕРАЦИОННОМУ денежному потоку? (несколько ответов)',
 options:['Получение суммы кредита от банка','Внесение уставного капитала акционерами','Получение аванса от покупателя','Начисление амортизации','Продажа основных средств','Оплата сырья и материалов','Выплата заработной платы менеджерам','Эмиссия ценных бумаг (акций и облигаций)','Оплата ремонтных работ по основному оборудованию','Оплата налога по УСН','Получение дивидендов от участия в другой компании'],
 correct:[2,5,6,8,9], explanation:'Операционный денежный поток — это потоки от основной деятельности: авансы от покупателей (C), оплата сырья (F) и зарплат менеджеров (G), текущий ремонт оборудования (I) и налоги с операционной деятельности (J). Кредиты и взносы в капитал (A, B), эмиссия ценных бумаг (H) — финансовый поток; продажа основных средств (E) и дивиденды от участия в другой компании (K) — инвестиционный поток; начисление амортизации (D) вообще не является движением денег — это неденежная бухгалтерская операция.'},
{id:'q101',topic:'cash-flows',type:'multi',source:'real',
 text:'Что из перечисленного относится к ИНВЕСТИЦИОННОМУ денежному потоку? (несколько ответов)',
 options:['Продажа основных средств','Внесение уставного капитала акционерами','Начисление амортизации','Оплата страховки','Выдача кредита другой компании','Выплата процентов по банковскому кредиту','Погашение тела кредита','Получение аванса от покупателя','Получение дивидендов от участия в другой компании','Оплата текущих расходов'],
 correct:[0,4,8], explanation:'Инвестиционный поток связан с долгосрочными активами и финансовыми вложениями: продажа основных средств (A), выдача займа другой компании (E) и получение дивидендов от владения долей в другой компании (I, доход от ранее сделанной финансовой инвестиции). Взносы в капитал (B) и погашение тела кредита (G) — финансовый поток; проценты по кредиту (F) в этом курсе считаются частью операционного потока (вычитаются при расчёте EBT); начисление амортизации (C) — не денежная операция вовсе; страховка (D) и текущие расходы (J) — операционный поток; аванс от покупателя (H) — тоже операционный.'},
{id:'q101b',topic:'cash-flows',type:'numeric',source:'real',
 data:'Выручка: 3 200. Себестоимость: 500. Управленческие и коммерческие расходы: 800. Капитальные вложения: 400. Изменение в чистом оборотном капитале: 80. Привлечение кредита: 300. Погашение кредита: 50. Проценты по кредиту: 10. Налог на прибыль — 25%. Амортизация считается на 5 лет, начиная с первого года.',
 text:'Рассчитайте FCFF (свободный денежный поток на весь инвестированный капитал) за год.',
 answer:965, tolerance:5, unit:'(в тех же единицах, что и выручка)',
 explanation:'Амортизация = 400/5 = 80. EBIT = 3 200−500−800−80 = 1 820. FCFF = EBIT×(1−налог) + Амортизация − CAPEX − ΔNWC = 1 820×0,75 + 80 − 400 − 80 = 1 365+80−400−80 = 965.'},
{id:'q101c',topic:'cash-flows',type:'numeric',source:'real',
 data:'Те же данные: Выручка 3 200, Себестоимость 500, Упр./комм. расходы 800, CAPEX 400, ΔNWC 80, Привлечение кредита 300, Погашение кредита 50, Проценты 10, Налог на прибыль 25%, Амортизация = CAPEX/5 = 80.',
 text:'Рассчитайте FCFE (свободный денежный поток для собственного капитала) за год.',
 answer:1207.5, tolerance:5, unit:'(в тех же единицах)',
 explanation:'EBIT = 1 820 (см. предыдущую задачу). EBT = EBIT−Проценты = 1 820−10=1 810. Налог = 1 810×25%=452,5. Чистая прибыль = 1 810−452,5=1 357,5. FCFE = Чистая прибыль + Амортизация − CAPEX − ΔNWC + (Привлечение кредита − Погашение кредита) = 1 357,5+80−400−80+(300−50) = 957,5+250 = 1 207,5. Разница между FCFF (965) и FCFE (1 207,5) как раз и объясняется чистым привлечением заёмных средств (+250) за вычетом процентов после налога (−7,5).'},
{id:'q102',topic:'cash-flows',type:'single',source:'practice',
 text:'Почему начисление амортизации НЕ включается напрямую как отдельная строка оттока в отчёте о движении денежных средств (косвенный метод)?',
 options:['Амортизация — не реальный отток денег, поэтому её прибавляют обратно к чистой прибыли при расчёте операционного потока','Амортизация вообще не связана с денежным потоком','Амортизация всегда равна нулю в проектах до 5 лет','Амортизация относится к финансовому потоку'],
 correct:0, explanation:'Амортизация уменьшает бухгалтерскую прибыль, но не сопровождается реальным списанием денег со счёта, поэтому при переходе от прибыли к денежному потоку (косвенный метод) её прибавляют обратно.'},
{id:'q103',topic:'cash-flows',type:'single',source:'practice',
 text:'Рост дебиторской задолженности (клиенты платят медленнее) при прочих равных как влияет на операционный денежный поток?',
 options:['Снижает операционный денежный поток (деньги «зависают» в NWC)','Увеличивает операционный денежный поток','Не влияет на денежный поток','Влияет только на инвестиционный поток'],
 correct:0, explanation:'Рост дебиторской задолженности — это увеличение чистого рабочего капитала (NWC), что является оттоком в расчёте FCF/OCF: прибыль уже начислена, а реальные деньги ещё не получены.'},
{id:'q104',topic:'cash-flows',type:'single',source:'practice',
 text:'Компания получила от банка кредит 5 млн руб. К какому виду денежного потока это относится?',
 options:['Финансовый денежный поток','Операционный денежный поток','Инвестиционный денежный поток','Ни к одному из потоков'],
 correct:0, explanation:'Привлечение и погашение заёмных средств, а также взносы в капитал — это финансовый денежный поток (Cash Flows from Financing Activities).'},
{id:'q105',topic:'cash-flows',type:'single',source:'practice',
 text:'Компания «СтартПроект» на начало года имеет остаток денег 200 у.е., а по итогам расчёта денежных потоков конец года выходит отрицательным. Что это означает для бизнес-плана?',
 options:['Собственных и операционных средств недостаточно — требуется привлечение дополнительного финансирования','Компания автоматически банкрот, финансирование привлекать поздно','Отрицательный итог всегда означает ошибку в расчётах','Это не имеет значения, если NPV положительный'],
 correct:0, explanation:'Отрицательный итоговый денежный поток означает кассовый разрыв — компании не хватает средств для операций на протяжении года, и бизнес-план должен предусмотреть источник дополнительного финансирования на эту сумму.'},

/* ================= irr-npv-dpp ================= */
{id:'q106',topic:'irr-npv-dpp',type:'multi',source:'real',
 text:'Какие из следующих утверждений о показателях эффективности проекта являются НЕВЕРНЫМИ? (несколько ответов)',
 options:['Если срок окупаемости (PP) проекта составляет 3 года, а срок жизни проекта — 5 лет, это является безусловным основанием для принятия инвестиционного решения без дополнительных расчётов','Индекс доходности инвестиций (PI), равный 2,3, означает, что на каждый вложенный рубль проект генерирует 2,3 рубля чистой приведённой стоимости','Внутренняя норма доходности (IRR) всегда измеряется в процентном выражении и показывает реальную банковскую ставку, под которую можно положить деньги, чтобы получить аналогичный денежный поток','Показатель NPV (чистая приведённая стоимость) предполагает, что промежуточные денежные потоки реинвестируются под ставку, равную внутренней норме доходности (IRR) проекта','Показатель дисконтированного срока окупаемости (DPP) позволяет учесть риски ликвидности проекта, но не даёт информации о его доходности за пределами горизонта окупаемости','Чем длительнее горизонт планирования проекта, тем меньшее влияние на итоговое значение NPV оказывает изменение ставки дисконтирования в поздние периоды','Чем выше ставка дисконтирования, тем ниже чувствительность NPV к денежным потокам отдалённых периодов'],
 correct:[0,1,2,3,5], explanation:'Неверны 5 утверждений: (1) PP игнорирует потоки после срока окупаемости и не дисконтирует их — одного PP недостаточно для решения; (2) PI=2,3 означает, что на 1 вложенный рубль проект создаёт 2,3 руб. ОБЩЕЙ приведённой стоимости (включая возврат вложенного рубля), а не 2,3 руб. ЧИСТОЙ приведённой стоимости сверх вложений; (3) IRR — расчётная ставка именно этого проекта, а не реальная рыночная/банковская ставка; (4) это условие описывает именно IRR (а не NPV) — реинвестирование по своей же ставке — известное ограничение IRR, а не свойство NPV; (6) на самом деле чем длиннее горизонт, тем СИЛЬНЕЕ совокупное влияние ставки дисконтирования на NPV, а не слабее. Верные (не входят в ответ): «DPP не даёт информации за пределами горизонта окупаемости» — это законное ограничение DPP, действительно верное утверждение; и «чем выше ставка дисконтирования, тем ниже чувствительность NPV к дальним потокам» — тоже верно, так как дальние потоки при высокой ставке и так уже сильно продисконтированы и вносят маленький вклад.'},
{id:'q107',topic:'irr-npv-dpp',type:'single',source:'practice',
 text:'Почему DPP (дисконтированный срок окупаемости) всегда больше или равен обычному PP?',
 options:['Дисконтирование уменьшает величину будущих денежных потоков, поэтому для покрытия инвестиций требуется больше времени','DPP считается по другой формуле инвестиций','PP всегда включает налоги, а DPP — нет','Это не всегда так — соотношение может быть любым'],
 correct:0, explanation:'Так как дисконтированные потоки меньше номинальных (при положительной ставке дисконтирования), сумма накапливается медленнее — значит, срок для покрытия инвестиций (DPP) не может быть короче обычного PP.'},
{id:'q108',topic:'irr-npv-dpp',type:'single',source:'practice',
 text:'NPV проекта при ставке дисконтирования 15% равен 0. Как это интерпретировать?',
 options:['Ставка 15% — это и есть IRR проекта (точка безразличия)','Проект точно убыточен','Проект точно прибыльный','NPV=0 не связан с IRR'],
 correct:0, explanation:'IRR по определению — это ставка дисконтирования, при которой NPV=0. Если при 15% NPV=0, значит IRR проекта равна именно 15%.'},
{id:'q109',topic:'irr-npv-dpp',type:'single',source:'practice',
 text:'Проект имеет чередующиеся положительные и отрицательные денежные потоки в разные годы, из-за чего расчёт IRR даёт несколько математических решений. Какой показатель стоит использовать вместо обычного IRR?',
 options:['MIRR (модифицированная внутренняя норма доходности)','DPP','ROS','WACC всегда решает эту проблему автоматически'],
 correct:0, explanation:'Для «неклассических» знакопеременных денежных потоков, когда обычный IRR даёт неоднозначный результат, применяют MIRR — модификацию, устраняющую эту проблему.'},
{id:'q110',topic:'irr-npv-dpp',type:'single',source:'practice',
 text:'Проект А имеет NPV=5 млн руб. при ставке 12%, проект Б — NPV=5 млн руб. при ставке 20%. Какой проект при прочих равных обычно считается более привлекательным?',
 options:['Проект Б — так как создаёт ту же стоимость при более высокой требуемой доходности (более выгодная относительная эффективность)','Проект А — так как ставка ниже','Оба одинаково привлекательны без исключений','NPV нельзя сравнивать при разных ставках'],
 correct:0, explanation:'Одинаковый NPV при более высокой ставке дисконтирования означает, что проект Б создаёт ту же абсолютную стоимость, «преодолевая» более высокий барьер доходности — то есть относительно эффективнее.'},
{id:'q111',topic:'irr-npv-dpp',type:'single',source:'practice',
 text:'Какой из перечисленных показателей НЕ учитывает временную стоимость денег (не дисконтируется)?',
 options:['PP (обычный срок окупаемости)','NPV','IRR','DPP'],
 correct:0, explanation:'Обычный PP считается по номинальным (недисконтированным) денежным потокам — единственный из перечисленных показателей, игнорирующий временную стоимость денег.'},
{id:'q111b',topic:'irr-npv-dpp',type:'multi',source:'real',
 text:'Какие утверждения насчёт показателей эффективности проекта являются НЕВЕРНЫМИ? (несколько ответов, вариант 2025 года)',
 options:['Если IRR ниже ставки дисконтирования, то проект финансово непривлекателен','IRR всегда измеряется в процентном выражении, а NPV — в деньгах','Необходимо всегда дисконтировать денежные потоки для проектов длительностью 10 лет','IRR всегда равен 0% в точке окупаемости проекта','Если NPV выше нуля, то проект финансово непривлекателен','Если срок окупаемости проекта меньше срока, на который рассчитан проект, необходимо в него инвестировать'],
 correct:[3,4,5], explanation:'Неверны: «IRR=0% в точке окупаемости» (D) — это подмена понятий: IRR определяется через равенство NPV=0 при определённой СТАВКЕ дисконтирования, и никак не связана с точкой окупаемости (payback point) — это два разных показателя. «NPV>0 → непривлекателен» (E) — прямо противоположно истине: NPV>0 означает, что проект СОЗДАЁТ стоимость, то есть привлекателен. «PP короче срока жизни → нужно инвестировать» (F) — классическая ловушка «одного показателя»: PP ничего не говорит о доходности после срока окупаемости и не учитывает дисконтирование, поэтому этого одного факта недостаточно для решения. Верны (не входят в ответ): A (IRR ниже требуемой ставки — действительно повод отклонить проект), B (единицы измерения указаны верно) и C (для долгосрочных проектов дисконтирование денежных потоков — стандартная и необходимая практика).'},
{id:'q111c',topic:'irr-npv-dpp',type:'single',source:'real',
 text:'Если ставка дисконтирования увеличивается, NPV проекта (при прочих равных, с положительными будущими потоками):',
 options:['Зависит от суммы инвестиций','Увеличивается для длинных проектов','Уменьшается','Не изменяется','Увеличивается','Зависит от IRR'],
 correct:2, explanation:'Рост ставки дисконтирования увеличивает знаменатель (1+r)ⁿ в формуле дисконтирования каждого будущего потока, поэтому приведённая стоимость всех будущих притоков падает, а значит и NPV = ΣPV потоков − Инвестиции уменьшается. Это базовая, прямая зависимость, не требующая знания IRR или суммы инвестиций.'},
{id:'q111d',topic:'irr-npv-dpp',type:'single',source:'real',
 text:'Верно ли утверждение: «IRR — это ставка дисконтирования, при которой NPV проекта равен нулю»?',
 options:['Верно','Неверно'],
 correct:0, explanation:'Это ровно определение IRR (Internal Rate of Return / внутренняя норма доходности) — ставка, уравнивающая приведённую стоимость будущих денежных потоков с суммой первоначальных инвестиций, то есть при которой NPV=0.'},
{id:'q111e',topic:'irr-npv-dpp',type:'single',source:'real',
 text:'IRR проекта = 18%, требуемая доходность инвестора = 12%. Решение:',
 options:['Зависит от NPV','Отвергаем','IRR не используется для принятия решений','Принимаем','Информации недостаточно','Точка безразличия'],
 correct:3, explanation:'Критерий принятия по IRR: если IRR превышает требуемую (пороговую) доходность инвестора, проект стоит принять — доходность проекта выше, чем инвестор мог бы получить в альтернативе. Здесь 18%>12%, поэтому проект принимаем.'},
{id:'q111f',topic:'irr-npv-dpp',type:'single',source:'real',
 text:'При какой ставке дисконтирования NPV проекта равен 0?',
 options:['При ставке равной IRR','NPV никогда не равен 0','При ставке инфляции','При нулевой ставке','При любой ставке','При максимальной ставке'],
 correct:0, explanation:'Это прямое следствие определения IRR: по построению, именно ставка, равная IRR проекта, обнуляет NPV. При других ставках NPV, как правило, отличен от нуля.'},
{id:'q111g',topic:'irr-npv-dpp',type:'single',source:'real',
 text:'Бюджет на инвестиции — 5 000 тыс. руб. Проект А: NPV=2 000 тыс., инвестиции=10 000 тыс. Проект Б: NPV=1 500 тыс., инвестиции=5 000 тыс. Какой выбрать?',
 options:['Оба проекта','Ни один','Проект B','Зависит от PP','Проект A','Зависит от IRR'],
 correct:2, explanation:'Проект А требует 10 000 тыс. руб. инвестиций — это ВДВОЕ больше доступного бюджета (5 000 тыс.), поэтому он физически неосуществим при заданном ограничении, несмотря на более высокий NPV. Проект Б требует ровно 5 000 тыс. — укладывается в бюджет. При ограниченном бюджете сравнивать нужно не абсолютный NPV, а осуществимость и эффективность на вложенный рубль (PI = NPV/Инвестиции): у Б это 1 500/5 000=0,3, у А — 2 000/10 000=0,2, то есть проект Б даже эффективнее на рубль вложений. Выбираем проект Б.'},
{id:'q111h',topic:'irr-npv-dpp',type:'single',source:'real',
 text:'Дисконтированный срок окупаемости (DPP) всегда:',
 options:['Не связан со сроком окупаемости','Меньше срока окупаемости','Больше или равен сроку окупаемости','Зависит от инфляции','Равен сроку окупаемости'],
 correct:2, explanation:'DPP считается по ДИСКОНТИРОВАННЫМ денежным потокам, которые меньше номинальных (при положительной ставке дисконтирования) — значит, для покрытия тех же инвестиций дисконтированными потоками требуется столько же или больше времени, чем номинальными. Поэтому DPP ≥ PP всегда, и это не зависит от инфляции напрямую (инфляция — лишь один из факторов, формирующих саму ставку дисконтирования, но неравенство DPP≥PP верно при любой положительной ставке).'},

{id:'q112',topic:'unit-economics',type:'numeric',source:'practice',
 data:'Средний чек клиента — 3 000 руб., клиент покупает 4 раза в год, средний срок жизни клиента — 3 года. Переменные затраты на обслуживание клиента за весь срок — 5 000 руб.',
 text:'Рассчитайте LTV клиента (в рублях).',
 answer:31000, tolerance:500, unit:'₽',
 explanation:'LTV = Средний чек × Частота × Срок жизни − Переменные затраты = 3 000×4×3 − 5 000 = 36 000 − 5 000 = 31 000 руб.'},
{id:'q113',topic:'unit-economics',type:'numeric',source:'practice',
 data:'Затраты на маркетинг и продажи за месяц — 900 000 руб. За месяц привлечено 300 новых клиентов.',
 text:'Рассчитайте CAC (стоимость привлечения одного клиента), в рублях.',
 answer:3000, tolerance:50, unit:'₽',
 explanation:'CAC = Затраты на маркетинг и продажи / Число привлечённых клиентов = 900 000 / 300 = 3 000 руб.'},
{id:'q114',topic:'unit-economics',type:'single',source:'practice',
 text:'LTV клиента = 9 000 руб., CAC = 3 000 руб. Что можно сказать об этой юнит-экономике?',
 options:['LTV/CAC = 3 — приемлемая, работающая модель, но есть потенциал для роста эффективности','Модель точно нежизнеспособна','LTV/CAC = 3 — это уже отличный результат, улучшать нечего','Соотношение LTV/CAC не имеет значения для оценки модели'],
 correct:0, explanation:'LTV/CAC=3 попадает в диапазон 3–5 — «хорошая модель», но не «отличная» (>5), значит есть пространство для оптимизации (снижение CAC или рост LTV).'},
{id:'q115',topic:'unit-economics',type:'single',source:'real',
 data:'Онлайн-платформа для аренды и продажи дизайнерской мебели: сегмент B2B (300 корпоративных клиентов × 10 000 руб./мес аренды) и сегмент B2C (2 000 клиентов × 7 000 руб./год). Фиксированные расходы ≈ 40 млн руб./год. Дано допущение: переменные затраты на обслуживание ОДНОГО клиента = 50 000 руб./год для ЛЮБОГО клиента.',
 text:'Если применить это допущение буквально к обоим сегментам, что произойдёт с юнит-экономикой B2C-сегмента (доход 7 000 руб./год с клиента)?',
 options:['B2C-сегмент становится глубоко убыточным на уровне каждого отдельного клиента (7 000 руб. дохода против 50 000 руб. затрат)','B2C-сегмент останется прибыльным, так как клиентов больше, чем в B2B','Допущение не влияет на прибыльность сегментов','B2C всегда прибыльнее B2B при любых затратах'],
 correct:0, explanation:'При равном переменном расходе на клиента (50 000 руб./год) B2C-клиент, платящий всего 7 000 руб./год, приносит убыток 43 000 руб. на каждого — это явный сигнал, что усреднённая по всем клиентам переменная стоимость обслуживания нереалистична и требует раздельного расчёта юнит-экономики по сегментам B2B и B2C.'},
{id:'q116',topic:'unit-economics',type:'single',source:'practice',
 text:'Почему для платформ и маркетплейсов юнит-экономика особенно важна — даже когда компания в целом ещё убыточна?',
 options:['Она показывает, становится ли прибыльной хотя бы ОДНА транзакция/клиент — если нет, масштабирование только увеличит общие убытки','Юнит-экономика заменяет собой весь финансовый план','Юнит-экономика важна только для производственных компаний','Убыточная компания не может считать юнит-экономику в принципе'],
 correct:0, explanation:'Если экономика одного юнита (клиента/заказа) отрицательна, то рост объёма только УМНОЖАЕТ убытки — поэтому для растущих, ещё не прибыльных бизнесов именно юнит-экономика показывает, ведёт ли масштабирование к прибыли в принципе.'},
{id:'q117',topic:'unit-economics',type:'numeric',source:'practice',
 data:'Средний чек — 1 200 руб. Частота покупок — 6 раз в год. Средний срок жизни клиента — 2 года. CAC — 2 500 руб. Переменные затраты на обслуживание клиента за весь срок — 3 000 руб.',
 text:'Рассчитайте отношение LTV/CAC (округлите до одного знака после запятой).',
 answer:2.6, tolerance:0.15, unit:'(раз)',
 explanation:'LTV = Средний чек×Частота×Срок − Переменные затраты = 1 200×6×2 − 3 000 = 14 400−3 000 = 11 400 руб. LTV/CAC = 11 400/2 500 = 4,56 ≈ 4,6... Проверка: 11400/2500=4.56. Итоговый ответ округляется до 4,6, что попадает в диапазон «хорошая модель» (3–5).'},
{id:'q117b',topic:'unit-economics',type:'single',source:'practice',
 text:'CAC Payback (срок окупаемости привлечения клиента) компании составляет 22 месяца при среднем сроке жизни клиента 12 месяцев. Что это означает?',
 options:['Типичный клиент уходит раньше, чем окупаются затраты на его привлечение — юнит-экономика, скорее всего, не работает','Это отличный результат для любого бизнеса','CAC Payback не связан со сроком жизни клиента','Компании нужно снизить средний чек, чтобы решить проблему'],
 correct:0, explanation:'Если для окупаемости привлечения нужно 22 месяца, а клиент в среднем «живёт» только 12, компания в среднем не успевает вернуть даже затраты на его привлечение, не говоря уже о прибыли — это тревожный сигнал о нежизнеспособности модели в текущем виде.'},
{id:'q117c',topic:'unit-economics',type:'single',source:'practice',
 data:'Подписочный сервис имеет: средний чек 500 руб/мес, средний срок жизни клиента 10 месяцев, CAC = 3 500 руб.',
 text:'Без учёта переменных затрат на обслуживание, окупает ли типичный клиент свой CAC за время жизни?',
 options:['Нет: за 10 месяцев клиент принесёт 5 000 руб. выручки, что превышает CAC лишь незначительно, а с учётом переменных затрат на обслуживание модель может уйти в минус','Да, с большим запасом, беспокоиться не о чем','CAC вообще не нужно сравнивать с выручкой клиента','Недостаточно данных, чтобы вообще что-то сказать'],
 correct:0, explanation:'Выручка за срок жизни = 500×10=5 000 руб., что лишь немного выше CAC=3 500 руб. Как только вычитаются переменные затраты на обслуживание клиента (поддержка, инфраструктура и т.д.), запас прочности юнит-экономики может легко уйти в отрицательную зону — это повод присмотреться к LTV с учётом ВСЕХ затрат, а не только к сравнению выручки и CAC «на глаз».'},
];
const CASES = [
{
  id:'case1', title:'«СтартПроект»: денежный поток и потребность в финансировании', tags:['Денежные потоки','Источники финансирования'],
  given:`Компания «СтартПроект» планирует запуск нового направления бизнеса в 2026 году.
На начало 2026 года остаток средств на расчётном счёте = 200 у.е.
Проект финансируется за счёт текущей операционной деятельности и привлечённых средств в течение года.
Налог на прибыль: 25%.
Новое оборудование сразу передаётся в эксплуатацию, амортизируется линейным методом 5 лет.
Планируемая выручка: 60 000 у.е.
Себестоимость: 43 200 у.е.
Управленческие и коммерческие расходы: 10 000 у.е.
Капитальные вложения: 15 000 у.е.
Изменение чистого оборотного капитала: 5 000 у.е.
Плановое погашение кредита: 12 000 у.е.
Плановое привлечение гранта: 20 000 у.е.
Проценты по кредиту: 1 500 у.е.`,
  tasks:[
    '1. Определите денежный поток проекта.',
    '2. Требуется ли компании дополнительное финансирование, если нормативный остаток денежных средств не меняется (сохраняется как в начале года)? Если требуется — определите минимальную сумму.',
    '3. Основываясь на понимании чувствительности итоговых показателей к изменениям, дайте рекомендации: что в первую очередь улучшить в экономике проекта.'
  ],
  solution:`
  <div class="case-block"><h4>Шаг 1. Амортизация</h4>
  <div class="calc-line">Амортизация = CAPEX / срок = 15 000 / 5 = <b>3 000 у.е./год</b></div></div>

  <div class="case-block"><h4>Шаг 2. От выручки к чистой прибыли</h4>
  <div class="calc-line">EBIT = Выручка − Себестоимость − Упр./комм. расходы − Амортизация</div>
  <div class="calc-line">EBIT = 60 000 − 43 200 − 10 000 − 3 000 = <b>3 800 у.е.</b></div>
  <div class="calc-line">EBT = EBIT − Проценты = 3 800 − 1 500 = <b>2 300 у.е.</b></div>
  <div class="calc-line">Налог (25%) = 2 300 × 0,25 = <b>575 у.е.</b></div>
  <div class="calc-line">Чистая прибыль = 2 300 − 575 = <b>1 725 у.е.</b></div></div>

  <div class="case-block"><h4>Шаг 3. Операционный, инвестиционный и финансовый потоки</h4>
  <div class="calc-line">OCF = Чистая прибыль + Амортизация − ΔNWC = 1 725 + 3 000 − 5 000 = <b>−275 у.е.</b></div>
  <div class="calc-line">ICF = −CAPEX = <b>−15 000 у.е.</b></div>
  <div class="calc-line">CFF = Грант − Погашение кредита = 20 000 − 12 000 = <b>+8 000 у.е.</b></div>
  <div class="calc-line">Итоговый ЧДП за год = OCF + ICF + CFF = −275 − 15 000 + 8 000 = <b>−7 275 у.е.</b></div></div>

  <div class="case-block"><h4>Шаг 4. Остаток на конец года и потребность в финансировании</h4>
  <div class="calc-line">Остаток на конец года = 200 + (−7 275) = <b>−7 075 у.е.</b></div>
  <div class="calc-line">Нормативный остаток (как на начало года) = 200 у.е.</div>
  <div class="calc-line">Нехватка средств = 200 − (−7 075) = <b>≈ 7 275 у.е.</b></div>
  </div>
  <div class="callout"><b>Ответ на п.2:</b> собственных и запланированных средств НЕ хватает. Минимальная сумма дополнительного финансирования — около <b>7 275 у.е.</b>, чтобы закрыть кассовый разрыв и сохранить нормативный остаток на уровне начала года.</div>

  <div class="case-block"><h4>Шаг 5. Чувствительность и рекомендации (п.3)</h4>
  <p>Главный «рычаг» здесь — операционная маржа: себестоимость (43 200) составляет 72% от выручки (60 000), что оставляет EBIT всего 3 800 у.е. Даже небольшое снижение себестоимости или рост цены сильнее всего повлияет на денежный поток, так как проходит и через операционный поток, и через налог. Второй рычаг — ΔNWC = 5 000 у.е. (почти столько же, сколько вся чистая прибыль): ускорение оборачиваемости запасов/дебиторки высвободит деньги без каких-либо изменений в продажах. В первую очередь стоит: (1) пересмотреть себестоимость/цену для роста маржи, (2) сократить объём замороженных в оборотном капитале средств, и только затем — договариваться о переносе/реструктуризации погашения кредита.</p></div>
  `
},
{
  id:'case2', title:'Платформа для аренды и продажи дизайнерской мебели: канва, безубыточность, финансирование', tags:['Бизнес-модель','Юнит-экономика','Точка безубыточности','Источники финансирования'],
  given:`Стартап разрабатывает онлайн-платформу для аренды и продажи дизайнерской мебели.
Целевой сегмент A (B2B): корпоративные клиенты (офисы, коворкинги, гостиницы), аренда на долгосрочной основе.
Целевой сегмент B (B2C): частные клиенты, покупающие мебель через платформу.
Фиксированные расходы ≈ 40 000 000 руб./год (обслуживание платформы, склад, основная команда).
Прогноз: 300 корпоративных клиентов с арендной платой в среднем 10 000 руб./мес каждый, плюс 2 000 частных клиентов с покупками на 7 000 руб./год каждый.
Допущение задания: переменные затраты на обслуживание одного клиента = 50 000 руб./год.`,
  tasks:[
    '1. Составьте основные разделы канвы бизнес-модели, выделив сегменты B2B и B2C.',
    '2. Определите ключевые факторы успеха для масштабирования B2B и методы сегментации для B2C.',
    '3. Покажите базовый анализ безубыточности, объединяющий доходы B2B и B2C.',
    '4. Предложите два способа финансирования расширения ассортимента и покажите, как каждый влияет на денежный поток/долю основателя.',
    '5. Оцените, как измерять рентабельность инвестиций в новую коллекцию мебели.'
  ],
  solution:`
  <div class="case-block"><h4>1. Канва (ключевые блоки)</h4>
  <p><b>Потребительские сегменты:</b> A — B2B (офисы/коворкинги/гостиницы, долгосрочная аренда); B — B2C (частные покупатели). Это многосторонняя модель — оба сегмента должны прорабатываться отдельно.<br>
  <b>Ценностное предложение A:</b> дизайнерская мебель без CAPEX и без обязательств по владению, гибкость под рост/переезд офиса.<br>

/* ---------- Storage helpers: Claude artifact storage -> localStorage -> memory ---------- */
const MEM = {};
let STORAGE_MODE = 'memory'; // 'claude' | 'local' | 'memory'
async function detectStorageMode(){
  try{
    if(window.storage && typeof window.storage.set === 'function'){
      await window.storage.set('__bp_probe__','1',false);
      await window.storage.get('__bp_probe__',false);
      STORAGE_MODE = 'claude';
      return;
    }
  }catch(e){}
  try{
    localStorage.setItem('__bp_probe__','1');
    localStorage.removeItem('__bp_probe__');
    STORAGE_MODE = 'local';
    return;
  }catch(e){}
  STORAGE_MODE = 'memory';
}
async function stGet(key){
  if(STORAGE_MODE==='claude'){
    try{ const r = await window.storage.get(key,false); return r ? JSON.parse(r.value) : null; }
    catch(e){ return MEM[key] ?? null; }
  }
  if(STORAGE_MODE==='local'){
    try{ const v = localStorage.getItem('bp_'+key); return v ? JSON.parse(v) : null; }
    catch(e){ return MEM[key] ?? null; }
  }
  return MEM[key] ?? null;
}
async function stSet(key,val){
  if(STORAGE_MODE==='claude'){
    try{ await window.storage.set(key, JSON.stringify(val), false); return; }catch(e){}
  }
  if(STORAGE_MODE==='local'){
    try{ localStorage.setItem('bp_'+key, JSON.stringify(val)); return; }catch(e){}
  }
  MEM[key]=val;
}

/* ---------- Leitner-ish spaced repetition ---------- */
const BOX_DAYS = [0,1,3,7,16,35];
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function markResult(store, id, correct){
  const rec = store[id] || {box:0, seen:0, correct:0};
  rec.seen++;
  if(correct){ rec.correct++; rec.box = Math.min(rec.box+1,5); }
  else{ rec.box = 1; }
  rec.next = addDays(BOX_DAYS[Math.min(rec.box,5)]);
  store[id] = rec;
}
function isDue(store,id){
  const rec = store[id];
  if(!rec) return true;
  return rec.next <= todayISO();
}

function pluralDue(n){
  const m = n%10, m100=n%100;
  if(m100>=11&&m100<=14) return 'карточек';
  if(m===1) return 'карточка';
  if(m>=2&&m<=4) return 'карточки';
  return 'карточек';
}

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---------- Test session rendering ---------- */
function renderTestSession(v){
  const q = QUESTIONS.find(x=>x.id===v.ids[v.idx]);
  const pct = Math.round((v.idx)/v.ids.length*100);
  const isFav = FAVQ.includes(q.id);
  let optsHtml = '';
  if(q.type==='single' || q.type==='multi'){
    optsHtml = q.options.map((opt,i)=>{
      let cls='opt'+(q.type==='single'?' radio':'');
      const sel = Array.isArray(v.selected) ? v.selected.includes(i) : v.selected===i;
      if(sel) cls+=' selected';
      if(v.checked){
        const isCorrect = Array.isArray(q.correct) ? q.correct.includes(i) : q.correct===i;
        if(isCorrect) cls = cls.replace('selected','')+' correct';
        else if(sel) cls+=' incorrect';
      }
      return `<div class="${cls}" onclick="selectOption(${i})"><div class="mk">${v.checked && (Array.isArray(q.correct)?q.correct.includes(i):q.correct===i) ? '✓' : (v.checked && sel ? '✕' : '')}</div><div>${opt}</div></div>`;
    }).join('');
  } else if(q.type==='numeric'){
    optsHtml = `<input class="numinput" type="number" inputmode="decimal" id="numinput" placeholder="Введите число" value="${v.selected??''}" oninput="onNumInput(this.value)" ${v.checked?'disabled':''}> ${q.unit?`<div style="color:var(--text-faint);font-size:12.5px;margin-top:-8px;margin-bottom:14px">Единица измерения: ${q.unit}</div>`:''}`;
  }
  let explainHtml='';
  if(v.checked){
    const ok = isAnswerCorrect(q, v.selected);
    explainHtml = `<div class="explain"><div class="verdict ${ok?'ok':'bad'}">${ok?'Верно ✓':'Неверно'}</div><b>Разбор:</b> ${q.explanation}</div>`;
  }
  const hint = TOPIC_HINTS[q.topic];
  const hintHtml = (!v.checked && hint) ? `
    <div class="hint-btn" onclick="toggleHint()">${v.hintShown?'▲ Скрыть подсказку':'💡 Забыли метод? Показать формулу'}</div>
    ${v.hintShown?`<div class="hint-box"><b>Как решать вопросы по теме «${TOPICS.find(t=>t.key===q.topic)?.label}»:</b><br>${hint}</div>`:''}
  ` : '';
  return `
    <button class="back-btn" onclick="exitSession()">← Выйти из теста</button>
    <div class="qmeta"><span>${v.idx+1} / ${v.ids.length} · ${modeLabel(v.mode)}</span>
      <button class="fav-btn ${isFav?'active':''}" onclick="toggleFav('${q.id}')">${isFav?'★':'☆'}</button>
    </div>
    <div class="qprogress-track"><div class="qprogress-fill" style="width:${pct}%"></div></div>
    ${q.data?`<div class="qdata">${q.data}</div>`:''}
    <div class="qtext">${q.text}</div>
    ${hintHtml}
    ${optsHtml}
    ${explainHtml}
    <div style="height:16px"></div>
    ${!v.checked ? `<div class="btn btn-primary" onclick="checkAnswer()">Ответить</div>` :
      `<div class="btn btn-primary" onclick="nextQuestion()">${v.idx+1<v.ids.length?'Далее →':'Завершить'}</div>`}
    <div class="spacer-40"></div>
  `;
}
function modeLabel(m){ return {topic:'по теме', exam:'экзамен', review:'повторение', perfect:'до идеала', favorites:'избранное'}[m]||m; }

function selectOption(i){
  const v = STATE.view; if(v.checked) return;
  const q = QUESTIONS.find(x=>x.id===v.ids[v.idx]);
  if(q.type==='single'){ v.selected = i; }
  else { if(!Array.isArray(v.selected)) v.selected=[]; const idx=v.selected.indexOf(i); if(idx>-1) v.selected.splice(idx,1); else v.selected.push(i); }
  render();
}
function onNumInput(val){ STATE.view.selected = val; }
function isAnswerCorrect(q, sel){
  if(q.type==='single') return sel===q.correct;
  if(q.type==='multi'){
    if(!Array.isArray(sel)) return false;
    const a=[...sel].sort(), b=[...q.correct].sort();
    return a.length===b.length && a.every((x,i)=>x===b[i]);
  }
  if(q.type==='numeric'){
    const n = parseFloat(String(sel).replace(',','.'));
    if(isNaN(n)) return false;
    return Math.abs(n-q.answer) <= (q.tolerance ?? Math.abs(q.answer*0.03));
  }
  return false;
}
function checkAnswer(){
  const v = STATE.view;
  const q = QUESTIONS.find(x=>x.id===v.ids[v.idx]);
  const ok = isAnswerCorrect(q, v.selected);
  v.checked = true;
  v.answers[q.id]=ok;
  if(ok) v.correct++;
  markResult(PROGRESS, q.id, ok);
  saveProgress();
  render();
}
function nextQuestion(){
  const v = STATE.view;
  if(v.idx+1 < v.ids.length){ v.idx++; v.selected=null; v.checked=false; v.hintShown=false; render(); }
  else { pushView({type:'test-result', ids:v.ids, correct:v.correct, mode:v.mode}); }
}
function toggleHint(){ STATE.view.hintShown = !STATE.view.hintShown; render(); }
function exitSession(){ nav('tests'); }
function toggleFav(qid){
  const i = FAVQ.indexOf(qid);
  if(i>-1) FAVQ.splice(i,1); else FAVQ.push(qid);
  saveFavQ(); render();
}

function renderTestResult(v){
  const pct = Math.round(v.correct/v.ids.length*100);
  const color = pct>=80?'var(--teal)':pct>=50?'var(--gold)':'var(--coral)';
  return `
    <h1 class="screen-title" style="text-align:center">Результат</h1>
    <div class="result-ring"><svg viewBox="0 0 140 140" width="140" height="140">
      <circle cx="70" cy="70" r="60" fill="none" stroke="var(--surface-2)" stroke-width="10"/>
      <circle cx="70" cy="70" r="60" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${2*Math.PI*60}" stroke-dashoffset="${2*Math.PI*60*(1-pct/100)}" transform="rotate(-90 70 70)"/>
    </svg><div class="result-pct">${pct}%</div></div>
    <div class="stat-row">
      <div class="stat-box"><div class="n" style="color:var(--teal)">${v.correct}</div><div class="l">верно</div></div>
      <div class="stat-box"><div class="n" style="color:var(--coral)">${v.ids.length-v.correct}</div><div class="l">ошибок</div></div>
      <div class="stat-box"><div class="n">${v.ids.length}</div><div class="l">всего</div></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="nav('tests')">К тестам</button>
      <button class="btn btn-primary" onclick='openTestSession(${JSON.stringify(v.ids)},"${v.mode}")'>Пройти ещё раз</button>
    </div>
    <div class="spacer-40"></div>
  `;
}

  const si = storageInfo[STORAGE_MODE] || storageInfo.memory;
  return `
    <h1 class="screen-title">Ещё</h1>
    <div class="card" style="display:flex;gap:10px;align-items:flex-start">
      <div style="font-size:18px">${si.icon}</div>
      <div style="font-size:12.5px;color:var(--text-dim);line-height:1.5">${si.text}</div>
    </div>
    <div class="card">
      <div class="section-label" style="margin-top:0">Статистика</div>
      <div class="stat-row">
        <div class="stat-box"><div class="n">${totalSeen}</div><div class="l">вопросов пройдено</div></div>
        <div class="stat-box"><div class="n">${acc}%</div><div class="l">точность</div></div>
        <div class="stat-box"><div class="n">${Object.keys(GPROGRESS).length}</div><div class="l">терминов изучено</div></div>
      </div>
    </div>
    <div class="card">
      <div class="lec-row card-tap" onclick="pushView({type:'cases'})"><div class="lec-info"><div class="lec-title">💼 Экзаменационные кейсы</div></div></div>
      <div class="lec-row card-tap" onclick="openFavorites()"><div class="lec-info"><div class="lec-title">★ Избранные вопросы (${FAVQ.length})</div></div></div>
      <div class="lec-row card-tap" onclick="pushView({type:'fav-terms'})"><div class="lec-info"><div class="lec-title">★ Избранные термины (${FAVT.length})</div></div></div>
      <div class="lec-row card-tap" onclick="openFlashcards(null)"><div class="lec-info"><div class="lec-title">🗂 Все карточки глоссария</div></div></div>
    </div>
    <div class="card">
      <div class="lec-row card-tap" onclick="pushView({type:'reset-confirm'})"><div class="lec-info"><div class="lec-title" style="color:var(--coral)">Сбросить весь прогресс</div></div></div>
    </div>
    <p style="text-align:center;color:var(--text-faint);font-size:11.5px;margin-top:10px">0326_Проектный семинар «Бизнес-планирование» · ВШБ ВШЭ</p>
    <div class="spacer-40"></div>
  `;
}
function resetProgress(){
  PROGRESS={}; GPROGRESS={}; FAVQ=[]; FAVT=[];
  saveProgress(); saveGProgress(); saveFavQ(); saveFavT();
  nav('more');
}

/* ================= VIEW ROUTER ================= */
function renderView(v){
  if(v.type==='conspect') return renderConspectDetail(v.lecture);
  if(v.type==='test-session') return renderTestSession(v);
  if(v.type==='test-result') return renderTestResult(v);
  if(v.type==='cases') return renderCasesList();
  if(v.type==='case-detail') return renderCaseDetail(v.id);
  if(v.type==='flashcards') return renderFlashcards(v);
  if(v.type==='flashcards-done') return `<div class="empty-state"><div class="ic">✅</div><h3>Карточки пройдены</h3><p style="margin-top:8px">Разобрано: ${v.total}</p><div class="btn btn-primary" style="margin-top:16px;max-width:240px;margin-left:auto;margin-right:auto" onclick="nav('glossary')">К глоссарию</div></div>`;
  if(v.type==='favorites'){
    if(v.qs.length===0) return `<button class="back-btn" onclick="nav('tests')">← Тесты</button><div class="empty-state"><div class="ic">☆</div><h3>Пока нет избранных вопросов</h3><p>Нажимайте ★ во время теста, чтобы сохранить вопрос сюда.</p></div>`;
    return `<button class="back-btn" onclick="nav('tests')">← Тесты</button><h1 class="screen-title">Избранные вопросы</h1>
      <div class="btn btn-primary" style="margin-bottom:14px" onclick='openTestSession(${JSON.stringify(v.qs)},"favorites")'>Пройти все (${v.qs.length}) →</div>
      <div class="card">${v.qs.map(id=>{const q=QUESTIONS.find(x=>x.id===id); return `<div class="term-row"><div class="term-def">${q.text}</div></div>`;}).join('')}</div><div class="spacer-40"></div>`;
  }
  if(v.type==='fav-terms'){
    const terms = GLOSSARY.filter(t=>FAVT.includes(t.id));
    if(terms.length===0) return `<button class="back-btn" onclick="nav('more')">← Ещё</button><div class="empty-state"><div class="ic">☆</div><h3>Пока нет избранных терминов</h3></div>`;
    return `<button class="back-btn" onclick="nav('more')">← Ещё</button><h1 class="screen-title">Избранные термины</h1><div class="card">${terms.map(t=>`<div class="term-row"><div class="term-name">${t.term}</div><div class="term-def">${t.def}</div></div>`).join('')}</div><div class="spacer-40"></div>`;
  }
  if(v.type==='empty-set') return `<button class="back-btn" onclick="nav('tests')">← Тесты</button><div class="empty-state"><div class="ic">🎉</div><h3>Здесь пока нечего решать</h3></div>`;
  if(v.type==='review-empty') return `<button class="back-btn" onclick="nav('home')">← Обзор</button><div class="empty-state"><div class="ic">✅</div><h3>На сегодня повторять нечего</h3><p>Возвращайтесь позже — карточки появятся по расписанию.</p></div>`;
  if(v.type==='perfect-empty') return `<button class="back-btn" onclick="nav('tests')">← Тесты</button><div class="empty-state"><div class="ic">🎯</div><h3>Ошибок пока нет</h3><p>Режим «До идеала» соберёт сюда все вопросы, где вы ошиблись.</p></div>`;
  if(v.type==='reset-confirm') return `<button class="back-btn" onclick="nav('more')">← Ещё</button><div class="empty-state"><div class="ic">⚠️</div><h3>Сбросить весь прогресс?</h3><p>Это удалит статистику по всем вопросам, карточкам и избранное. Действие необратимо.</p>
    <div class="btn-row" style="margin-top:18px;max-width:320px;margin-left:auto;margin-right:auto"><button class="btn btn-ghost" onclick="nav('more')">Отмена</button><button class="btn" style="background:var(--coral);border-color:var(--coral);color:#2b0a0f" onclick="resetProgress()">Сбросить</button></div></div>`;
  return '<div class="empty-state">Экран не найден</div>';
}

loadAll().then(render);
</script>
</body>
</html>
