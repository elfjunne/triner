<div class="callout"><b>Главный дисквалифицирующий признак:</b> у самозанятого <b>не может быть наёмных сотрудников</b>. Если в условии задачи компания кого-то нанимает — вариант «Самозанятый (НПД)» отпадает сразу, даже не считая цифры. Также нельзя перепродавать чужие товары и работать по трудовому договору с бывшим работодателем в течение двух лет.</div>

<h3>3.4. Алгоритм выбора режима: пошагово</h3>
<p>Экзаменационные задачи на выбор ОПФ и налогообложения решаются одним и тем же алгоритмом. Отработайте его до автоматизма.</p>
<ol>
  <li><b>Отсеките физически невозможные варианты.</b> ООО с ПСН или НПД — невозможно. Самозанятость при наличии сотрудников — невозможно. Часто это сразу убирает 2–3 варианта из 6.</li>
  <li><b>Посчитайте годовую выручку.</b> Внимательно: если в условии «услуги 34 компаниям со средним чеком 98 000», то это 34 × 98 000, а не 98 000.</li>
  <li><b>Посчитайте ФОТ помесячно.</b> Главная ловушка: сотрудники, нанятые «во втором полугодии», работают 6 месяцев, а не 12. Считайте отдельно: (основной штат × 12) + (новые × 6).</li>
  <li><b>Добавьте страховые взносы</b> — обычно 30% от ФОТ. Их часто забывают, а это крупная сумма.</li>
  <li><b>Добавьте аренду</b> — тоже с учётом того, что дополнительное помещение могли арендовать не с начала года.</li>
  <li><b>Добавьте прочие расходы.</b></li>
  <li><b>Посчитайте долю расходов в выручке</b> и сравните с порогом 60%.</li>
  <li><b>Проверьте фактор НДС:</b> если контрагенты на ОСНО и им нужен вычет — ОСНО может быть оправдана несмотря на более высокую нагрузку.</li>
</ol>

<h4>Полный разбор задачи 1: ООО «Гамма»</h4>
<p><b>Условие.</b> Продажи: товар P — 1 300 000 руб., товар Q — 1 900 000 руб., услуги консультирования 38 компаниям со средним чеком 105 000 руб. Штат с начала года: 4 сотрудника с зарплатами 33, 39, 52 и 62 тыс. руб./мес. Аренда офиса 75 000 руб./мес. Во втором полугодии наняли 2 специалистов по 72 тыс. руб./мес и арендовали помещение за 22 тыс. руб./мес. Страховые взносы 30% от ФОТ. Дополнительные расходы 90 000 руб. в год.</p>
<div class="calc-line">Выручка = 1 300 000 + 1 900 000 + 38 × 105 000 = 1 300 000 + 1 900 000 + 3 990 000 = <b>7 190 000 руб.</b></div>
<div class="calc-line">ФОТ основного штата = (33+39+52+62) × 12 = 186 000 × 12 = <b>2 232 000 руб.</b></div>
<div class="calc-line">ФОТ новых (только 6 мес.) = 72 000 × 2 × 6 = <b>864 000 руб.</b></div>
<div class="calc-line">ФОТ всего = 2 232 000 + 864 000 = <b>3 096 000 руб.</b></div>
<div class="calc-line">Страховые взносы = 3 096 000 × 30% = <b>928 800 руб.</b></div>
<div class="calc-line">Аренда = 75 000 × 12 + 22 000 × 6 = 900 000 + 132 000 = <b>1 032 000 руб.</b></div>
<div class="calc-line">Расходы всего = 3 096 000 + 928 800 + 1 032 000 + 90 000 = <b>5 146 800 руб.</b></div>
<div class="calc-line">Доля расходов = 5 146 800 / 7 190 000 ≈ <b>71,6%</b> → выше порога 60%</div>
<div class="calc-line">Налог УСН «Д−Р» = (7 190 000 − 5 146 800) × 15% = 2 043 200 × 15% = <b>306 480 руб.</b></div>
<div class="calc-line">Налог УСН «Доходы» = 7 190 000 × 6% = <b>431 400 руб.</b></div>
<div class="calc-line">Выгода «Д−Р» = 431 400 − 306 480 = <b>124 920 руб.</b></div>
<p><b>Ответ:</b> выгоднее УСН «Доходы минус расходы», экономия ≈125 тыс. руб. в год.</p>

<h4>Полный разбор задачи 2: ООО «Дельта»</h4>
<p><b>Условие.</b> Товар M — 1 450 000, товар N — 1 750 000, услуги 34 компаниям по 98 000. Штат: 4 сотрудника (36, 41, 56, 66 тыс./мес), аренда 82 000/мес. Во 2-м полугодии: 2 специалиста по 76 тыс./мес и помещение за 26 тыс./мес. Взносы 30%. Прочие расходы 110 000/год.</p>
<div class="calc-line">Выручка = 1 450 000 + 1 750 000 + 34 × 98 000 (=3 332 000) = <b>6 532 000 руб.</b></div>
<div class="calc-line">ФОТ = (36+41+56+66) × 12 (=2 388 000) + 76 000 × 2 × 6 (=912 000) = <b>3 300 000 руб.</b></div>
<div class="calc-line">Взносы = 3 300 000 × 30% = <b>990 000 руб.</b></div>
<div class="calc-line">Аренда = 82 000 × 12 + 26 000 × 6 = 984 000 + 156 000 = <b>1 140 000 руб.</b></div>
<div class="calc-line">Расходы = 3 300 000 + 990 000 + 1 140 000 + 110 000 = <b>5 540 000 руб.</b> (≈85% выручки)</div>
<div class="calc-line">Налог «Д−Р» = (6 532 000 − 5 540 000) × 15% = 992 000 × 15% ≈ <b>148 800 руб.</b></div>
<div class="calc-line">Налог «Доходы» = 6 532 000 × 6% ≈ <b>391 920 руб.</b></div>
<p><b>Ответ:</b> УСН «Доходы минус расходы» — выгоднее более чем вдвое. ПСН для ООО невозможна в принципе.</p>

<p><b>Разбор вариантов:</b> Самозанятость отпадает — есть наёмный ассистент. «Доходы минус расходы» невыгодны — вычитать почти нечего. ООО избыточно — нет партнёров и инвесторов, а администрирование дороже. ПСН — маркетинговый консалтинг обычно не входит в перечень видов деятельности для патента. <b>Ответ: ИП и УСН «Доходы» (6%).</b></p>

<h4>Разбор: два друга открывают онлайн-школу</h4>
<p><b>Условие.</b> Совместный бизнес в образовании, не уверены в успехе, хотят начать быстро и с минимальными вложениями, расходов почти нет, продвижение только через соцсети, друг другу полностью доверяют.</p>

<h3>3.5. Расчёт налогов: типовые задачи</h3>
<h4>УСН</h4>
<div class="formula">УСН «Доходы»: Налог = Выручка × 6% (расходы НЕ вычитаются)</div>
<div class="formula">УСН «Д−Р»: Налог = (Доходы − Расходы) × 15%</div>
<p>Пример: доходы 10 000 тыс., расходы 7 000 тыс. → налог = (10 000 − 7 000) × 15% = <b>450 тыс. руб.</b></p>

<h4>Налог на прибыль (ОСНО)</h4>
<div class="formula">Налог на прибыль = (Выручка без НДС − Расходы без НДС) × ставка</div>
<p>Пример: выручка 10 млн, затраты 6 млн, ставка 25% → (10 − 6) × 25% = <b>1 млн руб.</b></p>

<h4>НДС: в обе стороны</h4>
<p>Это место, где ошибаются чаще всего. Разберём оба направления.</p>
<div class="formula">Начислить НДС на цену БЕЗ НДС: Цена с НДС = Цена без НДС × (1 + ставка)</div>
<p>Пример: товар 3 000 руб. без НДС, ставка 22% → 3 000 × 1,22 = <b>3 660 руб.</b></p>
<div class="formula">Выделить НДС из цены С НДС: Цена без НДС = Цена с НДС / (1 + ставка); НДС = Цена с НДС − Цена без НДС</div>
<p>Пример: выручка с НДС 12 200 тыс., ставка 22% → без НДС = 12 200 / 1,22 = 10 000 тыс.; НДС = 12 200 − 10 000 = <b>2 200 тыс. руб.</b></p>
<div class="callout"><b>Ошибка на миллион:</b> умножить 12 200 × 22% = 2 684 и назвать это суммой НДС. Так считать нельзя: 22% берётся от базы БЕЗ НДС, а 12 200 — это уже 122% от базы. Всегда спрашивайте себя: сумма в условии — это 100% или 122%?</p></div>

<h4>Налог с дохода по вкладу</h4>
<div class="formula">Налог = (Доход по вкладу − Необлагаемая база) × 13%, где Необлагаемая база = Ключевая ставка ЦБ × 1 000 000 руб.</div>
<p>Пример: 20 млн под 15% годовых на год, ключевая ставка 15%.</p>
<div class="calc-line">Доход = 20 000 000 × 15% = 3 000 000 руб.</div>
<div class="calc-line">Необлагаемая база = 15% × 1 000 000 = 150 000 руб.</div>
<div class="calc-line">Налог = (3 000 000 − 150 000) × 13% = 2 850 000 × 13% = <b>370 500 руб.</b></div>

<h4>НПД</h4>
<p>Доход 2 000 тыс. руб. от юрлиц → ставка 6% → налог = <b>120 тыс. руб.</b> Если бы клиентами были физлица — ставка 4% и налог 80 тыс. руб. Всегда смотрите, с кем работает самозанятый.</p>

<h4>Базовая логика</h4>
<p>В точке безубыточности выручка равна суммарным затратам, прибыль равна нулю. Вводим понятие <b>маржинального дохода</b> — это то, что остаётся от цены после покрытия переменных затрат и идёт на покрытие постоянных.</p>
<div class="formula">Маржинальный доход на единицу = Цена − VC на единицу</div>
<div class="formula">Q* = FC / (Цена − VC на единицу) = FC / Маржинальный доход на единицу</div>
<div class="formula">Точка безубыточности в деньгах = Q* × Цена</div>

<h4>Модификация под целевую прибыль</h4>
<div class="formula">Q(целевая) = (FC + Целевая прибыль) / (Цена − VC на единицу)</div>
<p>Логика: целевая прибыль добавляется к постоянным затратам, как будто это ещё один расход, который надо покрыть. Округление в задачах на количество — всегда <b>вверх</b>: нельзя продать 722,2 единицы, нужно 723.</p>

<h4>Запас финансовой прочности</h4>
<div class="formula">Запас прочности в единицах = Фактический объём − Q*</div>
<div class="formula">Запас прочности в % = (Фактический объём − Q*) / Фактический объём × 100%</div>
<p>Показывает, насколько может упасть спрос, прежде чем компания уйдёт в убыток. Внимательно читайте, что просят — штуки или проценты, это разные ответы.</p>

<h4>Разбор задачи 1: когда дана общая сумма VC</h4>
<p><b>Условие:</b> FC = 420 000 руб., VC = 560 000 руб., выручка 1 300 000 руб., цена единицы 76 000 руб.</p>
<p>Сложность в том, что VC дана общей суммой, а формула требует VC на единицу. Сначала находим количество:</p>
<div class="calc-line">Продано единиц = Выручка / Цена = 1 300 000 / 76 000 ≈ <b>17,1 ед.</b></div>
<div class="calc-line">VC на единицу = 560 000 / 17,1 ≈ <b>32 748 руб.</b></div>
<div class="calc-line">Маржинальный доход = 76 000 − 32 748 ≈ <b>43 252 руб.</b></div>
<div class="calc-line">Q* = 420 000 / 43 252 ≈ 9,7 ≈ <b>10 единиц</b></div>

<h4>Разбор задачи 2: доставка цветов (целевая прибыль)</h4>
<p><b>Условие:</b> цена букета 4 000 руб., VC на букет 1 950 руб., постоянные расходы 180 000 руб./мес плюс аренда авто с водителем 120 000 руб./мес, цель — прибыль 800 000 руб./мес.</p>
<div class="calc-line">Маржинальный доход = 4 000 − 1 950 = <b>2 050 руб./букет</b></div>
<div class="calc-line">FC всего = 180 000 + 120 000 = <b>300 000 руб.</b></div>
<div class="calc-line">Нужный маржинальный доход = 300 000 + 800 000 = <b>1 100 000 руб.</b></div>
<div class="calc-line">Количество = 1 100 000 / 2 050 ≈ 536,6 → <b>537 букетов</b></div>

<h4>Разбор задачи 3: кофейня (запас прочности)</h4>
<p><b>Условие:</b> средний чек 350 руб., VC на набор 120 руб., FC 350 000 руб./мес, план продаж 1 800 наборов.</p>
<div class="calc-line">Маржинальный доход = 350 − 120 = <b>230 руб.</b></div>
<div class="calc-line">Q* = 350 000 / 230 ≈ 1 521,7 → <b>1 522 набора</b></div>
<div class="calc-line">Запас прочности в штуках = 1 800 − 1 522 = <b>278 наборов</b></div>
<div class="calc-line">Запас прочности в % = 278 / 1 800 ≈ <b>15,4%</b></div>

<h4>Разбор задачи 4: развлекательный центр</h4>
<p><b>Условие:</b> цена сеанса 1 200 руб., VC 300 руб., FC 500 000 руб./мес.</p>
<div class="calc-line">Q* = 500 000 / (1 200 − 300) = 500 000 / 900 ≈ 555,6 → <b>556 сеансов</b></div>
<div class="calc-line">Под прибыль 150 000: (500 000 + 150 000) / 900 ≈ 722,2 → <b>723 сеанса</b></div>

<h4>Что влияет на точку безубыточности</h4>
<table>
  <tr><th>Изменение</th><th>Влияние на Q*</th><th>Почему</th></tr>
  <tr><td>Выросла аренда (FC ↑)</td><td>Растёт</td><td>Q* прямо пропорциональна FC</td></tr>
  <tr><td>Подорожало сырьё (VC ↑)</td><td>Растёт</td><td>Маржинальный доход в знаменателе падает</td></tr>
  <tr><td>Подняли цену</td><td>Падает</td><td>Маржинальный доход растёт</td></tr>
  <tr><td>Дали скидку</td><td>Растёт</td><td>Маржинальный доход падает — скидки опаснее, чем кажутся</td></tr>
</table>
<div class="callout"><b>Тонкий момент про проценты.</b> Если компания продаёт на 30% больше, чем требует БЕЗУБЫТОЧНОСТЬ, то запас прочности НЕ равен 30%. Факт = 130% от БЕП, и запас = (130 − 100)/130 ≈ 23%. Проценты считаются от ФАКТИЧЕСКОГО объёма, а не от точки безубыточности.</div>

<h3>4.5. Теория ограничений и масштабирование</h3>
<p><b>Основной тезис:</b> производительность всей системы определяется её самым узким местом (bottleneck), а не средним или максимальным значением по этапам.</p>
<p>Пример: гриль жарит 100 бургеров в час, упаковщик упаковывает 50 в час. Реальная производительность линии — <b>50 бургеров в час</b>, независимо от того, насколько мощный гриль. Всё, что произведено сверх 50, копится в очереди перед упаковкой.</p>
<h4>Практические следствия</h4>
<ul>
  <li><b>Автоматизировать нужно узкое место</b>, а не случайный или самый удобный этап. Инвестиции во второй гриль не дадут ничего.</li>
  <li><b>После расшивки узкого места оно перемещается.</b> Ускорили упаковку до 120 в час — теперь ограничением стал гриль (100). Процесс поиска ограничений — циклический.</li>
  <li><b>Излишняя мощность на неузких этапах — замороженные деньги.</b> Она не увеличивает выпуск, но требует затрат.</li>
</ul>
<p>Пять шагов теории ограничений: найти ограничение → максимально использовать его возможности → подчинить всё остальное ритму ограничения → расширить ограничение → вернуться к шагу 1, не позволяя инерции стать новым ограничением.</p>

<h3>4.6. CAPEX, OPEX и амортизация</h3>
<table>
  <tr><th></th><th>CAPEX (капитальные затраты)</th><th>OPEX (операционные затраты)</th></tr>
  <tr><td>Что это</td><td>Вложения в долгосрочные активы</td><td>Регулярные расходы на текущую деятельность</td></tr>
  <tr><td>Примеры</td><td>Покупка оборудования, недвижимости, транспорта, капитальный ремонт</td><td>Аренда, зарплата, материалы, коммунальные, реклама</td></tr>
  <tr><td>Как попадает в затраты</td><td>Постепенно, через амортизацию в течение срока полезного использования</td><td>Сразу в периоде возникновения</td></tr>
  <tr><td>В каком потоке</td><td>Инвестиционный денежный поток</td><td>Операционный денежный поток</td></tr>
</table>

<h4>Амортизация: ключевое понятие для всего дальнейшего курса</h4>
<div class="formula">Амортизация (линейный метод) = Стоимость актива / Срок полезного использования</div>
<p>Пример: оборудование 15 000 у.е., срок 5 лет → амортизация 3 000 у.е. в год.</p>
<div class="callout"><b>Двойственная природа амортизации — запомнить обязательно.</b><br>
В отчёте о прибылях и убытках (P&amp;L) амортизация — это <b>расход</b>: она уменьшает прибыль и, соответственно, налог на прибыль.<br>
В отчёте о движении денежных средств амортизация — <b>НЕ отток денег</b>: деньги ушли один раз, когда покупали актив. Поэтому при переходе от прибыли к денежному потоку амортизацию <b>прибавляют обратно</b>.<br>
Это объясняет, почему прибыльная компания может испытывать нехватку денег и наоборот.</div>

<h4>Make or Buy и лизинг</h4>

  <tr><td>Производить самим (Make)</td><td>Контроль качества и сроков, защита know-how, выше маржа при масштабе</td><td>Высокий CAPEX, риск недозагрузки, нужна компетенция</td></tr>

</table>

<h3>4.7. Юнит-экономика</h3>
<p><b>Юнит-экономика</b> — анализ прибыльности бизнеса в расчёте на одну единицу: клиента, заказ, товар, сеанс. Отвечает на вопрос: приносит ли прибыль ОДНА транзакция?</p>
<div class="callout"><b>Зачем это нужно.</b> Классический анализ по компании целиком плохо показывает жизнеспособность растущих бизнесов: убыток может объясняться инвестициями в рост, а может — тем, что каждая продажа убыточна. Если экономика юнита отрицательна, масштабирование лишь УМНОЖАЕТ убытки: продавая вдвое больше, компания теряет вдвое больше.</div>

<h4>Базовые метрики</h4>
<div class="formula">LTV = Средний чек × Частота покупок × Срок жизни клиента − Переменные затраты на клиента</div>
<div class="formula">CAC = Затраты на маркетинг и продажи / Число привлечённых клиентов</div>
<div class="formula">CAC Payback = CAC / Прибыль с клиента за период (в норме менее 12 месяцев)</div>
<table>
  <tr><th>LTV / CAC</th><th>Оценка</th><th>Что делать</th></tr>
  <tr><td>Меньше 1</td><td>Модель нежизнеспособна</td><td>Клиент не окупает своё привлечение — менять модель, а не масштабировать</td></tr>
  <tr><td>1–3</td><td>Требует оптимизации</td><td>Снижать CAC или повышать LTV (чек, частоту, удержание)</td></tr>
  <tr><td>3–5</td><td>Хорошая модель</td><td>Можно масштабировать</td></tr>
  <tr><td>Больше 5</td><td>Отличная модель</td><td>Возможно, недоинвестируем в рост — стоит увеличить маркетинг</td></tr>
</table>

<h4>Разбор кейса: платформа аренды дизайнерской мебели</h4>
<p><b>Условие:</b> B2B — 300 корпоративных клиентов по 10 000 руб./мес аренды; B2C — 2 000 частных клиентов с покупками на 7 000 руб./год; FC ≈ 40 млн руб./год; допущение задачи: переменные затраты на обслуживание одного клиента = 50 000 руб./год для ЛЮБОГО клиента.</p>
<div class="calc-line">Выручка B2B = 300 × 10 000 × 12 = <b>36 000 000 руб./год</b></div>
<div class="calc-line">Выручка B2C = 2 000 × 7 000 = <b>14 000 000 руб./год</b></div>
<div class="calc-line">Совокупная выручка = <b>50 000 000 руб.</b></div>
<div class="calc-line">Переменные затраты = 2 300 клиентов × 50 000 = <b>115 000 000 руб.</b></div>
<div class="calc-line">Маржинальный доход = 50 000 000 − 115 000 000 = <b>−65 000 000 руб.</b></div>
<div class="callout"><b>Как правильно интерпретировать этот результат.</b> Маржинальный доход отрицателен — значит, точки безубыточности не существует ни при каком объёме. Но правильный вывод не «проект провальный», а «допущение нереалистично». B2C-клиент платит 7 000 руб. в год, а обслуживание якобы стоит 50 000 — то есть каждый такой клиент приносит 43 000 руб. убытка. Единая усреднённая ставка переменных затрат для двух совершенно разных сегментов — методологическая ошибка. Правильный шаг: считать юнит-экономику РАЗДЕЛЬНО по B2B и B2C. Это ровно та ситуация, где формальный расчёт без понимания бизнеса даёт бессмысленный результат.</div>

<h3>4.8. Управление запасами и оборотным капиталом</h3>
<p><b>Чистый оборотный капитал (NWC)</b> = Запасы + Дебиторская задолженность − Кредиторская задолженность. Это деньги, «замороженные» в операционном цикле.</p>
<div class="callout"><b>Рост NWC — это ОТТОК денег</b>, даже если прибыль растёт. Логика: товар уже закуплен (деньги ушли), но ещё не продан; или продан, но клиент ещё не заплатил. Прибыль в P&amp;L есть, а денег на счету нет. Именно поэтому в формуле свободного денежного потока изменение NWC вычитается.</div>
<p>Три рычага управления: ускорить оборачиваемость запасов (не держать лишнего на складе), сократить дебиторскую задолженность (быстрее получать деньги от клиентов), увеличить кредиторскую (договориться об отсрочке с поставщиками).</p>

<h3>4.9. Описание бизнес-процессов</h3>
<p>Операционный план начинается с описания того, как устроена работа. В бизнес-плане процессы описывают на двух уровнях.</p>
<h4>Верхний уровень: карта процессов</h4>
<p>Все процессы компании делят на три группы:</p>
<table>
  <tr><th>Группа</th><th>Что включает</th><th>Пример для кофейни</th></tr>
  <tr><td><b>Основные</b> (создают ценность для клиента)</td><td>Закупка, производство, продажа, обслуживание</td><td>Закупка зерна, обжарка, приготовление напитка, обслуживание гостя</td></tr>
  <tr><td><b>Обеспечивающие</b> (поддерживают основные)</td><td>Найм, обучение, IT, закупка расходников, уборка</td><td>Найм бариста, обучение стандартам, обслуживание кофемашины</td></tr>
  <tr><td><b>Управленческие</b> (планирование и контроль)</td><td>Планирование, бюджетирование, контроль качества, отчётность</td><td>Планирование закупок, контроль выручки, инвентаризация</td></tr>
</table>
<h4>Нижний уровень: описание конкретного процесса</h4>
<p>Для ключевых процессов описывают: вход (что поступает на входе), последовательность шагов, ответственных на каждом шаге, длительность шагов, выход (результат), точки контроля качества и метрики процесса.</p>
<p>Практическая ценность такого описания для бизнес-плана — оно позволяет посчитать реальную мощность и увидеть узкие места ещё до запуска, а также обосновать штатное расписание: сколько людей нужно на каждом шаге при заданном объёме.</p>

<h3>4.10. Планирование производственной мощности</h3>
<div class="formula">Мощность = Количество единиц оборудования × Время работы × Производительность в час × Коэффициент использования</div>
<p>Три вида мощности, которые важно различать:</p>
<ul>
  <li><b>Проектная (максимальная)</b> — сколько система может выпустить в идеальных условиях без остановок.</li>
  <li><b>Эффективная</b> — с учётом обязательных перерывов, переналадок, планового обслуживания.</li>
  <li><b>Фактическая</b> — сколько реально производится с учётом простоев, брака, нехватки заказов.</li>
</ul>
<div class="formula">Коэффициент использования мощности = Фактический выпуск / Проектная мощность × 100%</div>
<p>В бизнес-плане важно показать, что запланированный объём продаж физически достижим при имеющемся оборудовании и персонале. Типичная ошибка новичка — построить прогноз продаж, который превышает производственные возможности, и не заметить этого.</p>
<h4>Резерв мощности</h4>
<p>Планировать загрузку на 100% опасно: не остаётся места ни для роста спроса, ни для поломки, ни для срочного заказа. Обычно закладывают резерв 10–20%. Но и слишком большой резерв — это замороженные деньги в неиспользуемом оборудовании.</p>

<h3>4.11. Работа с поставщиками</h3>
<p>Раздел бизнес-плана должен отвечать на вопросы: кто наши поставщики, насколько мы от них зависим, что будет, если поставщик подведёт.</p>
<table>
  <tr><th>Критерий выбора поставщика</th><th>На что влияет</th></tr>
  <tr><td>Цена и условия оплаты</td><td>Себестоимость и оборотный капитал (отсрочка платежа = бесплатное финансирование)</td></tr>
  <tr><td>Стабильность качества</td><td>Брак, возвраты, репутация</td></tr>
  <tr><td>Сроки и надёжность поставок</td><td>Простои производства, размер страхового запаса</td></tr>
  <tr><td>Минимальный объём заказа</td><td>Замороженные в запасах деньги</td></tr>
  <tr><td>Географическая близость</td><td>Логистика, скорость реакции</td></tr>
</table>
<div class="callout"><b>Связь с моделью Портера.</b> Зависимость от единственного поставщика — это прямое усиление его рыночной власти. Если у компании нет альтернатив, поставщик может поднимать цену, и компания это примет. Поэтому в бизнес-плане стоит показывать наличие альтернативных поставщиков как меру снижения риска — это ценится инвесторами.</div>
<h4>Управление запасами</h4>
<p>Два противоположных риска: слишком большой запас замораживает деньги и может испортиться; слишком маленький — приводит к простоям и потерянным продажам. Компромисс описывается через страховой запас и точку перезаказа.</p>
<div class="formula">Точка перезаказа = Средний расход в день × Срок поставки в днях + Страховой запас</div>

<h3>4.12. Качество и контроль</h3>
<p>В бизнес-плане описывают, как компания обеспечивает стабильное качество: на каких этапах происходит контроль, какие параметры проверяются, что делают с браком, есть ли сертификация.</p>
<p><b>Важная экономическая мысль:</b> стоимость исправления дефекта растёт по мере продвижения по цепочке. Брак, найденный на входном контроле сырья, стоит копейки. Тот же брак, найденный клиентом, стоит возврата, компенсации и репутационного ущерба. Поэтому экономия на контроле качества почти всегда оказывается ложной — это ровно та ошибка, которую содержит вариант «перевести специалиста по контролю качества на неполный день» в кейсе пивоварни.</p>

<h3>4.13. Сезонность и планирование по периодам</h3>
<p>Многие бизнесы имеют выраженную сезонность: цветы (пики в феврале и марте), туризм, строительство, образование. Игнорирование сезонности в модели даёт две ошибки.</p>
<ul>
  <li><b>Ошибка мощности:</b> средний спрос требует 3 сотрудников, но в пик нужно 6. Если планировать по среднему, в сезон компания не справится с заказами.</li>
  <li><b>Ошибка денежного потока:</b> годовая прибыль положительна, но в межсезонье возникает кассовый разрыв, потому что постоянные расходы никуда не деваются, а выручки нет.</li>
</ul>
<p>Поэтому финансовую модель для сезонного бизнеса нужно строить помесячно, а не по году целиком — только так видно, в каком месяце деньги закончатся.</p>

<h3>4.14. Распределение косвенных затрат</h3>
<p>Когда компания производит несколько продуктов, прямые затраты (сырьё на конкретный продукт) относятся легко, а косвенные (аренда цеха, зарплата начальника производства) нужно как-то распределить между продуктами.</p>

<h3>5.5. Временная стоимость денег: FV и PV</h3>
<p>Базовая концепция: рубль сегодня стоит дороже рубля завтра, потому что сегодняшний рубль можно инвестировать и получить доход.</p>
<div class="formula">FV = PV × (1 + r)ⁿ — наращение (сколько будет в будущем)</div>

<p>где r — ставка за период, n — количество периодов.</p>

<h4>Простой процент против капитализации</h4>
<div class="formula">С капитализацией m раз в год: FV = PV × (1 + r/m)^(m×n)</div>
<p>При одной и той же номинальной ставке более частая капитализация всегда даёт больший доход, потому что проценты начинают приносить проценты.</p>
<div class="calc-line">Пример: 500 000 руб. под 14,5% на 1 год</div>
<div class="calc-line">Простой процент: 500 000 × 1,145 = <b>572 500 руб.</b></div>
<div class="calc-line">Ежемесячная капитализация: 500 000 × (1 + 0,145/12)¹² ≈ <b>577 518 руб.</b></div>

<p>Главная ошибка — взять неверную степень. Поток третьего года дисконтируется в третьей степени.</p>

  <tr><td>PP (срок окупаемости)</td><td>Нет</td><td>Годы</td><td>PP меньше горизонта проекта</td></tr>
  <tr><td>DPP (дисконтированный PP)</td><td>Да</td><td>Годы</td><td>DPP меньше горизонта проекта</td></tr>
  <tr><td>NPV</td><td>Да</td><td>Деньги</td><td>NPV больше 0</td></tr>
  <tr><td>IRR</td><td>Да</td><td>Проценты</td><td>IRR больше требуемой доходности</td></tr>
  <tr><td>PI (индекс доходности)</td><td>Да</td><td>Разы</td><td>PI больше 1</td></tr>
</table>

<h4>NPV — чистая приведённая стоимость</h4>
<div class="formula">NPV = Σ [CFₜ / (1 + r)ᵗ] − Первоначальные инвестиции</div>
<p><b>Экономический смысл:</b> сколько стоимости проект создаёт сверх требуемой доходности. NPV = 0 не означает «проект бесполезен» — он означает «проект приносит ровно требуемую доходность, ни больше ни меньше».</p>
<p><b>Как ведёт себя NPV при росте ставки дисконтирования:</b> уменьшается. Знаменатель (1+r)ᵗ растёт, приведённая стоимость будущих притоков падает. Чем дальше поток во времени, тем сильнее он «сжимается».</p>

<h4>IRR — внутренняя норма доходности</h4>
<p><b>Определение:</b> ставка дисконтирования, при которой NPV проекта равен нулю. Отвечает на вопрос «какую доходность в процентах генерирует сам проект».</p>
<p><b>Правило принятия:</b> IRR больше требуемой доходности инвестора → принимаем. IRR = 18% при требуемой доходности 12% → проект принимаем.</p>
<h4>Ограничения IRR</h4>
<ul>
  <li><b>Предполагает реинвестирование по ставке IRR.</b> Это нереалистично для проектов с очень высокой IRR: вряд ли все промежуточные потоки удастся вложить под 60% годовых. Именно IRR (а не NPV) несёт это допущение — на экзамене это утверждение подсовывают применительно к NPV, и оно неверно.</li>
  <li><b>Неоднозначность при знакопеременных потоках.</b> Если потоки чередуют знак, уравнение может иметь несколько корней. Решение — использовать <b>MIRR</b> (модифицированную IRR).</li>
  <li><b>IRR — это НЕ рыночная банковская ставка.</b> Это расчётная ставка конкретного проекта. Утверждение «IRR показывает реальную банковскую ставку, под которую можно положить деньги» — неверно.</li>
  <li><b>IRR не связана с точкой окупаемости.</b> Утверждение «IRR равен 0% в точке окупаемости» — неверно, это подмена понятий.</li>
</ul>

<h4>PP и DPP</h4>
<div class="formula">PP — период, за который накопленные НОМИНАЛЬНЫЕ притоки покроют инвестиции</div>
<div class="formula">DPP — то же, но по ДИСКОНТИРОВАННЫМ притокам</div>
<div class="callout"><b>DPP всегда больше или равен PP.</b> Причина: дисконтированные потоки меньше номинальных, значит, сумма накапливается медленнее и на покрытие инвестиций нужно больше времени. Это верно при любой положительной ставке и не зависит напрямую от инфляции.</div>
<p><b>Главное ограничение обоих:</b> они игнорируют всё, что происходит ПОСЛЕ момента окупаемости. Проект, окупившийся за 3 года и потом ничего не приносящий, и проект, окупившийся за 3 года и приносящий прибыль ещё 10 лет, имеют одинаковый PP. Поэтому утверждение «если PP меньше срока жизни проекта, надо инвестировать» — неверно: одного PP недостаточно для решения.</p>

<h4>PI — индекс доходности инвестиций</h4>
<div class="formula">PI = Приведённая стоимость притоков / Инвестиции</div>
<p><b>Осторожно с интерпретацией.</b> PI = 2,3 означает, что на каждый вложенный рубль проект генерирует 2,3 рубля ОБЩЕЙ приведённой стоимости (включая возврат самого рубля), а НЕ 2,3 рубля чистой приведённой стоимости сверх вложений. Формулировка «генерирует 2,3 рубля чистой приведённой стоимости» — неверна.</p>
<p><b>Когда PI особенно полезен:</b> при ограниченном бюджете, когда нужно сравнить проекты разного масштаба. Проект А с NPV = 2 000 и инвестициями 10 000 менее эффективен на рубль, чем проект Б с NPV = 1 500 и инвестициями 5 000. А если бюджет всего 5 000, проект А ещё и физически неосуществим.</p>

<h3>5.7. Показатели рентабельности</h3>
<table>
  <tr><th>Показатель</th><th>Формула</th><th>Что показывает</th></tr>
  <tr><td>ROS (рентабельность продаж)</td><td>Прибыль / Выручка × 100%</td><td>Какая доля выручки превращается в прибыль</td></tr>
  <tr><td>ROS operating</td><td>EBIT / Выручка × 100%</td><td>То же, но по операционной прибыли</td></tr>
  <tr><td>ROI (рентабельность инвестиций)</td><td>Прибыль / Инвестиции × 100%</td><td>Отдача на вложенный капитал</td></tr>
  <tr><td>ROA (рентабельность активов)</td><td>Прибыль / Активы × 100%</td><td>Эффективность использования всех активов</td></tr>
  <tr><td>ROE (рентабельность собственного капитала)</td><td>Чистая прибыль / Собственный капитал × 100%</td><td>Доходность для собственника</td></tr>
  <tr><td>SROI (социальная отдача)</td><td>Социальный эффект в деньгах / Инвестиции</td><td>Для социальных и ESG-проектов</td></tr>
</table>

<h4>Полный разбор кейса «СтройМаркет»</h4>
<p><b>Условие:</b> 200 шт. продукции, 20% Продукт 1 и 80% Продукт 2; цена П1 = 280 тыс. (в т.ч. НДС 22%), П2 = 300 тыс. (в т.ч. НДС 22%); себестоимость 90 тыс./шт.; управленческие 5 000 тыс.; коммерческие 3 000 тыс.; проценты 250 тыс.; амортизация 100 тыс.; инвестиции 7 000 тыс.; остаток продукции 30 шт.; налог 25%.</p>
<div class="calc-line">Количество: П1 = 200 × 20% = 40 шт., П2 = 200 × 80% = 160 шт.</div>
<div class="calc-line">Цены без НДС: П1 = 280 / 1,22 ≈ 229,5; П2 = 300 / 1,22 ≈ 245,9 тыс.</div>
<div class="calc-line">Выручка = 40 × 229,5 + 160 × 245,9 ≈ <b>48 525 тыс. руб.</b></div>
<div class="calc-line">Себестоимость ПРОДАННЫХ = 200 × 90 = <b>18 000 тыс. руб.</b></div>
<div class="calc-line">Валовая прибыль = 48 525 − 18 000 = 30 525</div>
<div class="calc-line">EBIT = 30 525 − 5 000 − 3 000 − 100 = <b>22 425 тыс. руб.</b></div>
<div class="calc-line"><b>ROS operating</b> = 22 425 / 48 525 ≈ <b>46%</b></div>
<div class="calc-line">EBT = 22 425 − 250 = 22 175; Налог = 5 544; ЧП = <b>16 631 тыс. руб.</b></div>
<div class="calc-line"><b>ROI</b> = 16 631 / 7 000 ≈ <b>238%</b></div>
<div class="callout"><b>Две ловушки этой задачи.</b> Первая: цены даны С НДС, их обязательно нужно очистить делением на 1,22. Вторая: себестоимость считается по РЕАЛИЗОВАННЫМ 200 шт., а не по произведённым 230 (200 проданных + 30 остатка). Остаток на складе — это запас, а не расход периода.</div>

<h3>5.8. Ставка дисконтирования</h3>
<p>Ставка отражает две вещи: стоимость денег во времени и риск конкретного проекта. Чем рискованнее проект, тем выше ставка и тем сильнее «наказываются» отдалённые потоки.</p>
<h4>Способы определения</h4>
<ul>
  <li><b>WACC</b> — средневзвешенная стоимость капитала. Учитывает долю и стоимость собственного и заёмного капитала. Подходит для действующих компаний с известной структурой капитала.</li>
  <li><b>Аддитивный метод (кумулятивный)</b> — безрисковая ставка + премия за риск отрасли + премия за риск компании + инфляционная составляющая.</li>
  <li><b>Ставка альтернативных инвестиций</b> — какую доходность инвестор получил бы, вложив в сопоставимый по риску актив.</li>
  <li><b>Экспертная оценка</b> — когда объективных данных нет.</li>
  <li><b>Стоимость капитала для стартапа</b> — ориентиры: 25–40% для ранних стадий, 15–25% для поздних. Высокая ставка отражает высокий риск.</li>
</ul>

<h3>5.9. Анализ рисков: чувствительность и сценарии</h3>
<table>
  <tr><th>Метод</th><th>Суть</th><th>Что даёт</th></tr>
  <tr><td><b>Анализ чувствительности</b></td><td>Меняем ОДИН параметр, остальные фиксируем, смотрим на изменение NPV</td><td>Ранжирование факторов по важности: что бьёт по проекту сильнее всего</td></tr>
  <tr><td><b>Сценарный анализ</b></td><td>Считаем результат в нескольких комплектах допущений: пессимистичный, базовый, оптимистичный</td><td>Понимание диапазона возможных исходов</td></tr>
  <tr><td><b>Monte Carlo</b></td><td>Многократный случайный пересчёт модели при варьировании допущений</td><td>Распределение вероятностей результата</td></tr>
</table>
<p>Практический вывод анализа чувствительности: он показывает, за какими параметрами нужно следить в первую очередь. Если NPV рушится при снижении цены на 5%, но почти не реагирует на рост аренды вдвое — управленческий фокус должен быть на ценообразовании, а не на переговорах с арендодателем.</p>

<h4>Точка безразличия</h4>
<p>Состояние, при котором показатель эффективности равен пороговому значению: IRR равна ставке дисконтирования, NPV равен нулю, PI равен единице. В этой точке проект одинаково приемлем и неприемлем — он приносит ровно требуемую доходность.</p>

<h3>5.10. Типовые ошибки в финансовой части (сводка)</h3>
<ul>
  <li>Считать себестоимость по произведённым, а не по проданным единицам.</li>
  <li>Забыть очистить цену от НДС перед расчётом выручки.</li>
  <li>Считать НДС умножением суммы, в которую он уже включён, на ставку.</li>
  <li>Забыть страховые взносы (≈30%) при расчёте затрат на персонал.</li>
  <li>Считать ФОТ сотрудников, нанятых в середине года, за все 12 месяцев.</li>
  <li>Вычесть амортизацию из денежного потока как реальный отток.</li>
  <li>Взять неверную степень при дисконтировании потока N-го года.</li>
  <li>Принять решение по одному показателю (обычно по PP), игнорируя остальные.</li>
  <li>Спутать наценку (от себестоимости) с маржой (от цены).</li>
  <li>Спутать запас прочности в штуках с запасом в процентах.</li>
</ul>

  <tr><td>Капитальные вложения (CAPEX)</td><td>Оборудование, транспорт, недвижимость, ремонт и отделка помещений, монтаж и пусконаладка</td></tr>
  <tr><td>Нематериальные активы</td><td>Разработка ПО, сайт, патенты, товарные знаки, лицензии, франшиза</td></tr>

<div class="callout"><b>Классическая ошибка начинающих:</b> посчитать только оборудование и забыть про оборотный капитал и предоперационные расходы. В результате компания покупает станок, но у неё нет денег на первую партию сырья и на зарплату до первой выручки. Резерв на непредвиденные расходы — не признак неуверенности, а признак зрелого планирования.</div>

  <tr><td><b>Реальные</b></td><td>Вложения в физические средства производства</td><td>Покупка оборудования и техники, вложения в основные средства, недвижимость</td></tr>
  <tr><td><b>Финансовые (портфельные)</b></td><td>Вложения в финансовые инструменты</td><td>Покупка акций, облигаций и других ценных бумаг, покупка долей участия в других компаниях</td></tr>
  <tr><td><b>Интеллектуальные</b></td><td>Вложения в нематериальные активы</td><td>Покупка патента на изобретение, вложения в нематериальные активы, разработка собственного ПО, разработка бренда компании</td></tr>
</table>
<div class="callout"><b>Что НЕ является инвестицией.</b> Оплата сырья и материалов, оплата арендных платежей, рост стоимости логистики из-за внешних обстоятельств — это <b>текущие операционные затраты</b>, а не вложения в создание будущей ценности. На экзамене встречается кейс: компания создаёт резервный фонд из-за удорожания логистики на 65% — правильный ответ «не является инвестицией», потому что это реакция на рост издержек, а не вложение в актив.</div>

<h4>Разбор кейса ООО «Дюрсо»: как выбирают реалистичный источник</h4>
<p><b>Условие:</b> нужна линия за 300 млн руб., чистая прибыль прошлого года 150 млн (ROS 14%), коэффициент текущей ликвидности 1,8 при норме больше 2,0, свободного залогового имущества кроме приобретаемого оборудования нет, репутация и кредитная история положительные.</p>
<p><b>Шаг 1 — отсеять не заёмные варианты:</b> прибыль текущего и прошлых периодов, целевой и резервный фонды — собственные средства; акции и взносы в капитал — привлечённые; грант — безвозмездный; дивиденды — вообще отток. Остаются: краткосрочные кредиты, долгосрочные кредиты, облигации, проектное финансирование ФРП.</p>
<p><b>Шаг 2 — проверить реалистичность каждого:</b></p>
<ul>
  <li><b>Краткосрочные кредиты</b> — не подходят: коэффициент ликвидности ниже нормы говорит о напряжённой краткосрочной платёжеспособности, банк неохотно даст новый короткий долг; к тому же короткие деньги не подходят под длинный инвестиционный проект.</li>
  <li><b>Облигации</b> — требуют масштаба и публичной истории на долговом рынке, чего в условии нет.</li>
  <li><b>Долгосрочный кредит</b> — реалистичен: приобретаемое оборудование само выступает залогом, а положительная кредитная история и репутация — именно то, что оценивает банк.</li>
  <li><b>Проектное финансирование ФРП</b> — почти идеально: государственный инструмент под промышленную модернизацию, оценивает проект и репутацию, не требует значительного дополнительного залога.</li>
</ul>
<p><b>Вывод:</b> реалистичные заёмные источники — проектное финансирование ФРП и долгосрочный кредит.</p>

<h3>5.13. WACC — средневзвешенная стоимость капитала</h3>
<div class="formula">WACC = (E / (D+E)) × Re + (D / (D+E)) × Rd × (1 − T)</div>
<p>где E — собственный капитал, D — заёмный капитал, Re — стоимость собственного капитала (требуемая доходность акционеров), Rd — стоимость заёмного капитала (ставка по кредитам), T — ставка налога на прибыль.</p>
<h4>Почему в формуле есть (1 − T)</h4>
<p>Проценты по кредиту уменьшают налогооблагаемую прибыль, то есть государство фактически субсидирует часть стоимости долга. Это называется <b>налоговым щитом</b>. При ставке кредита 20% и налоге 25% реальная стоимость долга для компании составляет 20% × 0,75 = 15%.</p>
<h4>Пример расчёта</h4>
<p>Собственный капитал 60 млн, требуемая доходность акционеров 25%; заёмный капитал 40 млн, ставка 18%; налог 25%.</p>
<div class="calc-line">Доля собственного = 60/100 = 0,6; доля заёмного = 0,4</div>
<div class="calc-line">WACC = 0,6 × 25% + 0,4 × 18% × 0,75 = 15% + 5,4% = <b>20,4%</b></div>
<p><b>Практический смысл:</b> проект должен приносить доходность выше 20,4%, иначе он разрушает стоимость — компания заработает меньше, чем стоит привлечённый капитал.</p>

  <tr><td><b>Формулировка сценарных допущений</b> (оптимистичный / базовый / пессимистичный)</td><td>Это структурная задача: разложить исходные допущения по трём вариантам</td></tr>

  <tr><td><b>Написание финансового нарратива</b> («So what?» — что цифры значат для решения)</td><td>Языковая задача: превратить таблицу в связное объяснение</td></tr>
</table>

<h3>6.5. Что ИИ НЕ МОЖЕТ</h3>
<table>
  <tr><th>Ограничение</th><th>Почему</th></tr>
  <tr><td><b>Валидировать бизнес-логику допущений</b></td><td>Требует понимания реального бизнеса, а не текста о нём</td></tr>
  <tr><td><b>Определить, реалистичны ли финансовые показатели</b></td><td>Модель не знает, достижима ли конверсия 25% на ВАШЕМ рынке</td></tr>
  <tr><td><b>Заменить понимание unit-экономики</b></td><td>Может посчитать LTV/CAC, но не заметит, что допущение о затратах на клиента абсурдно</td></tr>
  <tr><td><b>Учесть специфику именно вашего рынка</b></td><td>Локальные особенности, регуляторика, отношения с контрагентами — вне данных модели</td></tr>
  <tr><td><b>Отфильтровать GIGO</b> (мусор на входе = мусор на выходе)</td><td>Модель не различает качественные и некачественные входные данные</td></tr>
</table>
<div class="formula">Экзаменационная логика проста: всё, что требует СУЖДЕНИЯ о реальности рынка — ИИ не может. Всё, что является ВЫЧИСЛИТЕЛЬНОЙ операцией над заданными данными — может.</div>

<h3>6.6. Промптинг: как ставить задачу правильно</h3>
<h4>Структура хорошего промпта</h4>
<ol>
  <li><b>Роль и контекст</b> — кто вы и в какой ситуации.</li>
  <li><b>Задача</b> — что именно нужно сделать, максимально конкретно.</li>
  <li><b>Источники и ограничения</b> — использовать только загруженные файлы; если данных нет, сказать об этом прямо.</li>
  <li><b>Формат вывода</b> — таблица, список, с указанием формул и источников.</li>
  <li><b>Требование прозрачности</b> — показать формулу и каждый множитель, а не только итог.</li>
</ol>
<div class="callout"><b>Почему обязательна фраза «используй только загруженные документы, а если данных нет — скажи об этом».</b> Без явного ограничения модель, стремясь быть полезной, дозаполнит пробелы правдоподобными, но не подтверждёнными цифрами. Явный запрет на выдумывание превращает «правдоподобный ответ» в честное «данных недостаточно», что для бизнес-плана гораздо ценнее.</div>

<h4>Пример промпта для оценки объёма рынка</h4>
<p>«На основе ЗАГРУЖЕННЫХ документов оцени TAM, SAM и SOM для [продукт] в [география]. Для каждого показателя: (1) покажи формулу; (2) укажи каждый множитель и его источник — файл и страницу; (3) отдельно посчитай top-down и bottom-up и сравни результаты; (4) перечисли допущения, которые пришлось сделать; (5) если данных для какого-то множителя нет в файлах — прямо укажи это, не подставляй оценку».</p>

<h4>Приём «атаковать собственные допущения»</h4>
<p>Более продуктивно, чем просить ИИ подтвердить вашу модель, — просить его её опровергнуть: «Назови 5 причин, по которым каждое из моих допущений может быть завышено, и какие рыночные данные его подтвердят или опровергнут». Это использует сильную сторону модели (генерация вариантов) и обходит слабую (суждение об истинности).</p>

<h3>6.7. Пайплайн оценки рынка с помощью ИИ</h3>
<ol>
  <li><b>Сбор источников:</b> Statista, Росстат, ЦБ, отраслевые отчёты, годовые отчёты публичных компаний.</li>
  <li><b>Загрузка в среду</b> с эмбеддингами (NotebookLM, Claude Project).</li>
  <li><b>Промпт с ограничениями</b> — по структуре выше.</li>
  <li><b>Получение двух оценок</b> — top-down и bottom-up, со всеми формулами.</li>
  <li><b>Ручная проверка каждой цифры</b> по первоисточнику — это нельзя делегировать.</li>
  <li><b>Сверка двух методов:</b> если результаты расходятся в разы, значит, где-то ошибка в допущениях.</li>
  <li><b>Перенос в раздел «Анализ рынка»</b> со ссылками на источники.</li>
</ol>

<h3>6.8. GIGO как главный принцип</h3>
<p><b>Garbage In, Garbage Out</b> — качество выводов не может быть выше качества исходных данных. Применительно к работе с ИИ это означает: никакая мощность модели не компенсирует необоснованные допущения.</p>
<p>Практический чек-лист перед тем, как доверять цифре из модели:</p>
<ul>
  <li>Откуда взялся каждый множитель? Есть ли ссылка на источник?</li>
  <li>Проверял ли я эту цифру в первоисточнике лично?</li>
  <li>Совпадают ли результаты top-down и bottom-up хотя бы по порядку величины?</li>
  <li>Что произойдёт с выводом, если ключевое допущение окажется вдвое хуже?</li>
  <li>Есть ли в модели допущение, которое я не могу защитить на защите проекта?</li>
</ul>

<h3>6.11. Процедура верификации: как проверять ответы ИИ</h3>
<p>Работа с ИИ без процедуры проверки — это лотерея. Ниже практическая последовательность, которую стоит применять к любой цифре, попадающей в бизнес-план.</p>
<ol>
  <li><b>Требовать источник для каждой цифры.</b> Не «рынок составляет 45 млрд», а «45 млрд, источник: файл X, страница 12, таблица 3».</li>
  <li><b>Открыть первоисточник и убедиться, что цифра там есть.</b> Модель может корректно сослаться на существующий документ, но неверно интерпретировать таблицу.</li>
  <li><b>Проверить единицы и период.</b> Частая ошибка: цифра из отчёта за месяц выдаётся как годовая, или доллары считаются рублями.</li>
  <li><b>Проверить арифметику вручную хотя бы на одном звене.</b> Если умножение сходится, доверие к остальному растёт; если нет — пересчитывать всё.</li>
  <li><b>Сверить два независимых метода.</b> Top-down и bottom-up должны совпасть хотя бы по порядку величины. Расхождение в разы — сигнал ошибки в допущениях.</li>
  <li><b>Проверить здравым смыслом.</b> Получился SOM, превышающий выручку крупнейшего игрока рынка? Значит, где-то ошибка.</li>
  <li><b>Спросить себя: смогу ли я защитить эту цифру на вопрос преподавателя «откуда это»?</b> Если нет — цифра в план не идёт.</li>
</ol>

<h3>6.13. Ответственность автора</h3>
<p>Ключевой принцип, который стоит усвоить за пределами экзамена: <b>ответственность за содержание бизнес-плана всегда лежит на авторе</b>, независимо от того, какими инструментами он пользовался. На защите проекта вопрос «откуда эта цифра» адресуется вам, и ответ «так сказал ИИ» не является ответом.</p>
<p>Практический критерий готовности: вы должны быть способны объяснить каждое число в своей модели — откуда оно, почему именно такое, и что произойдёт с выводами, если оно окажется вдвое хуже. Если хотя бы для одной ключевой цифры вы этого не можете — модель не готова.</p>

<h3>6.14. Чек-лист перед сдачей и защитой проекта</h3>
<h4>Содержательная часть</h4>
<ul>
  <li>Границы рынка определены и обоснованы, схема субститутов приведена.</li>
  <li>TAM/SAM/SOM посчитаны обоими методами, расхождение объяснено.</li>
  <li>Каждый множитель в расчёте объёма рынка имеет источник.</li>
  <li>Пять сил Портера оценены с обоснованием каждой оценки, а не просто баллами.</li>
  <li>Сегменты описаны через потребности и поведение, а не только через демографию.</li>
  <li>Канва бизнес-модели заполнена по всем 9 блокам, без пропусков.</li>
  <li>ОПФ и налоговый режим выбраны с расчётом, а не по умолчанию.</li>
  <li>Точка безубыточности посчитана, план продаж с ней сопоставлен.</li>
  <li>Юнит-экономика посчитана отдельно по каждому существенно различающемуся сегменту.</li>
</ul>
<h4>Финансовая часть</h4>
<ul>
  <li>Цены очищены от НДС там, где это нужно.</li>
  <li>Себестоимость посчитана по проданным, а не произведённым единицам.</li>
  <li>Страховые взносы (около 30% от ФОТ) учтены отдельной строкой.</li>
  <li>Сотрудники, нанятые в середине года, посчитаны за фактические месяцы.</li>
  <li>Амортизация уменьшает прибыль в P&amp;L и прибавлена обратно в денежном потоке.</li>
  <li>Модель построена помесячно, если бизнес сезонный.</li>
  <li>Рассчитаны NPV, IRR, PP, DPP — и решение принято не по одному показателю.</li>
  <li>Ставка дисконтирования обоснована, а не взята «круглым числом».</li>
  <li>Проведён анализ чувствительности хотя бы по трём ключевым параметрам.</li>
  <li>Проверено, что на каждом шаге хватает денег: нет отрицательного остатка на счёте.</li>
</ul>
<h4>Оформление</h4>
<ul>
  <li>Executive Summary написано последним, укладывается в 1,5 страницы и содержит сводку ключевых цифр.</li>
  <li>Все таблицы и рисунки пронумерованы и подписаны.</li>
  <li>Источники данных указаны.</li>
  <li>Раздел рисков содержит конкретные меры, а не общие слова.</li>
</ul>

<h3>6.15. Как отвечать на вопросы на защите</h3>
<p>Несколько практических приёмов, которые работают независимо от темы проекта:</p>
<ul>
  <li><b>Знать свои три самые слабые цифры.</b> Скорее всего, спросят именно про них. Лучше самому назвать допущение слабым и объяснить, как вы его проверяли, чем защищать его до последнего.</li>
  <li><b>Помнить порядок величин.</b> Если вы помните, что маржинальный доход около 1 200 руб., а точка безубыточности около 4 000 единиц, вы сможете ответить на большинство уточняющих вопросов без бумажки.</li>
  <li><b>Различать «не знаю» и «этого нет в модели».</b> Второе — нормальный ответ, если объяснить, почему параметр вынесен за скобки.</li>
  <li><b>Быть готовым к вопросу «что будет, если».</b> Именно для этого делается анализ чувствительности: ответ должен быть числом, а не рассуждением.</li>
</ul>

 text:'На каком этапе подготовки бизнес-плана логичнее всего писать Executive Summary?',
 options:['В самом конце, когда остальные разделы готовы','Первым, до любого анализа','Одновременно с титульным листом, без анализа','Он не пишется, если проект защищается устно'],
 correct:0, explanation:'Поскольку Summary резюмирует все разделы, его пишут после того, как маркетинговый, операционный, финансовый и инвестиционный разделы уже готовы — хотя размещается он в начале документа.'},
{id:'q4b',topic:'exec-summary',type:'multi',source:'real',
 text:'Что из перечисленного необходимо включить в Executive Summary? (несколько ответов)',
 options:['Подробное описание каналов маркетинга и продаж с указанием бюджета','Развёрнутое описание фонда оплаты труда и размера страховых взносов','Описание компании, проекта и (или) продукта','Указание перспектив развития проекта','Организационная структура компании и подразделения','Краткие данные о финансовых показателях и эффективности проекта','Подробное описание ключевых бизнес-процессов компании','Тщательный разбор бизнес-рисков проекта'],
 correct:[2,3,5], explanation:'В Summary попадает только САМОЕ СЖАТОЕ: краткое описание компании/продукта (C), перспективы развития (D) и краткая сводка по финансовым показателям — выручка, ROI, NPV, IRR, срок окупаемости (F). А вот подробное описание каналов с бюджетом (A), развёрнутый ФОТ и взносы (B), оргструктура (E), подробные бизнес-процессы (G) и тщательный разбор рисков (H) — это уровень детализации ПОЛНЫХ разделов плана (маркетинг, оргплан, операционный план, риски), а не резюме на полторы страницы.'},
{id:'q4c',topic:'exec-summary',type:'single',source:'practice',
 text:'Инвестор прочитал только Executive Summary и решил не читать план дальше. Что это значит для автора плана?',
 options:['Summary не выполнило свою функцию — «зацепить» и убедить читать дальше, это сигнал пересмотреть его','Это нормально, Summary и не должно мотивировать читать дальше','Значит, все остальные разделы плана не нужны','Значит, у инвестора нет времени, и это не связано с качеством Summary'],
 correct:0, explanation:'Ключевая функция Executive Summary — не просто пересказать план, а заинтересовать инвестора и мотивировать его прочитать план полностью. Если инвестор останавливается на Summary, это сигнал, что резюме нужно доработать — усилить конкретику и цифры.'},

/* ================= market-boundaries ================= */
{id:'q5',topic:'market-boundaries',type:'single',source:'real',
 text:'Компании R, N и S продают на одном рынке молоко с разным сроком годности (5, 7 и 3 дня), в одном магазине, одним и тем же покупателям. Как правильно определить границы этого рынка?',
 options:['Продуктовые границы — все три считаются частью одного товарного рынка, так как взаимозаменяемы для потребителя','Временные границы — это три разных рынка, так как сроки годности разные','Географические границы — рынок нужно делить по районам доставки','Это вообще не рынок, а три независимых бизнеса'],
 correct:0, explanation:'Границы рынка определяются взаимозаменяемостью товаров с точки зрения потребителя, а не техническими различиями продукта. Разный срок годности — характеристика товара, но не создаёт отдельный рынок, пока покупатель воспринимает эти виды молока как замену друг другу для одной и той же цели.'},
{id:'q6',topic:'market-boundaries',type:'single',source:'practice',
 text:'Компания продаёт авиабилеты Москва—Санкт-Петербург. Кого стоит включить в границы её рынка помимо других авиакомпаний?',
 options:['Только других авиаперевозчиков этого направления','Авиаперевозчиков, поезд «Сапсан» и личный автомобиль по платной трассе — как субституты','Только производителей самолётов','Только турагентства'],
 correct:1, explanation:'Границы рынка определяются по способу удовлетворения потребности клиента (доехать из А в Б), поэтому в них входят все реальные субституты — поезд и платная трасса, а не только прямые конкуренты-авиакомпании.'},
{id:'q7',topic:'market-boundaries',type:'single',source:'practice',
 text:'Что в первую очередь определяет географические границы рынка локальной кофейни у метро?',
 options:['Реальная зона, откуда готовы приходить клиенты пешком/ненадолго заезжать','Границы города целиком','Границы страны','Наличие сайта у кофейни'],
 correct:0, explanation:'Для локального сервиса вроде кофейни релевантная географическая граница — это зона фактической доступности для клиента, а не административные границы города или страны.'},
{id:'q8',topic:'market-boundaries',type:'single',source:'practice',
 text:'Компания А продаёт премиальный кожаный портфель за 80 000 руб., компания Б — офисный рюкзак за 3 000 руб. Оба используются для переноски ноутбука в офис. Правильно ли объединять их в один товарный рынок?',
 options:['Да, если целевые потребители реально рассматривают оба варианта как замену друг другу','Да, всегда, так как функция одна и та же','Нет, никогда, так как цена различается в 25 раз','Нет, так как материалы разные'],
 correct:0, explanation:'Ключевой критерий — субъективная взаимозаменяемость в глазах конкретного целевого потребителя, а не формальное совпадение функции или разница в цене/материале самой по себе.'},
{id:'q8b',topic:'market-boundaries',type:'single',source:'real',
 data:'Стартап в сфере здорового питания определяет свой «рынок» как все рестораны города. Однако он продаёт только растительные белковые продукты.',
 text:'Какой подход наиболее уместен для корректного уточнения границ рынка?',
 options:['Ограничить рынок только вегетарианскими и веганскими ресторанами','Сохранить определение «все рестораны» и не учитывать различия в типах меню','Расширить рынок за счёт продуктовых магазинов и магазинов шаговой доступности, продающих сопоставимые растительные продукты','Сегментировать рынок исключительно по цене: от фастфуда до элитной кухни'],
 correct:2, explanation:'Границы рынка нужно проводить по РЕАЛЬНОЙ взаимозаменяемости продукта, а не по формальному типу заведения. «Все рестораны города» — слишком широко (включает стейк-хаусы, никак не конкурирующие за этого покупателя), а «только веган-рестораны» — слишком узко (не учитывает, что растительный протеин конкурирует и с обычными продуктовыми магазинами). Правильный подход — включить в анализ всех, кто предлагает сопоставимый продукт: и рестораны, и магазины у дома, продающие похожие растительные продукты. Сегментация по цене (D) вообще не отвечает на вопрос о границах товарного рынка.'},
{id:'q8c',topic:'market-boundaries',type:'single',source:'practice',
 text:'Сервис такси-эконом анализирует, кого включать в границы своего рынка. Что здесь методологически вернее?',
 options:['Всех, кто закрывает потребность «доехать из точки А в точку Б» по сопоставимой цене — другие такси-сервисы, каршеринг, экономичный общественный транспорт по спросу','Только сервисы такси с таким же названием тарифа «эконом»','Только компании, зарегистрированные как такси по ОКВЭД','Только сервисы, работающие в этом же городе, независимо от того, чем они занимаются'],
 correct:0, explanation:'Границы рынка определяются по способности закрыть ту же потребность клиента при сопоставимых условиях (цена, время, удобство), а не по формальному названию тарифа или коду ОКВЭД — это снова тест на взаимозаменяемость с точки зрения потребителя.'},
{id:'q8d',topic:'market-boundaries',type:'single',source:'real',
 data:'Стартап в сфере экологически чистых упаковок определяет свой «рынок» как все компании, занимающиеся производством товаров. Однако он специализируется на упаковке для сохранения свойств пищевых продуктов.',
 text:'Какой подход наиболее уместен для корректного уточнения границ рынка?',
 options:['Сохранить определение «все компании, занимающиеся производством товаров», так как упаковка может быть универсальной','Сегментировать рынок исключительно по географическому признаку: локальные производители и международные корпорации','Ограничить рынок только производителями пищевых продуктов, так как упаковка разрабатывается для сохранения свежести продуктов','Расширить рынок за счёт включения производителей бытовой химии и косметики, так как они тоже используют упаковку и любят инновации','Предположить, что все производители товаров для жителей мегаполисов одинаково заинтересованы в экологически чистой упаковке','Все перечисленное','Ничего из перечисленного'],
 correct:2, explanation:'Границы рынка нужно проводить по конкретной ФУНКЦИИ продукта, а не по формальной широкой категории «все производители товаров» (A — слишком широко, включает нерелевантные отрасли) и не по географии (B — не относится к сути специализации). Стартап решает конкретную задачу — сохранение свежести ПИЩЕВЫХ продуктов, поэтому логичная граница рынка — производители пищевых продуктов (C). Включение бытовой химии и косметики (D) обосновано слабым, нерелевантным аргументом («тоже используют упаковку и любят инновации» — это не про сохранение свежести); а предположение об одинаковой заинтересованности всех городских производителей (E) — необоснованное обобщение.'},

/* ================= market-volume ================= */
{id:'q9',topic:'market-volume',type:'single',source:'practice',
 text:'Расположите показатели объёма рынка от самого широкого к самому узкому.',
 options:['TAM → SAM → SOM','SOM → SAM → TAM','SAM → TAM → SOM','TAM → SOM → SAM'],
 correct:0, explanation:'TAM — весь теоретический рынок, SAM — часть, которую компания технически может обслужить, SOM — реалистично достижимая доля в обозримый период. TAM ⊇ SAM ⊇ SOM.'},
{id:'q10',topic:'market-volume',type:'single',source:'practice',
 text:'Какой подход к расчёту объёма рынка обычно даёт более защищаемую (перед инвестором) и точную оценку?',
 options:['Bottom-up: от числа клиентов, среднего чека и частоты покупки','Top-down: взять общий объём отрасли из отчёта и умножить на «долю на глаз»','Оба одинаково точны всегда','Использовать только данные конкурентов'],
 correct:0, explanation:'Bottom-up строится на проверяемых, конкретных допущениях (сколько клиентов, сколько платят, как часто), что легче обосновать и точнее отражает реальность конкретного проекта.'},
{id:'q11',topic:'market-volume',type:'single',source:'real',
 data:'В бизнес-центре 10 000 офисных работников. 35% регулярно завтракают вне дома. Из них 15% предпочитают доставку вместо кафе. Компания планирует захватить 10% этого сегмента в первый год. Средний чек завтрака — 350 ₽, 20 рабочих дней в месяц.',
 text:'Какой из показателей рынка для сервиса доставки завтраков посчитан верно?',
 options:['SOM = 52,9 млн рублей','TAM = 35 млн рублей','TAM = 3,52 млрд рублей','SOM = 1 500 человек','SAM = 529,2 млн рублей','SAM = 24,5 млн рублей'],
 correct:5, explanation:'Люди, которые в принципе покупают завтрак на стороне (SAM): 10 000×35%=3 500 человек. Их месячная выручка на завтраках = 3 500×350₽×20 дней = 24 500 000 ₽ = 24,5 млн ₽ — это вариант F. Остальные варианты — типичные ошибки: A и E получаются, если случайно продисконтировать месячную сумму ещё раз на 12 (умножить дважды на годовой множитель) для SOM и SAM соответственно; D (1 500 человек) получается, если ошибочно взять 15% сразу от всех 10 000 человек, забыв про первый фильтр (35%, съедающих вне дома); C — результат похожей ошибки при расчёте TAM.'},
{id:'q11b',topic:'market-volume',type:'multi',source:'real',
 data:'Компания предоставляет услуги по внедрению и настройке CRM-систем для малого и среднего бизнеса. В России около 2,5 млн предприятий МСБ. 30% из них потенциально заинтересованы в CRM для оптимизации бизнес-процессов. Из этого числа только 20% готовы рассмотреть внедрение в ближайшие 1–2 года. Средняя стоимость внедрения и настройки — 300 000 руб.',
 text:'Выберите верные показатели объёма рынка (ответ уместен и в компаниях, и в рублях — выберите все верные варианты):',
 options:['TAM составляет примерно 150 000 компаний','SAM = 125 тыс. компаний','SAM составляет около 950 млн рублей','TAM = 225 млрд рублей','SAM составляет около 25 млрд рублей','TAM = 750 тыс. компаний','SAM составляет около 45 млрд рублей'],
 correct:[3,5,6], explanation:'Реально адресуемый рынок (TAM) — это не все 2,5 млн предприятий МСБ, а только те, кому продукт вообще релевантен: 2 500 000×30% = 750 000 компаний (вариант F) — в рублях это 750 000×300 000 = 225 000 000 000 = 225 млрд руб. (вариант D). Доступный рынок (SAM) сужает его ещё раз тем, кто готов внедрять в обозримой перспективе: 750 000×20% = 150 000 компаний, что в рублях составляет 150 000×300 000 = 45 000 000 000 = 45 млрд руб. (вариант G). Варианты B, C, E — отвлекающие числа, не получающиеся ни при каком верном порядке применения процентов из условия.'},
{id:'q12',topic:'market-volume',type:'numeric',source:'practice',
 data:'Из условия задачи про доставку завтраков: 3 500 человек регулярно завтракают вне дома, из них 15% предпочитают доставку. Компания планирует захватить 10% этого сегмента в первый год.',
 text:'Сколько человек составит SOM (реалистично достижимый сегмент) в первый год?',
 answer:53, tolerance:2, unit:'человек',
 explanation:'525 человек предпочитают доставку (3 500×15%). SOM = 525×10% ≈ 52,5 ≈ 53 человека — именно на этот объём клиентов реалистично рассчитывать в первый год работы.'},
{id:'q13',topic:'market-volume',type:'single',source:'practice',
 text:'Стартап оценил свой TAM в 500 млрд $ при выручке первого года в 50 000 $. На что это указывает?',
 options:['Скорее всего, границы TAM определены слишком широко и не отражают реальный адресуемый рынок','Это отличный признак — рынок огромный, значит, всё в порядке','Значит, стартап уже занял значительную долю рынка','Такой TAM всегда означает ошибку в расчёте SOM, а не TAM'],
 correct:0, explanation:'Слишком большой TAM относительно реальных возможностей компании — классический красный флаг для инвестора: скорее всего, в объём включили нерелевантных потребителей и рынок определён без реальных границ.'},
{id:'q14',topic:'market-volume',type:'single',source:'practice',
 text:'Компания при bottom-up расчёте SAM неправильно взяла всё взрослое население страны вместо «жителей городов-миллионников, пользующихся приложениями доставки». Какую ошибку она допустила?',
 options:['Не сузила границы рынка до реально обслуживаемого сегмента (SAM ≈ TAM)','Перепутала переменные и постоянные затраты','Использовала top-down вместо bottom-up','Ошибка в расчёте IRR'],
 correct:0, explanation:'SAM должен учитывать реальные ограничения — географию, канал, платформу. Взяв всё население страны, компания фактически посчитала TAM, а не SAM.'},

/* ================= porter5 ================= */
{id:'q15',topic:'porter5',type:'multi',source:'practice',
 text:'Какие силы входят в модель 5 сил Портера? (выберите 5)',
 options:['Внутриотраслевая конкуренция','Угроза появления новых игроков','Рыночная власть поставщиков','Рыночная власть покупателей','Угроза продуктов-субститутов','Инфляционные риски','Курсовые риски'],
 correct:[0,1,2,3,4], explanation:'Классическая модель включает ровно 5 сил: внутриотраслевую конкуренцию, угрозу новых игроков, власть поставщиков, власть покупателей и угрозу субститутов. Инфляционные и курсовые риски — часть макроанализа (PESTEL), а не модели Портера.'},
{id:'q16',topic:'porter5',type:'single',source:'practice',
 text:'Бесплатный эфирный телеканал анализирует рыночную власть «покупателей». Кого правильно считать покупателем в этой модели?',
 options:['Рекламодателя, который платит за рекламное время','Телезрителя, потому что он смотрит контент','Государство как регулятора','Производителей телевизоров'],
 correct:0, explanation:'Покупатель — тот, кто реально платит компании. Телезритель контент потребляет бесплатно и по сути «продаёт своё внимание», а платит телеканалу именно рекламодатель — значит, анализировать нужно его переговорную силу.'},
{id:'q17',topic:'porter5',type:'multi',source:'practice',
 text:'Что из перечисленного повышает барьеры входа в отрасль? (несколько ответов)',
 options:['Высокая потребность в капитале','Сильный эффект масштаба у действующих игроков','Низкая лояльность потребителей к брендам','Ограниченный доступ к каналам дистрибуции','Отсутствие лицензирования'],
 correct:[0,1,3], explanation:'Высокий капитал, эффект масштаба и ограниченный доступ к каналам сбыта — классические барьеры входа. Низкая лояльность к брендам и отсутствие лицензирования, наоборот, ОБЛЕГЧАЮТ вход новых игроков.'},
{id:'q18',topic:'porter5',type:'single',source:'practice',
 text:'Небольшой магазин закупает весь хлеб у одного крупного хлебозавода поблизости и не имеет других вариантов поставки. О чём это говорит?',
 options:['О высокой рыночной власти поставщика над магазином','О высокой рыночной власти магазина над поставщиком','Об угрозе субститутов','О низких барьерах входа в хлебопекарную отрасль'],
 correct:0, explanation:'Когда у покупателя нет альтернативных поставщиков и он зависит от одного крупного игрока, именно поставщик диктует цену и условия — это высокая власть поставщика.'},
{id:'q19',topic:'porter5',type:'single',source:'practice',
 text:'Компания «Такси-Х» отмечает, что каршеринг и подписка на личный автомобиль стали для клиентов альтернативой заказу такси. Какую силу Портера нужно анализировать?',
 options:['Угрозу продуктов-субститутов','Рыночную власть поставщиков','Внутриотраслевую конкуренцию','Угрозу новых игроков'],
 correct:0, explanation:'Каршеринг и подписка на авто — не прямые конкуренты (не такси-сервисы), а альтернативный способ закрыть ту же потребность («доехать») — классический субститут.'},
{id:'q20',topic:'porter5',type:'single',source:'practice',
 text:'По какой шкале в методике из бизнес-плана рекомендуется оценивать зависимость компании от каждой из 5 сил?',
 options:['От 1 (не зависит) до 6 (полностью зависима)','От 0 до 1 в долях','Только «высокая/низкая»','От -5 до +5'],
 correct:0, explanation:'Методика предполагает шкалу от 1 (компания не зависит от силы) до 6 (компания практически полностью зависима от неё), с промежуточными градациями.'},
{id:'q20b',topic:'porter5',type:'multi',source:'real',
 data:'Вы анализируете отрасль авиаперевозок, чтобы определить её привлекательность.',
 text:'Какие факторы, скорее всего, снизят общую прибыльность отрасли? (несколько ответов)',
 options:['Низкая угроза появления заменителей из-за уникальных маршрутов путешествий','Снижение мирового спроса на путешествия','Значительные барьеры для ВЫХОДА (например, долгосрочная аренда самолётов)','Большое количество одинаково сбалансированных авиакомпаний, активно конкурирующих между собой','Слабая рыночная власть поставщиков','Высокие затраты на переключение для клиентов'],
 correct:[1,2,3], explanation:'Снижают прибыльность отрасли: падение спроса (B); высокие барьеры ВЫХОДА (C) — если компаниям дорого/сложно покинуть отрасль (например, из-за долгосрочных лизинговых обязательств на самолёты), убыточные игроки не уходят с рынка и продолжают давить на цены, усиливая конкуренцию для всех; и множество примерно равных по силе конкурентов (D) — классический признак высокой внутриотраслевой конкуренции. А низкая угроза субститутов (A), слабая власть поставщиков (E) и высокие издержки переключения для клиентов (F), наоборот, ПОВЫШАЮТ привлекательность отрасли — их не нужно было выбирать. Важно не путать барьеры ВХОДА (защищают действующих игроков от новичков) и барьеры ВЫХОДА (удерживают слабых игроков внутри отрасли, обостряя конкуренцию) — это разные, хотя и похожие по названию, понятия.'},
{id:'q20c',topic:'porter5',type:'multi',source:'real',
 text:'Что из перечисленного является барьером входа на рынок? (несколько ответов)',
 options:['Эффект масштаба у действующих игроков','Необходимость лицензирования','Патенты и интеллектуальная собственность','Лояльность потребителей к существующим брендам','Высокая прибыльность отрасли','Высокие первоначальные инвестиции (CAPEX)'],
 correct:[0,1,2,3,5], explanation:'Классические барьеры входа: эффект масштаба у действующих игроков (A), обязательное лицензирование (B), патенты/IP (C), лояльность к существующим брендам (D) и высокий стартовый CAPEX (F) — всё это затрудняет вход новых конкурентов. А высокая прибыльность отрасли (E), наоборот, НЕ является барьером — это, скорее, ПРИТЯГИВАЮЩИЙ фактор: чем прибыльнее отрасль, тем сильнее она мотивирует новых игроков зайти на рынок, несмотря на барьеры.'},
{id:'q20d',topic:'porter5',type:'multi',source:'real',
 text:'Какие факторы УВЕЛИЧИВАЮТ угрозу появления новых игроков на рынке? (несколько ответов)',
 options:['Экономия за счёт масштаба — крупные фирмы делают дешевле','Сильный бренд','Низкие вложения в оборудование и простые навыки','Уникальные продукты, к которым привыкли покупатели','Дешёвые заменители из других отраслей','Низкая потребность в капитале'],
 correct:[2,5], explanation:'Это зеркальный вопрос к «что является барьером входа» — здесь спрашивают об обратном: что делает вход ЛЁГКИМ, то есть УВЕЛИЧИВАЕТ угрозу новых игроков. Низкие вложения в оборудование и простые навыки (C) и низкая потребность в капитале (F) — это ОТСУТСТВИЕ барьеров, то есть прямо повышают угрозу входа. А экономия за счёт масштаба у действующих игроков (A), сильный бренд (B) и привычка покупателей к уникальному продукту (D) — это, наоборот, барьеры, которые СНИЖАЮТ угрозу новых игроков. Дешёвые заменители из других отраслей (E) — это про угрозу СУБСТИТУТОВ, отдельную силу Портера, не про новых игроков напрямую.'},
/* ================= kfu ================= */
{id:'q21',topic:'kfu',type:'single',source:'practice',
 text:'Что такое ключевые факторы успеха (КФУ) в контексте бизнес-плана?',
 options:['Ограниченный набор условий, без выполнения которых компания не может рассчитывать на успех в отрасли','Полный перечень всех возможных рисков проекта','Список всех сотрудников компании','Синоним показателя NPV'],
 correct:0, explanation:'КФУ — это немногочисленные, но критичные для отрасли компетенции/ресурсы/условия (например, скорость доставки для e-commerce или патентная защита для фарм-компании), без которых устойчивое конкурентное преимущество недостижимо.'},
{id:'q22',topic:'kfu',type:'single',source:'practice',
 text:'Для маркетплейса мебели названы такие потенциальные КФУ: «партнёрства с дизайнерами интерьеров» (B2B-масштабирование) и «сегментация по стилевым предпочтениям» (B2C). Что из этого корректнее отнести к КФУ именно B2B-сегмента?',
 options:['Партнёрства с дизайнерами интерьеров','Сегментация по стилевым предпочтениям','Оба относятся только к B2C','Ни одно из перечисленного не является КФУ'],
 correct:0, explanation:'Для B2B-масштабирования ключевым фактором обычно становится сеть партнёрств (дизайнеры, застройщики, HoReCa), которая приносит стабильный поток корпоративных клиентов, тогда как стилевая сегментация — типичный инструмент B2C.'},
{id:'q23',topic:'kfu',type:'single',source:'practice',
 text:'КФУ отрасли быстрого питания часто называют «скорость обслуживания» и «стандартизация вкуса». На основе какого анализа обычно выявляют КФУ отрасли?',
 options:['Комплексного анализа отрасли и конкурентов (в т.ч. 5 сил Портера)','Только финансовой модели проекта','Только опроса основателя','Только анализа логотипа конкурентов'],
 correct:0, explanation:'КФУ выводятся из глубокого понимания того, что определяет победу в конкуренции в отрасли — это результат анализа отрасли, конкурентов и потребителей, а не изолированный шаг.'},
{id:'q24',topic:'kfu',type:'single',source:'practice',
 text:'Чем КФУ отличаются от конкурентного преимущества конкретной компании?',
 options:['КФУ — это общеотраслевые условия успеха, конкурентное преимущество — то, как именно ваша компания их обеспечивает лучше других','Это полные синонимы','КФУ относятся только к финансам, конкурентное преимущество — только к маркетингу','КФУ — это то же самое, что барьеры входа'],
 correct:0, explanation:'КФУ — рамка «что вообще нужно, чтобы побеждать в этой отрасли»; конкурентное преимущество — ответ на вопрос «почему именно мы обеспечим эти факторы лучше конкурентов».'},
{id:'q24b',topic:'kfu',type:'multi',source:'real',
 text:'Выберите верные утверждения о ключевых факторах успеха (несколько ответов): «Ключевые факторы успеха ...»',
 options:['могут меняться со временем','это копирование стратегий конкурентов, чтобы не отставать от рынка','это те факторы, которым фирма должна уделять особое внимание, так как именно они определяют успех (провал) фирмы на рынке','это показатель наивысшего приоритета, отражающий ключевую цель компании','это любые нововведения, даже если они не дают мгновенных преимуществ','это числовые показатели деятельности, которые помогают измерить степень достижения целей (результативность и эффективность)','индивидуальны для каждой компании на рынке'],
 correct:[0,2], explanation:'Верны только два утверждения: КФУ действительно МОГУТ МЕНЯТЬСЯ со временем (A) — то, что было критично 10 лет назад, сегодня может быть неактуально; и КФУ — это именно те факторы, которым фирма должна уделять особое внимание, так как они определяют успех или провал на рынке (C) — это, по сути, определение КФУ. Остальные пункты — распространённые ловушки: КФУ ≠ копирование конкурентов (B); КФУ описывают отраслевые условия, а не «наивысший приоритет компании» (D, это больше про стратегическую цель); КФУ — не любое нововведение (E); формулировка про «числовые показатели, измеряющие результативность» (F) описывает KPI, а не КФУ — их часто путают; и КФУ, в отличие от конкурентного преимущества, как правило ОБЩИЕ для всех компаний отрасли, а не индивидуальны (G) — индивидуально то, КАК компания их реализует.'},
{id:'q24c',topic:'kfu',type:'single',source:'practice',
 text:'Для фарм-компании, разрабатывающей новые лекарства, одним из КФУ отрасли обычно называют «сильную патентную защиту разработок». Почему это именно КФУ, а не просто конкурентное преимущество отдельной компании?',
 options:['Потому что без патентной защиты ЛЮБАЯ компания в этой отрасли рискует потерять инвестиции в R&D, если конкуренты скопируют разработку — это условие успеха для всех игроков отрасли','Потому что патенты есть только у одной компании на рынке','Потому что это единственный фактор, который вообще существует в фарм-отрасли','Потому что патентная защита не связана с бизнес-моделью'],
 correct:0, explanation:'КФУ — это то, что нужно ЛЮБОЙ компании отрасли, чтобы быть конкурентоспособной. В фармацевтике огромные вложения в R&D окупаются только при защите от копирования — поэтому патентная защита является отраслевым условием успеха, а не просто удачным ходом одной фирмы.'},

/* ================= ai ================= */
{id:'q25',topic:'ai',type:'multi',source:'real',
 text:'Что из перечисленного ИИ МОЖЕТ делать в рамках финансового моделирования? (несколько ответов)',
 options:['Генерация формул Excel и Python-кода','Проверка расчётов NPV/IRR/PP','Валидация бизнес-логики допущений','Monte Carlo симуляция в Python','Учёт специфики именно вашего рынка','Написание финансового нарратива ("So what?")'],
 correct:[0,1,3,5], explanation:'ИИ хорошо справляется с механическими/вычислительными задачами: формулы, проверка расчётов, симуляции, текстовое оформление выводов. А вот валидация бизнес-логики и специфика конкретного рынка требуют человеческого суждения — этого ИИ сделать не может.'},
{id:'q26',topic:'ai',type:'multi',source:'real',
 text:'Что из перечисленного ИИ НЕ МОЖЕТ делать в финансовом моделировании? (несколько ответов)',
 options:['Определить, реалистичны ли финансовые показатели','Заменить понимание unit-экономики','Сгенерировать формулу Excel','Отфильтровать GIGO — мусор на входе','Сформировать сценарные допущения (опт./базовый/пессимистичный)'],
 correct:[0,1,3], explanation:'Суждение о реалистичности цифр, понимание unit-экономики и фильтрация некачественных входных данных (GIGO) — задачи, требующие человеческого понимания бизнеса. Генерация формул и сценарных допущений — механические задачи, с ними ИИ справляется.'},
{id:'q27',topic:'ai',type:'single',source:'real',
 text:'Зачем загружать собственные источники (отчёты, CSV) в ИИ-среду (например, NotebookLM или Claude Project) вместо того, чтобы просто спросить модель напрямую?',
 options:['Чтобы модель отвечала только на основе загруженных документов — это снижает галлюцинации и даёт ссылки на конкретные страницы','Чтобы модель работала быстрее','Это никак не влияет на качество ответов','Чтобы не платить за подписку'],
 correct:0, explanation:'Загрузка источников (embeddings/RAG) ограничивает модель отвечать в рамках предоставленных данных, а не «додумывать» из общих знаний — это прямо снижает риск галлюцинаций и позволяет проверить каждый ответ по первоисточнику.'},
{id:'q28',topic:'ai',type:'single',source:'real',
 text:'Что означает принцип GIGO применительно к работе с ИИ в финмоделировании?',
 options:['Если исходные допущения некачественные, результат работы ИИ тоже будет некачественным, как бы хорошо он ни был оформлен','ИИ всегда исправляет ошибки во входных данных автоматически','Это метод шифрования финансовых моделей','Это методология Monte Carlo симуляции'],
 correct:0, explanation:'GIGO — «garbage in, garbage out»: мусор на входе = мусор на выходе. ИИ не проверяет реалистичность ваших допущений, поэтому ответственность за качество входных данных остаётся на человеке.'},
{id:'q29',topic:'ai',type:'single',source:'practice',
 text:'Команда просит ИИ «оценить TAM/SAM/SOM ТОЛЬКО на основе загруженных документов, а если данных не хватает — прямо сказать об этом». Зачем нужно такое ограничение в промпте?',
 options:['Чтобы ИИ не подменял отсутствующие данные придуманными цифрами','Чтобы ответ был короче','Чтобы ускорить работу модели','Такое ограничение не имеет смысла'],
 correct:0, explanation:'Без явного ограничения модель может «дозаполнить» пробелы правдоподобно звучащими, но не подтверждёнными цифрами. Явное указание использовать только загруженные данные и честно сообщать о нехватке информации снижает риск галлюцинаций.'},
{id:'q30',topic:'ai',type:'single',source:'practice',
 text:'Финмодель показывает NPV = 12,3 млн руб., но допущение по конверсии в 25% никак не обосновано рыночными данными. Что здесь в первую очередь должен сделать автор бизнес-плана, а не ИИ?',
 options:['Обосновать или скорректировать допущение о конверсии, опираясь на реальные рыночные данные','Попросить ИИ пересчитать NPV ещё раз с теми же допущениями','Увеличить ставку дисконтирования','Убрать раздел с чувствительностью'],
 correct:0, explanation:'ИИ может пересчитать формулы сколько угодно раз — но не может проверить, откуда взялась цифра 25% и насколько она реалистична для конкретного рынка. Это задача человека — найти и указать обоснование или пересмотреть допущение.'},
{id:'q30b',topic:'ai',type:'single',source:'practice',
 text:'Студент просит ИИ «посчитай NPV проекта» без указания ставки дисконтирования, горизонта и валюты. ИИ выдаёт правдоподобный ответ с конкретным числом. В чём главный риск такого использования ИИ?',
 options:['ИИ мог подставить собственные (не обоснованные вашим кейсом) допущения по умолчанию, и итоговое число будет фактически придумано, хоть и выглядит правдоподобно','ИИ физически не может считать NPV','Такой промпт гарантированно вызовет ошибку и не даст ответа','Риска нет, если формула NPV использована верно'],
 correct:0, explanation:'Это классический случай GIGO при нечётком промпте: если не задать ставку дисконтирования и горизонт явно, ИИ вынужден додумать их сам — и тогда результат лишь ВЫГЛЯДИТ достоверно, хотя реально основан на невидимых, не согласованных с вами допущениях.'},
{id:'q30c',topic:'ai',type:'single',source:'practice',
 text:'Почему в промпт для оценки TAM/SAM/SOM рекомендуется явно писать «используй только данные из загруженных источников, а если данных нет — скажи об этом»?',
 options:['Это снижает риск того, что ИИ подставит правдоподобно звучащие, но не подтверждённые цифры вместо честного «недостаточно данных»','Это техническое требование платформы, иначе промпт не сработает','Без этой фразы ИИ откажется отвечать вообще','Это увеличивает скорость ответа модели'],
 correct:0, explanation:'Явное ограничение источников — это защита от галлюцинаций: без него модель, стремясь дать полезный ответ, может незаметно подставить собственные усреднённые оценки вместо честного признания нехватки данных.'},
