{id:'q31',topic:'business-model',type:'multi',source:'real',
 text:'Какие блоки НЕ входят в канву бизнес-модели Остервальдера? (несколько ответов)',
 options:['Организационная структура','Финансовая модель','Маркетинговые инструменты','Потребительские сегменты','Структура издержек','Ключевые партнёры'],
 correct:[0,1,2], explanation:'Канва Остервальдера состоит из 9 блоков: потребительские сегменты, ценностные предложения, каналы сбыта, взаимоотношения с клиентами, потоки дохода, ключевые ресурсы, ключевые виды деятельности, ключевые партнёры, структура издержек. Организационная структура, финансовая модель и маркетинговые инструменты — отдельные разделы бизнес-плана, но не блоки канвы.'},
{id:'q32',topic:'business-model',type:'single',source:'practice',
 text:'На какой вопрос отвечает блок канвы «Ключевые ресурсы»?',
 options:['Какие активы нам нужны для создания ценности каждой группе клиентов?','За что клиент готов платить?','Кто наши ключевые партнёры?','Как мы доставляем продукт клиенту?'],
 correct:0, explanation:'Блок «Ключевые ресурсы» описывает материальные, человеческие, интеллектуальные и финансовые активы, без которых бизнес-модель не может функционировать.'},
{id:'q33',topic:'business-model',type:'single',source:'practice',
 text:'Стартап-платформа обслуживает и водителей, и пассажиров, при этом без одной из сторон бизнес-модель не работает. Что здесь особенно важно детально проработать в блоке «Потребительские сегменты»?',
 options:['Обе взаимосвязанные стороны платформы отдельно, так как это многосторонняя платформа','Только сторону с более высоким доходом','Только водителей, так как они — поставщики услуги','Сегментацию можно пропустить, если аудитория большая'],
 correct:0, explanation:'Для многосторонних платформ канва требует раскрыть каждый взаимосвязанный сегмент отдельно — при отсутствии доступа к одному из них бизнес-модель нефункциональна.'},
{id:'q34',topic:'business-model',type:'single',source:'practice',
 text:'В блоке «Взаимоотношения с клиентами» указано «автоматизированное обслуживание» и «сообщество поддержки в соцсетях». Что здесь описывается?',
 options:['Характер и стиль отношений компании с сегментами клиентов','Каналы, по которым доставляется продукт','Источники дохода компании','Ключевые ресурсы компании'],
 correct:0, explanation:'Блок «Взаимоотношения с клиентами» описывает именно характер и тип связи с каждым сегментом — личная поддержка, самообслуживание, автоматизация, сообщества и т.п.'},
{id:'q35',topic:'business-model',type:'single',source:'practice',
 text:'Какой инструмент детальнее прорабатывает соответствие ценностного предложения потребностям клиента — задачи (jobs), боли (pains) и выгоды (gains)?',
 options:['Value Proposition Canvas','Канва бизнес-модели целиком','5 сил Портера','4P'],
 correct:0, explanation:'Именно Value Proposition Canvas детализирует правую (клиент) и левую (продукт) стороны основной канвы через профиль клиента и карту ценности.'},
{id:'q36',topic:'business-model',type:'single',source:'practice',
 text:'Компания берёт с клиентов ежемесячную абонентскую плату за доступ к сервису. К какому блоку канвы это относится?',
 options:['Потоки поступления дохода','Структура издержек','Ключевые виды деятельности','Каналы сбыта'],
 correct:0, explanation:'Абонентская плата — один из вариантов монетизации (постоянный доход от регулярных платежей), что относится именно к блоку «Потоки поступления дохода».'},
{id:'q37',topic:'business-model',type:'single',source:'practice',
 text:'Почему при заполнении блока «Потребительские сегменты» рекомендуется опираться на потребности клиента, а не на пол/возраст/доход?',
 options:['Потому что сегмент, объединённый по общей потребности, точнее показывает, кому и зачем нужен продукт, чем формальные демографические признаки','Потому что демографические данные собирать запрещено','Потому что доход клиента никогда не влияет на продукт','Потому что так требует только канва Остервальдера, а нигде больше это не применяется'],
 correct:0, explanation:'Люди одного возраста и дохода могут иметь совершенно разные потребности. Сегментация по потребностям/поведению даёт более точное и практически применимое разделение аудитории.'},
{id:'q37b',topic:'business-model',type:'single',source:'practice',
 text:'В блоке «Ключевые партнёры» стартап-кофейня указывает «поставщик обжаренных зёрен» и «арендодатель помещения». Какую роль обычно играет блок «Ключевые партнёры» в канве?',
 options:['Показывает, кто снабжает компанию ресурсами и снижает её риски/затраты, оставаясь при этом внешней стороной, а не частью самой компании','Показывает всех потенциальных клиентов компании','Дублирует блок «Потоки поступления дохода»','Обязательно включает только государственные организации'],
 correct:0, explanation:'Ключевые партнёры — это внешние стороны (поставщики, подрядчики, стратегические союзники), которые дают компании ресурсы или снижают риск/издержки, но не входят в саму компанию и не являются клиентами.'},
{id:'q37c',topic:'business-model',type:'single',source:'practice',
 text:'Два бизнеса имеют одинаковый продукт, но разные каналы: один продаёт только через маркетплейсы, другой — только через собственные шоурумы. Различие в каком блоке канвы это отражает в первую очередь?',
 options:['Каналы сбыта','Ключевые ресурсы','Структура издержек','Взаимоотношения с клиентами'],
 correct:0, explanation:'Способ, которым продукт физически доходит до клиента (маркетплейс vs. шоурум), — это прямое определение блока «Каналы сбыта».'},
{id:'q37d',topic:'business-model',type:'single',source:'real',
 text:'Сколько основных блоков включает классическая Business Model Canvas?',
 options:['12','7','8','10','11','9'],
 correct:5, explanation:'Канва Остервальдера состоит ровно из 9 блоков: потребительские сегменты, ценностные предложения, каналы сбыта, взаимоотношения с клиентами, потоки дохода, ключевые ресурсы, ключевые виды деятельности, ключевые партнёры, структура издержек.'},
{id:'q37e',topic:'business-model',type:'multi',source:'real',
 data:'Яндекс — это экосистема, в которую входит множество бизнес-единиц (БЕ) от функции поисковика до сервиса по доставке еды. Во время пандемии Яндекс.Еда стала одним из самых быстрорастущих активов компании, ввиду того что стала помогать размещать, продвигать товары поставщиков через свою платформу, своевременно доставляя их до клиентов. Компания не имеет права собственности над продаваемыми товарами и выполняет роль маркетплейса.',
 text:'Выделите ценностное(-ые) предложение(-ия) компании Яндекс.Еда (несколько ответов)',
 options:['Своевременная доставка еды','Производство готовой еды','Возможность выбора ресторанов по локации расположения','Продажа готовой еды','Возможность заказать еду и забрать её самостоятельно','Продвижение внутри платформы'],
 correct:[0,2,4,5], explanation:'Кейс прямо говорит: компания НЕ имеет права собственности над товарами и работает по модели маркетплейса — значит, «производство готовой еды» (B) и «продажа готовой еды» (D) НЕ являются её ценностным предложением, это делают рестораны-партнёры, а не сама платформа. Настоящие ценностные предложения Яндекс.Еды: своевременная доставка (A) и возможность самостоятельного самовывоза (E) — для клиентов; выбор по локации (C) — тоже для клиентов; продвижение товаров поставщиков внутри платформы (F) — это ценностное предложение для другого сегмента канвы, ресторанов-партнёров (в маркетплейс-модели ценностные предложения часто формулируются отдельно для каждой из сторон платформы).'},

{id:'q38',topic:'segmentation',type:'multi',source:'real',
 text:'Какие из перечисленных критериев сегментации относятся к психографическим? (несколько ответов)',
 options:['Девушка 25–35 лет','Замужем, беременна','К решению проблем подходит системно и логично','Носит одежду только высокого качества (для неё ключевой параметр — качество товара)','Ведёт здоровый образ жизни, занимается спортом','Получила высшее образование — факультет УЦПиБА НИУ ВШЭ','Любит отдыхать около моря','Проживает в Балашихе','Имеет доход в размере 500 000 руб. в месяц','В свободное время смотрит рилзы'],
 correct:[2,3,4,6], explanation:'Психографика — это образ жизни, ценности, черты характера и стиль принятия решений: «подходит системно и логично» (C), «ключевой параметр — качество» (D), «ведёт ЗОЖ» (E), «любит отдыхать у моря» (G, лайфстайл-предпочтение). Возраст (A), замужество (B), образование (F), доход (I) — демографические признаки; проживание в Балашихе (H) — географический; просмотр рилзов (J) — поведенческий (паттерн потребления контента), а не психографический.'},
{id:'q38b',topic:'segmentation',type:'multi',source:'real',
 text:'Какие из перечисленных критериев сегментации относятся к психографическим? (несколько ответов, второй вариант формулировок)',
 options:['Девушка молодого возраста','Проживает на юге Подмосковья','Предпочитает холодный северный климат','Имеет высшее образование в сфере менеджмента','Является вегетарианкой','Занимается йогой','Не замужем, детей нет','Выбирает продукцию по цене (искомая выгода — экономия)','Имеет уровень дохода в размере 80 000 руб. в месяц','Покупает шаурму три раза в неделю'],
 correct:[2,4,5], explanation:'Психографические признаки описывают образ жизни и предпочтения: предпочтение климата (C), вегетарианство (E) и занятия йогой (F) — всё это про жизненные ценности и привычки. «Выбирает по цене / экономия» (H) — это ПОВЕДЕНЧЕСКИЙ признак (сегментация по искомой выгоде), а не психографический — частая ловушка, их легко перепутать. Возраст (A), образование (D), семейное положение (G), доход (I) — демографические; регион (B) и частота покупки шаурмы (J) — географический и поведенческий соответственно.'},
{id:'q38c',topic:'segmentation',type:'single',source:'real',
 data:'SaaS-компания обслуживает как предприятия (B2B), так и индивидуальных потребителей (B2C), но использует единый маркетинговый подход и подозревает, что применяет плохой таргетинг.',
 text:'Какой шаг наиболее эффективно отличит сегмент B2B от сегмента B2C?',
 options:['Распределение пользователей по группам доходов','Группировка по типу устройства (смартфон/десктоп)','Определение критериев покупки: корпоративные пакетные лицензии против индивидуальных подписок','Маркетинг с привлечением знаменитостей'],
 correct:2, explanation:'Признак, который НАПРЯМУЮ отражает различие между B2B и B2C для SaaS-продукта — это модель покупки: корпоративные клиенты покупают пакетные лицензии на команду, а частные пользователи — индивидуальные подписки. Доход, тип устройства и медийный маркетинг не проводят чёткую границу именно между бизнес- и частными клиентами.'},
{id:'q38d',topic:'segmentation',type:'single',source:'real',
 text:'Какое определение соответствует ПСИХОГРАФИЧЕСКОМУ принципу сегментации?',
 options:['Деление рынка на группы потребителей по территориальному признаку (страна, регион, город, климат, плотность населения)','Деление рынка на группы потребителей на основе личных характеристик: возраста, пола, дохода, образования, семейного положения и этапа жизненного цикла','Деление рынка на группы потребителей на основе их ментальных характеристик и предпочтений: образа жизни, ценностей, личностных качеств, интересов и убеждений','Деление потребителей на группы на основе их действий, реакции на продукт, привычек покупки и использования'],
 correct:2, explanation:'Психографическая сегментация — это именно про «внутренний мир» потребителя: образ жизни, ценности, личностные качества, интересы, убеждения. Первое определение (территория/климат) — географическая сегментация; второе (возраст/пол/доход/образование/семейное положение) — демографическая; четвёртое (действия, реакция на продукт, привычки покупки) — поведенческая.'},
{id:'q38e',topic:'segmentation',type:'single',source:'practice',
 text:'Какое определение соответствует ДЕМОГРАФИЧЕСКОМУ принципу сегментации?',
 options:['Деление потребителей на группы на основе их действий, реакции на продукт, привычек покупки и использования','Деление рынка на группы потребителей на основе личных характеристик: возраста, пола, дохода, образования, семейного положения и этапа жизненного цикла','Деление рынка на группы потребителей по территориальному признаку (страна, регион, город, климат, плотность населения)','Деление рынка на группы потребителей на основе их ментальных характеристик и предпочтений: образа жизни, ценностей, личностных качеств, интересов и убеждений'],
 correct:1, explanation:'Демографическая сегментация — самая «формальная» из четырёх: возраст, пол, доход, образование, семейное положение, этап жизненного цикла. Это те признаки, которые легко получить из паспортных/анкетных данных, но которые сами по себе слабо объясняют мотивацию покупки. Первое определение — поведенческая сегментация, третье — географическая, четвёртое — психографическая.'},
{id:'q38f',topic:'segmentation',type:'single',source:'practice',
 text:'Какое определение соответствует ПОВЕДЕНЧЕСКОМУ принципу сегментации?',
 options:['Деление потребителей на группы на основе их действий, реакции на продукт, привычек покупки и использования','Деление рынка на группы потребителей на основе личных характеристик: возраста, пола, дохода, образования, семейного положения и этапа жизненного цикла','Деление рынка на группы потребителей на основе их ментальных характеристик и предпочтений: образа жизни, ценностей, личностных качеств, интересов и убеждений','Деление рынка на группы потребителей по территориальному признаку (страна, регион, город, климат, плотность населения)'],
 correct:0, explanation:'Поведенческая сегментация смотрит не на то, КТО клиент, а на то, ЧТО он делает: как часто покупает, реагирует ли на скидки, какую выгоду ищет, насколько лоялен. Второе определение — демографическая, третье — психографическая, четвёртое — географическая.'},
{id:'q38g',topic:'segmentation',type:'multi',source:'real',
 text:'Какие из перечисленных критериев сегментации относятся к ДЕМОГРАФИЧЕСКИМ? (несколько ответов)',
 options:['Девушка 25–35 лет','Проживает в Балашихе','Замужем, есть двое детей','Ведёт здоровый образ жизни, занимается спортом','Имеет высшее образование в сфере менеджмента','Покупает товар только во время распродаж','Имеет доход в размере 150 000 руб. в месяц','Любит слушать подкасты по вечерам','Мужчина 45–60 лет','Проживает в городе-миллионнике'],
 correct:[0,2,4,6,8], explanation:'Демографические признаки — это формальные, «паспортные» характеристики человека: возраст (A, I), семейное положение и число детей (C), образование (E), доход (G). Проживание в конкретном городе (B) и в городе-миллионнике (J) — географические признаки; ЗОЖ (D) и любовь к подкастам (H) — психографические (образ жизни и интересы); покупка только на распродажах (F) — поведенческий признак.'},
{id:'q38h',topic:'segmentation',type:'multi',source:'real',
 text:'Какие из перечисленных критериев сегментации относятся к ПОВЕДЕНЧЕСКИМ? (несколько ответов)',
 options:['Открывает приложение каждый день, но ничего не покупает','Покупает товар только во время распродаж и акций','Проживает в северном регионе с холодным климатом','Совершает покупку регулярно, раз в неделю','Ключевой параметр выбора — низкая цена (искомая выгода — экономия)','Является убеждённым вегетарианцем','Средний чек одной покупки выше 5 000 руб.','Возраст 30–40 лет','Активно оставляет отзывы после каждой покупки','Предпочитает подходить к решениям системно и взвешенно'],
 correct:[0,1,3,4,6,8], explanation:'Поведенческие признаки описывают действия и паттерны использования продукта, а не то, кем является клиент: паттерн взаимодействия без покупки (A), чувствительность к акциям (B), частота покупок (D), искомая выгода — цена (E), размер среднего чека как паттерн трат (G), активность в оставлении отзывов — тоже поведенческий паттерн вовлечённости (I). Климат (C) — географический признак; вегетарианство (F) и системный подход к решениям (J) — психографические; возраст (H) — демографический.'},
{id:'q38i',topic:'segmentation',type:'multi',source:'practice',
 text:'Какие из перечисленных критериев сегментации относятся к ГЕОГРАФИЧЕСКИМ? (несколько ответов)',
 options:['Проживает в Балашихе','Ведёт здоровый образ жизни','Житель города-миллионника','Возраст 25–34 года','Живёт в регионе с холодным климатом','Покупает товар только по акциям','Юг Московской области','Плотность населения в районе проживания высокая'],
 correct:[0,2,4,6,7], explanation:'Географическая сегментация — это деление по территориальному признаку: конкретный город (A), тип населённого пункта (C), климат региона (E), часть области (G), плотность населения (H). ЗОЖ (B) — психографика, возраст (D) — демография, покупка по акциям (F) — поведение.'},
{id:'q39',topic:'segmentation',type:'single',source:'practice',
 text:'В чём смысл аббревиатуры STP?',
 options:['Segmentation → Targeting → Positioning','Segmentation → Testing → Promotion','Strategy → Target → Product','Sales → Trade → Profit'],
 correct:0, explanation:'STP — стандартная последовательность: сначала сегментируем рынок, затем выбираем целевые сегменты (targeting), затем формируем позиционирование продукта для них.'},
{id:'q40',topic:'segmentation',type:'single',source:'practice',
 text:'Что из перечисленного — пример поведенческой сегментации?',
 options:['Клиенты, покупающие товар только по акциям и распродажам','Клиенты 25–34 лет','Клиенты из Санкт-Петербурга','Клиенты с доходом выше среднего'],
 correct:0, explanation:'Поведенческая сегментация строится на паттернах использования продукта — в данном случае на чувствительности к скидкам, то есть на поведении при покупке.'},
{id:'q40b',topic:'segmentation',type:'single',source:'practice',
 text:'Сеть фитнес-клубов выделяет сегмент «посещает зал 4+ раза в неделю уже больше года, покупает годовой абонемент, а не разовые визиты». Какой это тип сегментации?',
 options:['Поведенческая','Демографическая','Географическая','Психографическая'],
 correct:0, explanation:'Частота посещений, стаж «использования продукта» и формат оплаты (абонемент vs разовый визит) — это паттерны поведения клиента, а не то, кем он является демографически или что ценит психографически.'},
{id:'q40c',topic:'segmentation',type:'single',source:'practice',
 text:'Интернет-магазин делит покупателей на группы: «новички» (первая покупка), «повторные» (2–5 покупок) и «постоянные» (6+ покупок за год). Это пример какого типа сегментации?',
 options:['Поведенческой — по статусу лояльности и истории покупок','Демографической — по возрасту клиента','Географической — по региону доставки','Психографической — по стилю жизни'],
 correct:0, explanation:'Деление по количеству и истории покупок — классический пример поведенческой сегментации по статусу лояльности (одна из стандартных поведенческих переменных наряду с искомой выгодой, интенсивностью потребления и поводом покупки).'},
{id:'q41',topic:'segmentation',type:'single',source:'practice',
 text:'Зачем командам рекомендуется оформлять портрет целевого сегмента в виде «персоны» с именем и конкретными чертами?',
 options:['Чтобы вызвать эмпатию у команды и удержать фокус на реальных потребностях, а не абстрактной группе','Потому что этого требует налоговое законодательство','Чтобы автоматически рассчитать TAM','Персона заменяет собой весь анализ рынка'],
 correct:0, explanation:'Конкретный собирательный образ («Анна, 28 лет, ...») облегчает командную эмпатию и удерживает фокус разработки продукта на реальных нуждах клиента, а не на абстрактных цифрах.'},
{id:'q42',topic:'segmentation',type:'single',source:'practice',
 text:'Компания выделяет сегмент «пользователи, которые открывают приложение каждый день, но никогда не совершают покупку». Какой это тип сегментации?',
 options:['Поведенческая','Демографическая','Географическая','Психографическая'],
 correct:0, explanation:'Частота использования и паттерн взаимодействия с продуктом (открывает, но не покупает) — это поведенческий признак.'},
{id:'q42b',topic:'segmentation',type:'single',source:'practice',
 text:'Банк выделяет клиентов по критериям: возраст 35–50 лет, семейное положение «женат/замужем», наличие детей школьного возраста, уровень дохода «выше среднего». Какой тип сегментации использован?',
 options:['Демографическая','Поведенческая','Психографическая','Географическая'],
 correct:0, explanation:'Все перечисленные признаки — возраст, семейное положение, наличие детей, уровень дохода — это классические демографические переменные: формальные, легко измеримые характеристики человека.'},
{id:'q42c',topic:'segmentation',type:'single',source:'practice',
 text:'Ритейлер одежды делит покупателей на группы по городам: Москва, Санкт-Петербург, города-миллионники, малые города. Какой тип сегментации использован?',
 options:['Географическая','Демографическая','Поведенческая','Психографическая'],
 correct:0, explanation:'Деление по типу и названию населённого пункта — прямой пример географической сегментации, определяющей территорию, в пределах которой у ритейлера разная логистика, ассортимент и покупательная способность аудитории.'},
{id:'q43',topic:'segmentation',type:'single',source:'practice',
 text:'Почему сегментация «только по полу и возрасту» часто считается недостаточной для качественного бизнес-плана?',
 options:['Люди одного пола и возраста могут иметь совершенно разные потребности и модели поведения','Пол и возраст вообще нельзя использовать в бизнес-планировании','Такая сегментация всегда запрещена законом','Она слишком сложна в применении'],
 correct:0, explanation:'Демографические признаки — грубый срез, не объясняющий мотивацию покупки. Более точную и применимую картину дают потребности, поведение и психографика.'},

{id:'q44',topic:'marketing-mix',type:'multi',source:'real',
 text:'Что из перечисленного относится к параметру «Продукт» в модели 4P? (несколько ответов)',
 options:['Наименование продукции','Указание уникального торгового предложения','Список магазинов, где можно купить продукт','Описание функционала товара','Условия оплаты для покупки товара','Продвижение товара через ATL-каналы','Наличие бонусной программы','Указание гарантийного срока','Возможность приобретения в кредит','Упаковка товара','Описание состава продукции'],
 correct:[0,3,7,9,10], explanation:'«Продукт» описывает сам товар: название (A), функционал (D), гарантийный срок (H), упаковку (J), состав (K). УТП (B) и продвижение через ATL (F) — часть «Продвижения»; список магазинов (C) — «Место»; условия оплаты (E), бонусная программа (G) и возможность покупки в кредит (I) — относятся к «Цене»/«Продвижению», а не к самому продукту.'},
{id:'q45',topic:'marketing-mix',type:'single',source:'practice',
 text:'К какому элементу 4P относится наличие рассрочки и скидок за объём?',
 options:['Price (цена)','Product (продукт)','Place (место)','Promotion (продвижение)'],
 correct:0, explanation:'Условия оплаты — рассрочка, скидки, кредит — часть элемента «Цена», описывающего, как именно клиент платит.'},
{id:'q46',topic:'marketing-mix',type:'single',source:'practice',
 text:'Чем модель 4C отличается от классической 4P?',

 correct:0, explanation:'4C — это эволюция 4P: Product→Customer value, Price→Cost (затраты клиента, не только цена), Place→Convenience, Promotion→Communication (двусторонняя, а не только вещание).'},
{id:'q47',topic:'marketing-mix',type:'single',source:'practice',
 text:'Наличие бонусной программы лояльности — это элемент какого P?',

 correct:0, explanation:'Бонусные и программы лояльности — инструмент стимулирования сбыта, то есть часть «Продвижения».'},
{id:'q48',topic:'marketing-mix',type:'single',source:'practice',
 text:'Список магазинов, где можно купить продукт, относится к какому элементу 4P?',

{id:'q49',topic:'marketing-mix',type:'single',source:'practice',
 text:'Указание уникального торгового предложения (УТП) в описании продукта — к какому P ближе всего по смыслу?',
 options:['Скорее к Promotion / позиционированию, так как это способ выделить продукт в коммуникации с рынком','К Place, так как это про каналы','К Price, так как УТП всегда о цене','Ни к одному из P — это финансовый показатель'],
 correct:0, explanation:'УТП формулируется для донесения отличия продукта до рынка — это ближе к позиционированию и продвижению, а не к техническому описанию самого продукта.'},
{id:'q49b',topic:'marketing-mix',type:'multi',source:'real',
 data:'Устойчивый бренд закусок нацелен на потребителей, заботящихся о своём здоровье, по всей стране. Бренд должен оптимизировать компонент «Место» (Place).',
 text:'Какие действия обычно усиливают дистрибуцию, чтобы охватить нужных клиентов? (несколько ответов)',
 options:['Избегать любой электронной коммерции для сохранения эксклюзивности бренда','Предлагать прямую доставку потребителю через веб-сайт бренда','Сосредоточить внимание на придорожных магазинах у автомагистралей','Выстроить партнёрство с узкоспециализированными розничными продавцами здорового питания','Опираться исключительно на крупную продуктовую сеть','Разработать модель подписки на ежемесячную доставку закусок'],
 correct:[1,3,5], explanation:'Для бренда с нацеленностью на здоровое питание по всей стране лучше всего работают: прямые продажи через сайт (B, снимает географические ограничения), партнёрство со специализированными магазинами здорового питания (D, точное попадание в целевой сегмент) и подписочная модель доставки (F, удобство и повторные покупки). Отказ от e-commerce (A) ограничивает охват; придорожные магазины у трасс (C) не соответствуют профилю ЗОЖ-аудитории; а слово «ИСКЛЮЧИТЕЛЬНО» в варианте E — красный флаг: чрезмерная зависимость от одной крупной сети снижает переговорные позиции бренда и не расширяет охват.'},
{id:'q49c',topic:'marketing-mix',type:'single',source:'real',
 data:'Компания «ВкусВилл»: средняя наценка = 35% на себестоимость. Себестоимость корзины = 1 200 руб.',
 text:'Найдите цену продажи корзины.',
 options:['1 770 руб.','1 420 руб.','1 200 руб.','1 620 руб.','1 550 руб.','2 400 руб.'],
 correct:3, explanation:'Цена продажи = Себестоимость × (1 + наценка) = 1 200×(1+0,35) = 1 200×1,35 = 1 620 руб. Это элемент «Цена» (Price) в 4P — расчёт розничной цены через наценку на себестоимость, стандартный метод ценообразования «издержки плюс».'},

{id:'q50',topic:'opf',type:'multi',source:'real',
 text:'Что из перечисленного относится к коммерческим юридическим лицам по ГК РФ? (несколько ответов)',
 options:['Общество с ограниченной ответственностью','Товарищество собственников жилья','Непубличное акционерное общество','Муниципальное унитарное предприятие','Открытое акционерное общество','Потребительский кооператив','Адвокатская палата','Фонд поддержки предпринимателей','Производственный кооператив','Коммандитное товарищество','Крестьянское (фермерское) хозяйство'],
 correct:[0,2,3,4,8,9,10], explanation:'Коммерческие организации по ст. 50 ГК РФ: хозяйственные товарищества и общества (ООО, АО, товарищество на вере/коммандитное), унитарные предприятия, производственные кооперативы, крестьянские (фермерские) хозяйства. Некоммерческие — ТСЖ, потребительские кооперативы, адвокатские палаты и ФОНДЫ (в т.ч. фонды поддержки предпринимателей) — фонд как организационно-правовая форма по закону всегда некоммерческий, независимо от цели деятельности.'},
{id:'q51',topic:'opf',type:'single',source:'practice',
 text:'Чем принципиально отличается ответственность ИП от ответственности участника ООО?',
 options:['ИП отвечает по обязательствам личным имуществом, участник ООО — в пределах своей доли в уставном капитале','ИП вообще ни за что не отвечает','Участник ООО всегда отвечает личным имуществом, как и ИП','Разницы нет'],
 correct:0, explanation:'Это ключевое различие ОПФ: ИП несёт полную имущественную ответственность, тогда как ООО — это форма с ограниченной ответственностью участников в пределах их вклада.'},
{id:'q52',topic:'opf',type:'single',source:'practice',
 text:'Какая ОПФ подойдёт, если фрилансер работает один, без сотрудников, и хочет минимум отчётности при доходе 1,5 млн руб/год?',
 options:['Самозанятый (НПД)','ООО с ОСНО','Публичное акционерное общество','Производственный кооператив'],
 correct:0, explanation:'При доходе до 2,4 млн руб/год и без сотрудников самозанятость — самый простой режим: без отчётности, кассы и с низкой ставкой налога.'},
{id:'q53',topic:'opf',type:'single',source:'practice',
 text:'Почему инвестору проще войти в состав участников ООО, чем в бизнес ИП?',
 options:['Достаточно оформить долю в уставном капитале, тогда как для ИП пришлось бы создавать отдельное юрлицо','ИП вообще не может привлекать инвестиции','В ООО нельзя иметь более одного участника','Это не так — разницы нет'],
 correct:0, explanation:'У ИП нет структуры долей/акций, поэтому для входа инвестора обычно требуется создание отдельного юрлица; в ООО инвестор просто получает долю в уставном капитале.'},
{id:'q54',topic:'opf',type:'single',source:'practice',
 text:'Компания планирует открывать филиалы в нескольких городах и держать сложную структуру совладения. Какая ОПФ для этого органичнее?',
 options:['ООО (или АО)','ИП','Самозанятость','Производственный кооператив с одним участником'],
 correct:0, explanation:'ИП не создаёт и не регистрирует филиалы официально; ООО/АО изначально рассчитаны на масштабирование, множественность владельцев и филиальную сеть.'},
{id:'q55',topic:'opf',type:'single',source:'practice',
 text:'ИП без сотрудников не ведёт деятельность полгода. Что происходит со взносами в фонды?',
 options:['ИП всё равно обязан их платить вне зависимости от факта ведения деятельности','Взносы автоматически замораживаются','Взносы платить не нужно, если нет дохода','Взносы платит государство'],
 correct:0, explanation:'Особенность ИП — обязанность платить страховые взносы «за себя» независимо от того, ведётся ли фактическая деятельность и есть ли доход.'},
{id:'q55b',topic:'opf',type:'multi',source:'real',
 text:'Что из перечисленного НЕ относится к коммерческим юридическим лицам? (несколько ответов)',
 options:['Открытое акционерное общество','Фонд поддержки предпринимателей','Крестьянское (фермерское) хозяйство','Потребительский кооператив','Адвокатская палата','Непубличное акционерное общество','Муниципальное унитарное предприятие','Общество с ограниченной ответственностью','Товарищество собственников жилья','Производственный кооператив','Коммандитное товарищество'],
 correct:[1,3,4,8], explanation:'НЕ являются коммерческими (то есть являются некоммерческими организациями): фонд поддержки предпринимателей (B — фонд как ОПФ всегда некоммерческий, вне зависимости от благой цели деятельности), потребительский кооператив (D), адвокатская палата (E) и товарищество собственников жилья (I). Все остальные из списка — коммерческие: ОАО (A), КФХ (C), НАО (F), МУП (G), ООО (H), производственный кооператив (J) и коммандитное товарищество (K). Это зеркальная версия вопроса про «что ОТНОСИТСЯ к коммерческим» — таблицу стоит выучить в обе стороны, так как экзамен может спросить любым способом.'},

{id:'q56',topic:'tax-task',type:'numeric',source:'real',
 data:'В 2025 году продана недвижимость на 20 000 000 руб. Сумма размещена в банке под 15% годовых на 1 год. Налог = (Доход по вкладу − Необлагаемая база) × 13%. Необлагаемая база = Ключевая ставка ЦБ (15%) × 1 000 000 руб.',
 text:'Посчитайте сумму налога к уплате по истечении 1 года (в рублях).',
 answer:370500, tolerance:1000, unit:'₽',
 explanation:'Доход по вкладу = 20 000 000 × 15% = 3 000 000 ₽. Необлагаемая база = 15% × 1 000 000 = 150 000 ₽. Налог = (3 000 000 − 150 000) × 13% = 2 850 000 × 13% = 370 500 ₽.'},
{id:'q57',topic:'tax-task',type:'numeric',source:'practice',
 data:'Вклад 5 000 000 руб. под 18% годовых на 1 год. Необлагаемая база считается по ключевой ставке ЦБ 18% × 1 000 000 руб. Ставка налога — 13%.',
 text:'Посчитайте налог к уплате по вкладу за год (в рублях).',
 answer:93600, tolerance:500, unit:'₽',
 explanation:'Доход = 5 000 000×18%=900 000 ₽. Необлагаемая база = 18%×1 000 000=180 000 ₽. Налог = (900 000−180 000)×13% = 720 000×13% = 93 600 ₽.'},
{id:'q58',topic:'tax-task',type:'single',source:'practice',
 text:'ИП на УСН «Доходы» (6%) заработал за год 4 000 000 руб. выручки и подтвердил 3 200 000 руб. расходов. Сколько составит налог?',
 options:['240 000 руб. (6% от всей выручки, расходы не учитываются)','120 000 руб. (6% от разницы доходов и расходов)','480 000 руб.','0 руб., так как расходы почти равны доходам'],
 correct:0, explanation:'На УСН «Доходы» налог считается от ВСЕЙ выручки, независимо от расходов: 4 000 000×6%=240 000 руб. Расходы были бы важны только на УСН «Доходы минус расходы».'},
{id:'q59',topic:'tax-task',type:'single',source:'practice',
 text:'ООО на ОСНО получило выручку без НДС 10 000 000 руб., затраты (без НДС) — 6 000 000 руб. Налог на прибыль — 25%. Каким будет налог на прибыль?',
 options:['1 000 000 руб.','2 500 000 руб.','600 000 руб.','4 000 000 руб.'],
 correct:0, explanation:'Прибыль до налога = 10 000 000 − 6 000 000 = 4 000 000 руб. Налог на прибыль = 4 000 000 × 25% = 1 000 000 руб.'},
{id:'q59b',topic:'tax-task',type:'numeric',source:'real',
 data:'Вы собираетесь вложить накопленные средства в банк под процент. Банк А предлагает ставку 15% годовых (простой процент), банк Б — 16% годовых с учётом ежемесячной капитализации процентов. Вкладываете средства на 1 год. Планируете вложить по 500 000 руб. в каждый из банков (для распределения рисков).',
 text:'Сколько рублей вы заработаете суммарно (проценты по обоим вкладам) за год?',
 answer:161135, tolerance:1500, unit:'₽',
 explanation:'Банк А (простой процент): 500 000×15% = 75 000 руб. Банк Б (ежемесячная капитализация 16% годовых): эффективная годовая ставка = (1+0,16/12)^12 − 1 ≈ 17,23%, доход ≈ 500 000×0,1723 ≈ 86 135 руб. Суммарный доход ≈ 75 000+86 135 = 161 135 руб. Главный вывод задачи: при одинаковой номинальной ставке капитализация (начисление процента на процент) даёт заметно больше, чем простой процент — это и есть эффект капитализации, который стоит помнить для любых задач на вклады.'},
{id:'q59c',topic:'tax-task',type:'single',source:'practice',
 text:'ИП на УСН «Доходы минус расходы» (15%) заработал 6 000 000 руб. выручки, подтвердил 4 500 000 руб. расходов. Какой налог нужно заплатить?',
 options:['225 000 руб.','900 000 руб.','360 000 руб.','675 000 руб.'],
 correct:0, explanation:'Налоговая база = 6 000 000 − 4 500 000 = 1 500 000 руб. Налог = 1 500 000×15% = 225 000 руб.'},
{id:'q59d',topic:'tax-task',type:'single',source:'real',
 data:'Компания на УСН «Доходы минус расходы» (15%). Доходы — 10 000 тыс. руб., расходы — 7 000 тыс. руб.',
 text:'Налог составит:',
 options:['1 050 тыс. руб.','700 тыс. руб.','300 тыс. руб.','600 тыс. руб.','1 500 тыс. руб.','450 тыс. руб.'],
 correct:5, explanation:'Налоговая база = 10 000 − 7 000 = 3 000 тыс. руб. Налог = 3 000×15% = 450 тыс. руб.'},
{id:'q59e',topic:'tax-task',type:'single',source:'real',
 data:'ИП-самозанятый работает с юридическими лицами. Доход за год — 2 000 тыс. руб. Ставка НПД с юрлиц — 6%.',
 text:'Налог по НПД составит:',
 options:['300 тыс. руб.','200 тыс. руб.','60 тыс. руб.','40 тыс. руб.','80 тыс. руб.','120 тыс. руб.'],
 correct:5, explanation:'Налог = 2 000×6% = 120 тыс. руб. Ставка НПД зависит от того, с кем работает самозанятый: 4% при расчётах с физлицами, 6% — с ИП и юрлицами; здесь клиенты — юрлица, значит, применяется 6%.'},
{id:'q59f',topic:'tax-task',type:'single',source:'real',
 data:'Компания продаёт товар по 3 000 руб. (без НДС). НДС = 22%.',
 text:'Цена для покупателя с НДС составит:',
 options:['3 300 руб.','3 600 руб.','3 220 руб.','4 000 руб.','3 000 руб.','3 660 руб.'],
 correct:5, explanation:'Цена с НДС = Цена без НДС × (1+ставка НДС) = 3 000×1,22 = 3 660 руб.'},
{id:'q59g',topic:'tax-task',type:'single',source:'real',
 data:'Компания на ОСНО. Выручка с учётом НДС = 12 200 тыс. руб. (НДС 22% уже включён в эту сумму).',
 text:'Найдите сумму НДС, включённую в цену.',
 options:['1 000 тыс. руб.','2 684 тыс. руб.','2 000 тыс. руб.','2 200 тыс. руб.','1 200 тыс. руб.','2 440 тыс. руб.'],
 correct:3, explanation:'Если в сумму 12 200 тыс. руб. УЖЕ включён НДС 22%, то это 122% от цены без НДС: Цена без НДС = 12 200/1,22 = 10 000 тыс. руб. Сумма НДС = 12 200 − 10 000 = 2 200 тыс. руб. Частая ошибка — сразу умножить 12 200×22%=2 684 (вариант B): так можно считать НДС только от суммы БЕЗ НДС, а не от суммы, в которую НДС уже включён.'},
/* ================= opf-tax-choice ================= */
{id:'q60',topic:'opf-tax-choice',type:'single',source:'real',
 data:'Консультант по маркетингу работает с клиентами с доходом около 5 млн руб./год, нанимает 1 ассистента (ФОТ 50 тыс. руб./мес). Офис не нужен.',
 text:'Какую ОПФ и систему налогообложения лучше выбрать?',
 options:['ИП и ПСН','ИП и УСН «Доходы» (6%)','Самозанятый (НПД)','ИП и УСН «Доходы минус расходы»','ООО и УСН «Доходы минус расходы»','ООО и УСН «Доходы»'],
 correct:1, explanation:'Наём сотрудника (ассистента) сразу исключает самозанятость (B) — у самозанятых не может быть наёмных работников. Расходы (ФОТ ассистента ~600 тыс./год + взносы ~30%) составляют около 15–16% выручки — намного меньше порога ≈60%, при котором «Доходы−Расходы» становится выгоднее «Доходов», поэтому вариант D невыгоден. ООО (E, F) не нужно — нет партнёров/инвесторов, а простая ИП дешевле в администрировании. Вариант A (ПСН) на первый взгляд заманчив фиксированной стоимостью патента, но патентная система доступна только по ограниченному перечню видов деятельности (в основном бытовые услуги, розница, общепит) — маркетинговый консалтинг, как правило, в этот список НЕ входит, и регион может отказать в патенте на такую деятельность. Поэтому самый надёжный и универсально доступный вариант — B) ИП и УСН «Доходы» (6%).'},
{id:'q61',topic:'opf-tax-choice',type:'numeric',source:'real',
 data:'ООО «Гамма»: в прошлом году продало товар P на 1 300 000 руб. и товар Q на 1 900 000 руб., а также оказало услуги консультирования 38 компаниям со средним чеком 105 000 руб. С начала года в компании работало 4 сотрудника с зарплатами 33, 39, 52 и 62 тыс. руб./мес соответственно. Аренда офиса — 75 000 руб./мес. Во втором полугодии компания наняла ещё двух специалистов с оплатой 72 тыс. руб./мес и арендовала соседнее помещение за 22 тыс. руб./мес. Компания уплатила страховые взносы в размере 30% от ФОТ. Дополнительные расходы — 90 000 руб. в год.',
 text:'Посчитайте, на сколько рублей чистая прибыль ООО «Гамма» на УСН «Доходы минус расходы» (15%) больше, чем на УСН «Доходы» (6%) — и тем самым определите более выгодный режим.',
 answer:124920, tolerance:3000, unit:'₽ разницы',
 explanation:'Выручка = 1 300 000 + 1 900 000 + 38×105 000(=3 990 000) = 7 190 000 руб. ФОТ = (33+39+52+62)×12 (4 сотрудника весь год, 186 тыс/мес) + (72×2)×6 (2 доп. специалиста во 2-м полугодии, 144 тыс/мес) = 2 232 000 + 864 000 = 3 096 000 руб. Страховые взносы = 30%×3 096 000 = 928 800 руб. Аренда = 75 000×12 + 22 000×6 = 900 000+132 000 = 1 032 000 руб. Итого расходы = 3 096 000+928 800+1 032 000+90 000 = 5 146 800 руб (≈71,6% от выручки — выше порога ≈60%). УСН «Доходы−Расходы»: налог=(7 190 000−5 146 800)×15%=306 480, прибыль=2 043 200−306 480=1 736 720. УСН «Доходы»: налог=7 190 000×6%=431 400, прибыль=2 043 200−431 400=1 611 800. Разница = 1 736 720−1 611 800 = 124 920 ₽ в пользу «Доходы−Расходы» — это и есть ответ. Дополнительно: ПСН для ООО недоступна вовсе (только для ИП), поэтому в списке вариантов её не может быть.'},
{id:'q61b',topic:'opf-tax-choice',type:'single',source:'real',
 data:'ООО «БП»: в прошлом году продало товар А на 1 400 000 руб. и товар Б на 1 800 000 руб., а также оказало услуги консультирования 35 компаниям со средним чеком 100 000 руб. С начала года в компании работало 4 сотрудника с зарплатами 35, 40, 55 и 65 тыс. руб./мес. Аренда офиса — 80 000 руб./мес. Во 2-м полугодии наняли 2 программистов по 75 тыс. руб./мес и арендовали помещение за 25 тыс. руб./мес. Страховые взносы — 30% от ФОТ. Доп. расходы — 100 000 руб./год.',
 text:'Какой режим налогообложения будет выгоднее для ООО «БП»?',
 options:['ОСНО (20% НДС + 20% налог на прибыль)','УСН «Доходы» по ставке 6%','УСН «Доходы минус расходы» по ставке 15%','ПСН в размере 250 тыс. руб.'],
 correct:2, explanation:'Выручка = 1 400 000+1 800 000+35×100 000(=3 500 000) = 6 700 000 руб. ФОТ = (35+40+55+65)×12(=2 340 000) + (75×2)×6(=900 000) = 3 240 000 руб. Взносы = 30%×3 240 000=972 000. Аренда = 80 000×12+25 000×6=960 000+150 000=1 110 000. Итого расходы = 3 240 000+972 000+1 110 000+100 000=5 422 000 руб (≈81% выручки — намного выше порога 60%). При такой высокой доле расходов «Доходы−Расходы» (15% от 1 278 000≈191 700 налога) выгоднее «Доходов» (6% от 6 700 000=402 000 налога) более чем вдвое. ПСН для ООО недоступна физически (только для ИП), поэтому D отпадает сразу, независимо от цифры.'},
{id:'q61c',topic:'opf-tax-choice',type:'single',source:'real',
 data:'Два близких друга решили открыть совместный бизнес — онлайн-школу. Не уверены в успехе, поэтому хотят начать быстро и с минимальными вложениями и рисками. Расходов (аренда, сырьё, зарплаты) почти нет, продвижение — только через Instagram. Друг другу доверяют и готовы оформить любые договорённости между собой. Хотят вести деятельность открыто и юридически грамотно.',
 text:'Какую организационно-правовую форму и систему налогообложения лучше выбрать?',
 options:['Товарищество на вере и ОСНО','ООО и ПСН','ООО и УСН «Доходы минус расходы»','ИП и ПСН'],
 correct:3, explanation:'Услуги обучения и репетиторства прямо входят в стандартный федеральный перечень видов деятельности для патентной системы (в отличие, например, от консалтинга) — поэтому ПСН здесь легально доступна, а фиксированная стоимость патента хорошо страхует от риска низкой выручки на старте непроверенной идеи. Вариант B невозможен: ПСН — режим только для ИП, ООО его использовать не может. Вариант C избыточно сложен и дорог для проекта «быстро и с минимальными вложениями», а «Доходы−Расходы» невыгодны при почти нулевых расходах. Так как друзья доверяют друг другу и готовы к любым договорённостям между собой, они могут оформить ИП на одного из них и разделить прибыль неформальным соглашением — это не идеальная юридическая чистота, но соответствует их приоритету на скорость и минимальные издержки. Вариант A (Товарищество на вере) избыточно сложен для этой ситуации.'},
{id:'q61e',topic:'opf-tax-choice',type:'single',source:'real',
 data:'ООО «Дельта»: в прошлом году продало товар M на 1 450 000 руб. и товар N на 1 750 000 руб., а также оказало услуги консультирования 34 компаниям со средним чеком 98 000 руб. С начала года в компании работало 4 сотрудника с зарплатами 36, 41, 56 и 66 тыс. руб./мес. Аренда офиса — 82 000 руб./мес. Во 2-м полугодии наняли 2 специалистов по 76 тыс. руб./мес и арендовали соседнее помещение за 26 тыс. руб./мес. Страховые взносы — 30% от ФОТ. Дополнительные расходы — 110 000 руб./год.',
 text:'Какой режим налогообложения будет выгоднее для ООО «Дельта»?',
 options:['УСН «Доходы» по ставке 6%','ПСН в размере 120 тыс. руб.','УСН «Доходы минус расходы» по ставке 15%','ОСНО (22% НДС с товаров и услуг + 25% налог на прибыль)'],
 correct:2, explanation:'Выручка = 1 450 000+1 750 000+34×98 000(=3 332 000) = 6 532 000 руб. ФОТ = (36+41+56+66)×12(=2 388 000) + (76×2)×6(=912 000) = 3 300 000 руб. Взносы = 30%×3 300 000=990 000. Аренда = 82 000×12+26 000×6=984 000+156 000=1 140 000. Итого расходы = 3 300 000+990 000+1 140 000+110 000=5 540 000 руб (≈85% выручки — намного выше порога 60%). При такой высокой доле расходов «Доходы−Расходы» (15% от 992 000≈148 800 налога) в разы выгоднее «Доходов» (6% от 6 532 000=391 920 налога). ПСН для ООО физически недоступна (только для ИП), поэтому вариант B отпадает независимо от суммы.'},
{id:'q62',topic:'opf-tax-choice',type:'single',source:'practice',
 text:'Стартап привлекает раунд от венчурного фонда, который требует долю в капитале и вход в состав собственников. Какая ОПФ обязательна в этом случае?',
 options:['ООО (или АО) — форма с долями/акциями','ИП','Самозанятость','ПСН'],
 correct:0, explanation:'Венчурное финансирование почти всегда подразумевает получение фондом доли в капитале — а такую долю можно оформить только в ООО или АО, но не у ИП или самозанятого.'},
{id:'q62b',topic:'opf-tax-choice',type:'single',source:'real',
 data:'Компания сравнивает УСН «Доходы» (6%) и УСН «Доходы минус расходы» (15%). Выручка = 8 000 тыс. руб., расходы = 5 000 тыс. руб.',
 text:'Какой вариант выгоднее?',
 options:['УСН «Доходы минус расходы»: налог = 750 тыс. руб.','УСН «Доходы»: налог = 450 тыс. руб.','УСН «Доходы»: налог = 480 тыс. руб.','Невозможно определить','УСН «Доходы минус расходы»: налог = 450 тыс. руб.','Оба варианта одинаковы'],
 correct:4, explanation:'УСН «Доходы» (6%): налог = 8 000×6% = 480 тыс. руб. УСН «Доходы минус расходы» (15%): налог = (8 000−5 000)×15% = 3 000×15% = 450 тыс. руб. Расходы здесь составляют 5 000/8 000=62,5% от выручки — чуть выше порога ≈60%, поэтому «Доходы минус расходы» оказывается выгоднее (450<480), хоть и с небольшим отрывом. Правильный ответ должен одновременно называть верный режим И верную сумму налога — вариант E подходит по обоим критериям.'},
{id:'q63',topic:'opf-tax-choice',type:'single',source:'practice',
 text:'Производственная компания с крупными закупками сырья у плательщиков НДС и продажами в основном другим ООО на ОСНО рассматривает переход на УСН. Какой здесь главный риск?',
 options:['Контрагенты на ОСНО могут потерять право на вычет входящего НДС по сделкам с компанией на УСН, что снизит её привлекательность как поставщика','УСН запрещена для производственных компаний','На УСН нельзя нанимать сотрудников','УСН автоматически увеличивает налог на прибыль'],
 correct:0, explanation:'Компании на УСН не выставляют НДС, поэтому покупатели-плательщики ОСНО не могут принять НДС к вычету по таким сделкам — это часто делает переход на УСН невыгодным при работе преимущественно с крупными контрагентами на общей системе.'},
{id:'q64',topic:'opf-tax-choice',type:'single',source:'practice',
 text:'Розничный магазин планирует выручку около 50 млн руб./год. С конца 2025 года на что стоит обратить внимание при выборе УСН?',
 options:['При превышении лимита дохода по УСН возникает обязанность платить НДС','УСН при такой выручке вообще запрещена законом','ФНС автоматически переведёт компанию на ПСН','НДС на УСН больше никогда не появляется, независимо от выручки'],
 correct:0, explanation:'С конца 2025 года плательщики УСН, чей доход превышает установленный лимит, обязаны платить НДС — это важный фактор при планировании налогов для растущего бизнеса.'},

/* ================= value-chain ================= */
{id:'q65',topic:'value-chain',type:'multi',source:'real',
 text:'Компания инвестирует в наём сотрудников, обучение персонала и развитие корпоративной культуры. К какому типу деятельности это относится в цепочке ценности Портера? (отметьте 2 пункта: общую категорию и конкретный вид)',
 options:['Инфраструктура фирмы','Маркетинг и продажи','Институциональный вид деятельности','Входящие поставки','Основной вид деятельности','Технологические разработки','Операции (производство)','Исходящие поставки','Нематериальный вид деятельности','Вспомогательный вид деятельности','Послепродажное обслуживание','Материально-техническое снабжение','Управление трудовыми ресурсами'],
 correct:[9,12], explanation:'Наём, обучение и корпоративная культура — это классическое «Управление трудовыми ресурсами» (M) — конкретный вид деятельности, который относится к категории ВСПОМОГАТЕЛЬНЫХ видов деятельности (J) цепочки ценности, наряду с инфраструктурой фирмы (A), технологическими разработками (F) и материально-техническим снабжением (L). «Институциональный вид деятельности» и «нематериальный вид деятельности» (C, I) — несуществующие термины-дистракторы, их в модели Портера нет.'},
{id:'q65b',topic:'value-chain',type:'multi',source:'real',
 data:'Крафтовая пивоварня хочет улучшить свою цепочку создания стоимости, чтобы поддерживать как высокое качество, так и масштабируемость операций.',
 text:'Какие меры, скорее всего, укрепят конкурентоспособность пивоварни в соответствии с цепочкой создания ценности (по Портеру)? (несколько ответов)',
 options:['Переход на неполный рабочий день специалиста по контролю качества','Приоритет на сарафанное радио вместо структурированного маркетинга','Партнёрство с местными поставщиками хмеля и ячменя премиум-класса для единообразных вкусовых профилей','Переход на синтетические вкусовые добавки для снижения разнообразия сырья','Внедрение передовой системы розлива, минимизирующей контакт с кислородом и поломки','Реализация всех продаж через одного регионального дистрибьютора'],
 correct:[2,4], explanation:'Партнёрство с надёжными поставщиками сырья премиум-класса (входящие поставки) и передовая система розлива (операции) — это прямые улучшения звеньев цепочки создания ценности, которые повышают стабильность качества и масштабируемость. Остальные меры, наоборот, ОСЛАБЛЯЮТ цепочку: сокращение контроля качества, отказ от структурированного маркетинга, синтетические добавки (снижают премиальность продукта) и продажа через единственного дистрибьютора (рост зависимости и рыночной власти покупателя над пивоварней).'},
{id:'q66',topic:'value-chain',type:'single',source:'practice',
 text:'Склад готовой продукции и доставка товара до дистрибьютора относятся к какому звену цепочки ценности?',
 options:['Исходящие поставки (Outbound Logistics)','Входящие поставки (Inbound Logistics)','Управление трудовыми ресурсами','Технологические разработки'],
 correct:0, explanation:'Хранение и доставка готовой продукции ОТ производителя К покупателю/дистрибьютору — это исходящая логистика (в отличие от входящих поставок сырья).'},
{id:'q67',topic:'value-chain',type:'single',source:'practice',
 text:'НИОКР и разработка нового программного обеспечения относятся к какому виду деятельности в цепочке ценности?',
 options:['Технологические разработки (вспомогательный вид)','Операции (основной вид)','Маркетинг и продажи (основной вид)','Материально-техническое снабжение'],

/* ================= vc-fc ================= */
{id:'q71',topic:'vc-fc',type:'multi',source:'real',
 text:'Что из перечисленного относится к ПОСТОЯННЫМ издержкам (FC)? (несколько ответов)',
 options:['Заработная плата сотрудников управляющего звена','Арендные платежи за офис','Налог на недвижимость','Оплата услуг логистической компании (расчёт «за заказ»)','Оплата материалов и сырья','Налог на прибыль','Оплата интернета в офисе','Заработная плата сотрудников со сдельной оплатой труда'],
 correct:[0,1,2,6], explanation:'FC не зависят от объёма производства: оклад руководства (A), аренда (B), налог на имущество (C), оплата интернета в офисе (G) — все эти суммы одинаковы вне зависимости от того, сколько единиц продукции произвели. Оплата логистики «за заказ» (D), материалы (E), налог на прибыль (F, зависит от объёма продаж) и сдельная зарплата (H) — переменные, так как масштабируются с объёмом деятельности.'},
{id:'q72',topic:'vc-fc',type:'multi',source:'real',
 text:'Что из перечисленного относится к ПЕРЕМЕННЫМ издержкам (VC)? (несколько ответов)',
 options:['Заработная плата сотрудников со сдельной оплатой труда','Оплата интернета в офисе','Запасы готовой продукции','Оплата материалов и сырья','Оплата услуг логистической компании (за заказ)','Заработная плата сотрудников управляющего звена','Налог на недвижимость','Арендные платежи за офис'],
 correct:[0,2,3,4], explanation:'Сдельная зарплата (A), стоимость сырья (D), запасы готовой продукции (C, зависят от объёма выпуска) и логистика «за заказ» (E) меняются вместе с объёмом производства/продаж — это переменные затраты. Оплата интернета (B), оклад руководства (F), налог на имущество (G) и аренда офиса (H) не зависят от объёма — это постоянные затраты.'},
{id:'q72b',topic:'vc-fc',type:'multi',source:'real',
 text:'Какие из перечисленных издержек можно отнести к ПЕРЕМЕННЫМ? (несколько ответов, расширенный список)',
 options:['Содержание складских помещений','Заработная плата сотрудников административного блока','Оплата услуг логистической компании (позаказно)','Выплата процента от прибыли топ-менеджерам компании','Оплата материалов и сырья','Заработная плата сотрудников со сдельной оплатой труда','Заработная плата сотрудников управляющего звена','Налог на недвижимость','Запасы готовой продукции','Арендные платежи за офис','Налог на добавленную стоимость','Подарки детям сотрудников'],
 correct:[2,4,5,8,10], explanation:'К переменным относятся расходы, которые масштабируются вместе с объёмом продаж/производства: логистика «позаказно» (C), сырьё и материалы (E), сдельная зарплата (F), запасы готовой продукции (I) и НДС (K, начисляется на каждую продажу пропорционально её сумме). Содержание склада (A), зарплата админблока (B), оклад руководства (G), налог на имущество (H), аренда офиса (J) и подарки детям сотрудников (L) не зависят от объёма — это постоянные (или вовсе не относящиеся к производству) издержки. Процент от прибыли топ-менеджерам (D) — пограничный случай: формально зависит от результата, а не от объёма напрямую, поэтому в строгом смысле это не классическая переменная себестоимость.'},
{id:'q72c',topic:'vc-fc',type:'multi',source:'real',
 data:'Производственная компания выпускает мебель.',
 text:'Какие расходы являются переменными? (несколько ответов)',
 options:['Зарплата рабочих на сдельной оплате','Аренда производственного цеха','Электроэнергия для станков (по счётчику)','Упаковочные материалы','Зарплата директора','Закупка древесины и фурнитуры'],
 correct:[0,2,3,5], explanation:'Переменные затраты меняются вместе с объёмом производства мебели: сдельная зарплата рабочих (A), электроэнергия для станков по счётчику — чем больше произведено, тем больше киловатт (C), упаковочные материалы на каждое изделие (D) и закупка древесины/фурнитуры на каждую единицу продукции (F). Аренда цеха (B) и зарплата директора (E) — постоянные затраты, не зависящие от того, сколько мебели произведено в конкретном месяце.'},
{id:'q72d',topic:'vc-fc',type:'multi',source:'real',
 text:'Постоянные издержки (Fixed Costs) — это (несколько ответов):',
 options:['Комиссия агентам от продаж','Амортизация оборудования','Расходы, не зависящие от объёма производства','Закупка сырья','Аренда помещений','Зарплата управленческого персонала'],
 correct:[1,2,4,5], explanation:'Вариант C — это, по сути, само определение постоянных издержек, и амортизация (B, начисляется линейно вне зависимости от объёма выпуска), аренда (E) и зарплата управленцев (F) — классические конкретные примеры FC. Комиссия агентам (A, растёт вместе с объёмом продаж) и закупка сырья (D, растёт вместе с объёмом производства) — переменные издержки, а не постоянные.'},
{id:'q72e',topic:'vc-fc',type:'multi',source:'real',
 text:'Переменные издержки (Variable Costs) — это (несколько ответов):',
 options:['Закупка сырья и материалов','Аренда склада','Упаковка продукции','Амортизация','Комиссия продавцам от объёма продаж','Расходы, изменяющиеся пропорционально объёму производства'],
 correct:[0,2,4,5], explanation:'Вариант F — это определение переменных издержек, а закупка сырья (A), упаковка продукции (C) и комиссия продавцам от объёма продаж (E) — конкретные примеры, растущие вместе с объёмом. Аренда склада (B) и амортизация (D) — постоянные издержки, не зависящие от объёма производства в моменте.'},
{id:'q73',topic:'vc-fc',type:'single',source:'practice',
 text:'Компания перешла с окладов производственных рабочих на сдельную оплату. Как это меняет классификацию затрат на их труд?',
 options:['Затраты становятся переменными, так как теперь напрямую зависят от объёма выработки','Затраты остаются постоянными','Затраты становятся инвестиционными','Классификация не связана со способом оплаты труда'],
 correct:0, explanation:'Сдельная оплата напрямую привязана к объёму выработки — значит, эти затраты становятся переменными, в отличие от фиксированного оклада (постоянные затраты).'},
{id:'q74',topic:'vc-fc',type:'single',source:'practice',
 text:'Почему амортизацию оборудования обычно относят к постоянным, а не переменным затратам?',
 options:['Она начисляется равномерно по времени независимо от того, сколько единиц продукции произведено в конкретном периоде','Она напрямую зависит от объёма выпуска каждый месяц','Амортизация — это не затраты вовсе','Амортизация относится только к инвестиционному потоку'],
 correct:0, explanation:'При линейном методе амортизация — фиксированная сумма за период вне зависимости от объёма производства, поэтому она классифицируется как постоянные затраты.'},
{id:'q75',topic:'vc-fc',type:'single',source:'practice',

 correct:0, explanation:'Затраты на сырьё напрямую пропорциональны объёму производства — это классические переменные затраты, в отличие от аренды, окладов руководства и налога на имущество.'},

/* ================= breakeven ================= */
{id:'q76',topic:'breakeven',type:'numeric',source:'real',
 data:'Постоянные издержки — 420 000 руб. Переменные издержки — 560 000 руб. Выручка от продажи — 1 300 000 руб. Стоимость единицы продукции — 76 000 руб.',
 text:'Рассчитайте точку безубыточности в единицах продукции (округлите до целого).',
 answer:10, tolerance:0.6, unit:'ед.',
 explanation:'Продано единиц = Выручка / Цена = 1 300 000 / 76 000 ≈ 17,1 ед. VC на единицу = Общие VC / Кол-во проданных = 560 000 / 17,1 ≈ 32 748 руб. Маржинальный доход на ед. = 76 000 − 32 748 ≈ 43 252 руб. Точка безубыточности Q* = FC / Маржинальный доход = 420 000 / 43 252 ≈ 9,7 ≈ 10 единиц.'},
{id:'q77',topic:'breakeven',type:'numeric',source:'real',
 data:'Дима создал сервис доставки цветов. Средняя стоимость букета — 4 000 руб., переменные затраты на букет (цветы, доставка, упаковка) — 1 950 руб. Постоянные затраты: аренда склада + зарплата + маркетинг ≈ 180 000 руб./мес, аренда авто с водителем — 120 000 руб./мес. Цель — прибыль 800 000 руб./мес.',
 text:'Сколько букетов нужно доставить в месяц, чтобы получить прибыль 800 000 руб.?',
 answer:537, tolerance:2, unit:'букетов',
 explanation:'Маржинальный доход на букет = 4 000 − 1 950 = 2 050 руб. Постоянные затраты всего = 180 000 + 120 000 = 300 000 руб./мес. Нужный маржинальный доход = FC + целевая прибыль = 300 000 + 800 000 = 1 100 000 руб. Количество букетов = 1 100 000 / 2 050 ≈ 536,6 ≈ 537 букетов.'},
{id:'q78',topic:'breakeven',type:'numeric',source:'real',
 data:'Кофейня «Morning Brew»: средняя покупка (кофе + круассан) — 350 руб., переменные затраты на набор — 120 руб. Постоянные расходы — 350 000 руб./мес. Планируется продавать 1 800 наборов в месяц.',
 text:'Какой запас прочности у кофейни, выраженный в наборах (кофе+круассан)?',
 answer:278, tolerance:3, unit:'наборов',
 explanation:'Маржинальный доход на набор = 350 − 120 = 230 руб. Точка безубыточности Q* = FC / Маржинальный доход = 350 000 / 230 ≈ 1 521,7 ≈ 1 522 набора в месяц. Запас прочности в единицах = Плановый объём − Q* = 1 800 − 1 522 ≈ 278 наборов — именно столько компания может недопродать, прежде чем уйдёт в убыток. (В процентах от плана это ≈15,4%, но в этой задаче ответ традиционно даётся именно в штуках.)'},
{id:'q78b',topic:'breakeven',type:'numeric',source:'real',
 data:'Постоянные издержки — 400 000 руб. Переменные издержки — 550 000 руб. Выручка от продажи продукции — 1 300 000 руб. Чистая прибыль от продажи продукции — 430 000 руб. Фонд оплаты труда — 260 000 руб. Стоимость единицы продукции — 65 000 руб.',
 text:'Рассчитайте точку безубыточности в единицах продукции (округлите до целого).',
 answer:11, tolerance:0.6, unit:'ед.',
 explanation:'Продано единиц = Выручка / Цена = 1 300 000 / 65 000 = 20 ед. VC на единицу = Общие VC / Кол-во проданных = 550 000 / 20 = 27 500 руб. Маржинальный доход на ед. = 65 000 − 27 500 = 37 500 руб. Точка безубыточности Q* = FC / Маржинальный доход = 400 000 / 37 500 ≈ 10,67 ≈ 11 единиц. Чистая прибыль и ФОТ в этой задаче — данные для отвлечения внимания, для расчёта именно точки безубыточности они не нужны.'},
{id:'q79',topic:'breakeven',type:'single',source:'practice',
 text:'После роста аренды офиса точка безубыточности компании (в единицах) выросла. Что произошло с постоянными затратами?',
 options:['Постоянные затраты выросли','Постоянные затраты снизились','Переменные затраты выросли, а постоянные не изменились','Это никак не связано с точкой безубыточности'],
 correct:0, explanation:'Точка безубыточности прямо пропорциональна постоянным затратам (Q*=FC/маржа) — рост аренды (часть FC) увеличивает нужный объём продаж для выхода в ноль.'},
{id:'q80',topic:'breakeven',type:'single',source:'practice',
 text:'Компания продаёт на 30% больше единиц, чем требуется для точки безубыточности. Что это означает?',
 options:['Запас финансовой прочности компании составляет около 23% ((30/130)×100%)','Компания работает в убыток','Запас прочности равен 30%','Компания находится точно в точке безубыточности'],
 correct:0, explanation:'Если факт = 130% от БЕП, то запас прочности = (Факт−БЕП)/Факт = (130−100)/130 ≈ 23%, а не 30% (30% — это превышение БЕП, а не запас прочности от фактического объёма).'},
{id:'q80b',topic:'breakeven',type:'numeric',source:'practice',
 data:'Развлекательный центр с сеансами: цена одного сеанса — 1 200 руб., переменные расходы на сеанс — 300 руб. Постоянные расходы — 500 000 руб./мес.',
 text:'Рассчитайте точку безубыточности в сеансах в месяц (округлите вверх до целого).',
 answer:556, tolerance:1, unit:'сеансов',
 explanation:'Маржинальный доход на сеанс = 1 200 − 300 = 900 руб. Точка безубыточности = FC / Маржинальный доход = 500 000 / 900 ≈ 555,56 → округляем ВВЕРХ до 556 сеансов (555 сеансов ещё не покрывают постоянные расходы полностью).'},
{id:'q80c',topic:'breakeven',type:'numeric',source:'practice',
 data:'Тот же развлекательный центр: цена сеанса 1 200 руб., переменные расходы 300 руб., FC = 500 000 руб./мес. Собственник хочет получать чистую прибыль 150 000 руб./мес.',
 text:'Сколько сеансов в месяц нужно провести, чтобы выйти на целевую прибыль 150 000 руб.?',
 answer:723, tolerance:1, unit:'сеансов',
 explanation:'Нужный маржинальный доход = FC + целевая прибыль = 500 000 + 150 000 = 650 000 руб. Количество сеансов = 650 000 / 900 ≈ 722,2 → округляем вверх до 723 сеансов.'},

/* ================= fv-pv ================= */
{id:'q81',topic:'fv-pv',type:'numeric',source:'practice',
 data:'Вложено 100 000 руб. под 12% годовых на 3 года (по сложному проценту).',
 text:'Найдите будущую стоимость (FV) вложения через 3 года (округлите до целого рубля).',
 answer:140493, tolerance:200, unit:'₽',
 explanation:'FV = PV×(1+r)ⁿ = 100 000×(1,12)³ = 100 000×1,404928 ≈ 140 493 руб.'},
{id:'q82',topic:'fv-pv',type:'numeric',source:'practice',
 data:'Через 2 года компания планирует получить 1 210 000 руб. Ставка дисконтирования — 10% годовых.',
 text:'Найдите приведённую (текущую) стоимость PV этой суммы (округлите до целого рубля).',
 answer:1000000, tolerance:2000, unit:'₽',
 explanation:'PV = FV/(1+r)ⁿ = 1 210 000/(1,10)² = 1 210 000/1,21 = 1 000 000 руб.'},
{id:'q83',topic:'fv-pv',type:'single',source:'practice',
 text:'Почему 100 000 руб. сегодня стоят больше, чем 100 000 руб. через 3 года?',
 options:['Из-за временной стоимости денег — деньги сегодня можно инвестировать и получить доход к будущему моменту','Потому что бумажные деньги физически изнашиваются','Потому что налоги всегда растут','Это не так, суммы равны в любой момент времени'],
 correct:0, explanation:'Концепция временной стоимости денег: доступные сейчас деньги можно инвестировать под процент, поэтому они «стоят» больше эквивалентной суммы в будущем.'},
{id:'q84',topic:'fv-pv',type:'single',source:'practice',
 text:'При какой операции используют формулу PV = FV / (1+r)ⁿ?',
 options:['Дисконтирование будущего денежного потока к текущему моменту','Начисление процентов на вклад в будущем','Расчёт точки безубыточности','Расчёт запаса прочности'],
 correct:0, explanation:'PV = FV/(1+r)ⁿ — стандартная формула дисконтирования, приводящая будущую сумму к её сегодняшнему эквиваленту.'},
{id:'q84b',topic:'fv-pv',type:'numeric',source:'practice',
 data:'Инвестор хочет получить через 4 года ровно 2 000 000 руб. Ставка дисконтирования (ожидаемая доходность) — 20% годовых.',
 text:'Сколько нужно вложить сегодня (PV), чтобы через 4 года получить 2 000 000 руб.? Округлите до целого рубля.',
 answer:964506, tolerance:3000, unit:'₽',
 explanation:'PV = FV/(1+r)ⁿ = 2 000 000/(1,20)⁴ = 2 000 000/2,0736 ≈ 964 506 руб.'},
{id:'q84c',topic:'fv-pv',type:'single',source:'practice',
 text:'Проект А обещает выплату 1 млн руб. через 1 год, проект Б — 1 млн руб. через 5 лет. Ставка дисконтирования одинаковая и положительная. Что верно?',
 options:['PV проекта А выше, чем PV проекта Б, при одинаковой номинальной сумме','PV проекта Б выше, так как дольше ждать','PV обоих проектов равны, так как номинальная сумма одна и та же','Сравнивать PV в этом случае некорректно'],
 correct:0, explanation:'Чем дальше в будущем денежный поток, тем сильнее он дисконтируется — значит, при одинаковой номинальной сумме более ранняя выплата (проект А) имеет более высокую приведённую стоимость сегодня.'},
{id:'q84d',topic:'fv-pv',type:'numeric',source:'practice',
 data:'Вложено 500 000 руб. под 14,5% годовых на 1 год БЕЗ капитализации (простой процент).',
 text:'Найдите будущую стоимость (FV) через 1 год.',
 answer:572500, tolerance:500, unit:'₽',
 explanation:'При простом проценте за 1 год: FV = PV×(1+r) = 500 000×(1+0,145) = 500 000×1,145 = 572 500 руб.'},
{id:'q84e',topic:'fv-pv',type:'numeric',source:'practice',
 data:'Те же 500 000 руб. под те же 14,5% годовых на 1 год, но теперь С ЕЖЕМЕСЯЧНОЙ капитализацией процентов.',
 text:'Найдите будущую стоимость (FV) через 1 год (округлите до целого рубля).',
 answer:577518, tolerance:1500, unit:'₽',
 explanation:'При ежемесячной капитализации: FV = PV×(1+r/12)¹² = 500 000×(1+0,145/12)¹² = 500 000×(1,012083)¹² ≈ 500 000×1,15503 ≈ 577 518 руб. Обратите внимание: это на ≈5 018 руб. больше, чем при простом проценте (572 500 руб. в предыдущей задаче) — при одной и той же номинальной ставке ежемесячная капитализация всегда даёт больший итоговый доход, потому что проценты начинают сами приносить проценты внутри года.'},
{id:'q84f',topic:'fv-pv',type:'single',source:'real',
 data:'Денежный поток в году 3 = 5 000 тыс. руб. Ставка дисконтирования = 10%.',
 text:'Найдите приведённую стоимость (PV) этого потока.',
 options:['3 757 тыс. руб.','4 132 тыс. руб.','5 000 тыс. руб.','4 545 тыс. руб.','3 415 тыс. руб.','5 500 тыс. руб.'],
 correct:0, explanation:'PV = FV/(1+r)ⁿ = 5 000/(1,10)³ = 5 000/1,331 ≈ 3 756,6 ≈ 3 757 тыс. руб. Обратите внимание: степень n=3, потому что поток относится именно к 3-му году — частая ошибка здесь взять n=1 или забыть возвести в куб.'},

{id:'q85',topic:'investment-types',type:'single',source:'real',
 data:'Компания А (6 месяцев на рынке) не производит товары сама, а закупает их в соседних странах. Из-за геополитических событий стоимость логистики выросла на 65%. Компания создаёт резервный фонд для покрытия кассовых разрывов, иначе грозит банкротство.',
 text:'К какому типу инвестиционных вложений относятся расходы на удорожание международной логистики?',
 options:['Не является инвестицией — это операционные затраты, вызванные внешним риском, а не вложение в актив','Реальные инвестиции','Институциональные инвестиции','Технологические инвестиции'],
 correct:0, explanation:'Инвестиции — это вложения, создающие будущую ценность (актив, доходность). Рост стоимости логистики из-за геополитики — это увеличение ТЕКУЩИХ операционных затрат (реакция на риск), а не инвестиционное вложение в актив, поэтому корректный ответ — «не является инвестицией».'},
{id:'q86',topic:'investment-types',type:'single',source:'practice',
 text:'Компания покупает производственную линию для расширения выпуска. К какому виду инвестиций это относится?',
 options:['Реальные инвестиции','Финансовые инвестиции','Портфельные инвестиции','Это не инвестиция, а операционный расход'],
 correct:0, explanation:'Вложение в физическое средство производства (оборудование) — классический пример реальных инвестиций.'},
{id:'q87',topic:'investment-types',type:'single',source:'practice',
 text:'Компания покупает 5% акций другой компании без цели получить контроль, а только ради дохода. Это какой вид инвестиций?',

{id:'q88',topic:'investment-types',type:'single',source:'practice',
 text:'Компания вкладывает деньги в регистрацию патента на собственную разработку. Какой это вид инвестиций?',
 options:['Интеллектуальные инвестиции','Реальные инвестиции','Финансовые инвестиции','Не является инвестицией'],
 correct:0, explanation:'Патенты, товарные знаки и другая интеллектуальная собственность — предмет интеллектуальных инвестиций.'},
{id:'q89',topic:'investment-types',type:'single',source:'practice',
 text:'Чем реальные инвестиции принципиально отличаются от финансовых?',
 options:['Реальные — это вложения в физические/производственные активы, финансовые — в ценные бумаги и финансовые инструменты','Финансовые инвестиции всегда крупнее реальных','Реальные инвестиции никогда не амортизируются','Разницы нет, это синонимы'],
 correct:0, explanation:'Реальные инвестиции создают/расширяют производственные мощности (оборудование, недвижимость), финансовые — вложения в акции, облигации, доли других компаний.'},
{id:'q89b',topic:'investment-types',type:'multi',source:'real',
 text:'Выберите из списка вложения, которые относятся к ИНТЕЛЛЕКТУАЛЬНЫМ инвестициям (несколько ответов)',
 options:['Вложения в нематериальные активы','Покупка акций, облигаций и других ценных бумаг','Покупка патента на изобретение','Покупка оборудования и техники','Оплата сырья и материалов','Покупка долей участия в других компаниях','Вложения в основные средства','Разработка собственного программного обеспечения','Разработка бренда компании','Оплата арендных платежей'],
 correct:[0,2,7,8], explanation:'Интеллектуальные инвестиции — это вложения в нематериальные активы: сами нематериальные активы как категория (A), патент на изобретение (C), разработка собственного ПО (H) и разработка бренда (I). Покупка ценных бумаг (B) и долей (F) — финансовые инвестиции; оборудование (D) и основные средства (G) — реальные инвестиции; оплата сырья (E) и аренды (J) — текущие операционные расходы, а не инвестиции вовсе.'},
{id:'q89c',topic:'investment-types',type:'single',source:'practice',
 text:'Компания вкладывает 2 млн руб. в обучение команды разработчиков новой технологии производства, патент на которую компания планирует оформить позже. Это пример какого вида инвестиций?',
 options:['Интеллектуальных','Реальных','Финансовых','Это не инвестиция, а операционный расход, так как речь об обучении, а не о покупке актива'],
 correct:0, explanation:'Инвестиции в развитие компетенций команды, ведущие к созданию нового нематериального актива (будущий патент, ноу-хау), классифицируются как интеллектуальные инвестиции — даже до формальной регистрации патента.'},
