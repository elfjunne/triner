<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>БП-Тренажёр — Бизнес-планирование</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1220;
  --surface:#171D33;
  --surface-2:#212a49;
  --surface-3:#2a3660;
  --border:#2B3358;
  --text:#EEF0F8;
  --text-dim:#9BA3C7;
  --text-faint:#6b7397;
  --gold:#D9A441;
  --gold-dim:#8a7239;
  --teal:#4FD1AE;
  --coral:#E5677A;
  --serif:'Fraunces',Georgia,serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
  --radius:14px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
body{min-height:100vh;overscroll-behavior-y:none;}
button{font-family:inherit;}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0 0 .5em;letter-spacing:-.01em;}
p{line-height:1.55;margin:0 0 .8em;color:var(--text);}
.mono{font-family:var(--mono);}
a{color:var(--gold);}
::selection{background:var(--gold);color:#1a1300;}

#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

/* ---------- Header ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,var(--bg) 70%, transparent);
  padding:18px 18px 10px;
  display:flex;align-items:center;justify-content:space-between;
}
.brand{display:flex;flex-direction:column;gap:2px;}
.brand .mark{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--text);}
.brand .sub{font-size:11.5px;color:var(--text-faint);letter-spacing:.03em;}
.streak-pill{
  display:flex;align-items:center;gap:6px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--text-dim);
}
.streak-pill b{color:var(--gold);font-family:var(--mono);}

/* ---------- Main content area ---------- */
main{flex:1;padding:4px 18px 100px;}

.screen-title{font-size:24px;margin-bottom:4px;}
.screen-lede{color:var(--text-dim);font-size:13.5px;margin-bottom:18px;}

/* ---------- Cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;margin-bottom:12px;
}
.card-tap{cursor:pointer;transition:border-color .15s, transform .1s;}
.card-tap:active{transform:scale(.985);}
.card-tap:hover{border-color:var(--surface-3);}

/* ---------- Lecture progress list ---------- */
.lec-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--border);}
.lec-row:last-child{border-bottom:none;}
.lec-num{
  width:34px;height:34px;border-radius:10px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);
  font-size:15px;color:var(--gold);flex-shrink:0;
}
.lec-info{flex:1;min-width:0;}
.lec-title{font-size:14.5px;font-weight:600;margin-bottom:5px;}
.lec-bar-track{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;}
.lec-bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:3px;}
.lec-pct{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);flex-shrink:0;width:34px;text-align:right;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:11px;border:1px solid var(--border);background:var(--surface-2);
  color:var(--text);font-size:14px;font-weight:600;padding:13px 16px;
  cursor:pointer;width:100%;transition:filter .15s, transform .1s;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--gold);border-color:var(--gold);color:#1c1400;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ghost{background:transparent;}
.btn-sm{padding:8px 12px;font-size:12.5px;width:auto;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}

/* ---------- Bottom nav ---------- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:rgba(14,18,32,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  padding:8px 10px calc(8px + var(--safe-bottom));
}
.tabbar-inner{max-width:560px;margin:0 auto;display:flex;justify-content:space-around;}
.tab-btn{
  background:none;border:none;color:var(--text-faint);display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10.5px;padding:5px 14px;border-radius:10px;
}
.tab-btn.active{color:var(--gold);}
.tab-btn svg{width:21px;height:21px;}

/* ---------- Chips / filters ---------- */
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
  border-radius:999px;padding:7px 13px;font-size:12.5px;white-space:nowrap;cursor:pointer;
}
.chip.active{background:var(--gold);border-color:var(--gold);color:#1c1400;font-weight:600;}

/* ---------- Mode grid (Тесты landing) ---------- */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mode-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:15px;cursor:pointer;transition:border-color .15s,transform .1s;
}
.mode-card:active{transform:scale(.98);}
.mode-card .ic{font-size:20px;margin-bottom:8px;}
.mode-card .ti{font-size:14px;font-weight:700;margin-bottom:4px;}
.mode-card .de{font-size:11.5px;color:var(--text-faint);line-height:1.4;}
.mode-card.wide{grid-column:1/-1;display:flex;align-items:center;gap:12px;}
.mode-card.wide .ic{margin-bottom:0;font-size:24px;}
.badge{
  display:inline-block;background:var(--coral);color:#2b0a0f;font-size:10.5px;font-weight:700;
  border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle;
}
.badge-teal{background:var(--teal);color:#08251d;}
.badge-gold{background:var(--gold);color:#1c1400;}

/* ---------- Question screen ---------- */
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--text-faint);margin-bottom:10px;font-family:var(--mono);}
.qprogress-track{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-bottom:18px;}
.qprogress-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .25s;}
.qtext{font-size:17px;line-height:1.5;margin-bottom:16px;font-weight:500;}
.qdata{background:var(--surface-2);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:13.5px;color:var(--text-dim);font-family:var(--mono);white-space:pre-line;line-height:1.6;}
.opt{
  display:flex;align-items:flex-start;gap:11px;background:var(--surface);border:1.5px solid var(--border);
  border-radius:12px;padding:13px 14px;margin-bottom:9px;cursor:pointer;font-size:14.5px;line-height:1.4;
  transition:border-color .12s, background .12s;
}
.opt:active{transform:scale(.99);}
.opt .mk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--text-faint);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;}
.opt.radio .mk{border-radius:999px;}
.opt.selected{border-color:var(--gold);background:rgba(217,164,65,.08);}
.opt.selected .mk{border-color:var(--gold);background:var(--gold);color:#1c1400;}
.opt.correct{border-color:var(--teal);background:rgba(79,209,174,.1);}
.opt.correct .mk{border-color:var(--teal);background:var(--teal);color:#08251d;}
.opt.incorrect{border-color:var(--coral);background:rgba(229,103,122,.1);}
.opt.incorrect .mk{border-color:var(--coral);background:var(--coral);color:#2b0a0f;}
.numinput{
  width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;
  padding:14px;font-size:16px;color:var(--text);font-family:var(--mono);margin-bottom:14px;
}
.numinput:focus{outline:none;border-color:var(--gold);}
.hint-btn{
  display:flex;align-items:center;gap:6px;background:none;border:1px dashed var(--gold-dim);
  color:var(--gold);font-size:12.5px;border-radius:9px;padding:8px 12px;margin-bottom:14px;cursor:pointer;width:100%;justify-content:center;
}
.hint-btn:active{transform:scale(.98);}
.hint-box{
  background:rgba(217,164,65,.08);border:1px solid var(--gold-dim);border-radius:10px;
  padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--text-dim);line-height:1.55;
}
.hint-box b{color:var(--gold);}
.explain{
  background:var(--surface-2);border-left:3px solid var(--gold);border-radius:8px;
  padding:13px 15px;margin-top:14px;font-size:13.5px;color:var(--text-dim);line-height:1.55;
}
.explain b{color:var(--text);}
.explain .verdict{font-family:var(--serif);font-size:15px;margin-bottom:6px;}
.verdict.ok{color:var(--teal);}
.verdict.bad{color:var(--coral);}
.fav-btn{background:none;border:none;color:var(--text-faint);font-size:19px;cursor:pointer;padding:4px;}
.fav-btn.active{color:var(--gold);}

/* ---------- Flashcard ---------- */
.flashcard-wrap{perspective:1200px;margin-bottom:18px;}
.flashcard{
  min-height:220px;position:relative;border-radius:18px;cursor:pointer;
  transition:transform .5s;transform-style:preserve-3d;
}
.flashcard.flipped{transform:rotateY(180deg);}
.fc-face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
  border:1px solid var(--border);
}
.fc-front{background:var(--surface);}
.fc-front .term{font-family:var(--serif);font-size:23px;font-weight:600;}
.fc-back{background:var(--surface-2);transform:rotateY(180deg);}
.fc-back .def{font-size:14.5px;line-height:1.55;color:var(--text-dim);}
.fc-lecture-tag{position:absolute;top:14px;left:16px;font-size:10.5px;color:var(--text-faint);font-family:var(--mono);}

/* ---------- Empty / done states ---------- */
.empty-state{text-align:center;padding:50px 20px;color:var(--text-faint);}
.empty-state .ic{font-size:38px;margin-bottom:12px;}
.empty-state h3{color:var(--text-dim);font-size:16px;}

/* ---------- Result screen ---------- */
.result-ring{width:140px;height:140px;margin:10px auto 20px;position:relative;}
.result-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:32px;}
.stat-row{display:flex;gap:10px;margin-bottom:16px;}
.stat-box{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;}
.stat-box .n{font-family:var(--mono);font-size:20px;color:var(--text);}
.stat-box .l{font-size:10.5px;color:var(--text-faint);margin-top:2px;}

/* ---------- Case ---------- */
.case-tag{display:inline-block;background:var(--surface-2);color:var(--text-dim);border-radius:6px;padding:3px 9px;font-size:11px;font-family:var(--mono);margin-bottom:10px;}
.case-block{margin-bottom:16px;}
.case-block h4{font-size:13px;text-transform:none;color:var(--gold);margin-bottom:8px;font-family:var(--sans);font-weight:700;letter-spacing:.01em;}
.solution-toggle{margin-top:6px;}
.calc-line{font-family:var(--mono);font-size:13px;color:var(--text-dim);padding:3px 0;border-bottom:1px dashed var(--border);}
.calc-line:last-child{border-bottom:none;}
.calc-line b{color:var(--text);}

/* ---------- Conspect ---------- */
.conspect-body h3{font-size:18px;margin-top:22px;color:var(--text);}
.conspect-body h4{font-size:14.5px;color:var(--gold);margin-top:16px;margin-bottom:8px;font-family:var(--sans);font-weight:700;}
.conspect-body ul,.conspect-body ol{padding-left:20px;margin:0 0 12px;}
.conspect-body li{margin-bottom:6px;line-height:1.55;font-size:14.5px;}
.conspect-body table{width:100%;border-collapse:collapse;margin:12px 0;font-size:12.5px;}
.conspect-body td,.conspect-body th{border:1px solid var(--border);padding:7px 9px;text-align:left;}
.conspect-body th{background:var(--surface-2);color:var(--gold);font-weight:600;}
.formula{
  background:var(--surface-2);border-radius:10px;padding:12px 14px;margin:10px 0;
  font-family:var(--mono);font-size:13.5px;color:var(--teal);text-align:center;
}
.callout{background:rgba(217,164,65,.08);border:1px solid var(--gold-dim);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:13.5px;color:var(--text-dim);}
.callout b{color:var(--gold);}
.self-check{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:18px;}
.self-check h4{margin-top:0;}
.self-check ol{padding-left:18px;}
.self-check li{font-size:13.5px;margin-bottom:10px;color:var(--text-dim);}

/* ---------- Glossary list ---------- */
.term-row{padding:12px 4px;border-bottom:1px solid var(--border);}
.term-row:last-child{border-bottom:none;}
.term-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.term-name{font-family:var(--serif);font-size:15.5px;font-weight:600;}
.term-def{font-size:13px;color:var(--text-dim);margin-top:5px;line-height:1.5;}

/* ---------- Search ---------- */
.search-box{
  width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:11px 14px;color:var(--text);font-size:14px;margin-bottom:14px;
}
.search-box::placeholder{color:var(--text-faint);}

/* ---------- Misc ---------- */
.hidden{display:none !important;}
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);margin:22px 0 10px;font-weight:600;}
.back-btn{background:none;border:none;color:var(--text-dim);font-size:13.5px;display:flex;align-items:center;gap:5px;cursor:pointer;padding:6px 0 14px;}
.spacer-40{height:40px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   DATA — заполняется ниже (глоссарий, конспект, вопросы, кейсы)
   ========================================================= */
const TOPICS = [
  {key:'exec-summary', label:'Executive Summary', lecture:1},
  {key:'business-model', label:'Бизнес-модель (канва)', lecture:1},
  {key:'market-boundaries', label:'Границы рынка', lecture:2},
  {key:'market-volume', label:'Объём рынка (TAM/SAM/SOM)', lecture:2},
  {key:'porter5', label:'5 сил Портера', lecture:2},
  {key:'kfu', label:'Ключевые факторы успеха', lecture:2},
  {key:'segmentation', label:'Сегментация ЦА', lecture:2},
  {key:'marketing-mix', label:'Маркетинг-микс (4P)', lecture:2},
  {key:'opf', label:'ОПФ', lecture:3},
  {key:'tax-task', label:'Задача на налоги', lecture:3},
  {key:'opf-tax-choice', label:'Выбор ОПФ и системы налогообложения', lecture:3},
  {key:'value-chain', label:'Цепочка создания ценности', lecture:4},
  {key:'vc-fc', label:'VC / FC', lecture:4},
  {key:'breakeven', label:'Точка безубыточности', lecture:4},
  {key:'unit-economics', label:'Юнит-экономика', lecture:4},
  {key:'investment-types', label:'Виды инвестиций', lecture:5},
  {key:'financing-sources', label:'Источники финансирования', lecture:5},
  {key:'fv-pv', label:'FV / PV', lecture:5},
  {key:'ebit-profitability', label:'EBIT, рентабельность', lecture:5},
  {key:'cash-flows', label:'Денежные потоки', lecture:5},
  {key:'irr-npv-dpp', label:'IRR, NPV, DPP', lecture:5},
  {key:'ai', label:'ИИ в бизнес-планировании', lecture:6},
];
const TOPIC_HINTS = {
  'exec-summary': 'Summary = сжатое резюме ВСЕХ разделов (описание проекта, перспективы, краткие финпоказатели). Никаких подробных бюджетов, оргструктур или детального разбора рисков — это уровень полных разделов, а не резюме.',
  'market-boundaries': 'Тест на границы рынка: рассматривает ли ЦЕЛЕВОЙ ПОКУПАТЕЛЬ эти товары/услуги как замену друг другу для одной и той же цели? Если да — один рынок, даже если товары технически разные.',
  'market-volume': 'TAM ⊇ SAM ⊇ SOM (от самого широкого к реалистично достижимому). Bottom-up: объём = Кол-во потенциальных клиентов × Доля, попадающая в сегмент × Средний чек × Частота покупки за период.',
  'porter5': '5 сил: внутриотраслевая конкуренция, угроза новых игроков (барьеры ВХОДА), власть поставщиков, власть покупателей, угроза субститутов. Отдельно: барьеры ВЫХОДА (не входа!) — если уйти с рынка дорого, слабые игроки остаются и конкуренция обостряется.',
  'kfu': 'КФУ — общеотраслевые условия успеха («что нужно ЛЮБОЙ компании отрасли, чтобы побеждать»), а не конкурентное преимущество конкретной компании и не то же самое, что KPI (числовые метрики).',
  'ai': 'МОЖЕТ: формулы, расчёты NPV/IRR/PP, сценарии, Monte Carlo, текст-нарратив — механические/вычислительные задачи. НЕ МОЖЕТ: оценить реалистичность цифр, валидировать бизнес-логику, заменить unit-экономику, учесть специфику рынка, отфильтровать GIGO — всё, что требует суждения о реальности.',
  'business-model': '9 блоков канвы: сегменты, ценностные предложения, каналы сбыта, отношения с клиентами, потоки дохода, ключевые ресурсы, ключевые виды деятельности, ключевые партнёры, структура издержек. НЕ входят: оргструктура, финмодель, маркетинговые инструменты.',
  'segmentation': 'Демография (пол/возраст/доход) — «кто». География — «где». Психография (образ жизни, ценности, стиль решений) — «какой». Поведение (частота, повод покупки, искомая выгода) — «как использует».',
  'marketing-mix': '4P: Product (сам товар: функционал, состав, упаковка, гарантия), Price (цена и условия оплаты), Place (каналы сбыта), Promotion (реклама, стимулирование сбыта, УТП/позиционирование).',
  'opf': 'ИП — простая регистрация, но личная имущественная ответственность. ООО — сложнее регистрация, но ответственность ограничена долей в УК, и удобно брать инвесторов/партнёров. Коммерческие юрлица: ООО/АО/кооперативы/КФХ. Некоммерческие: фонды, ТСЖ, потребкооперативы, адвокатские палаты.',
  'tax-task': 'Налог с вклада = (Доход по вкладу − Необлагаемая база) × 13%. Необлагаемая база = Ключевая ставка ЦБ × 1 000 000 руб. Не забывайте: капитализация (сложный процент) даёт больше дохода, чем простой процент при той же ставке.',
  'opf-tax-choice': 'Доля расходов к выручке < ≈60% → выгоднее УСН «Доходы» (6%). Доля расходов ≥ ≈60% → выгоднее УСН «Доходы−Расходы» (15%). ООО НИКОГДА не бывает на ПСН или НПД (только для ИП/физлиц). Не забывайте про страховые взносы ≈30% от ФОТ как отдельную статью расходов.',
  'value-chain': 'Основные виды деятельности: входящие поставки → операции → исходящие поставки → маркетинг и продажи → послепродажное обслуживание. Вспомогательные: инфраструктура фирмы, управление трудовыми ресурсами (HR), технологические разработки, материально-техническое снабжение (закупки).',
  'vc-fc': 'VC (переменные) зависят от объёма: сырьё, сдельная зарплата, логистика «за заказ». FC (постоянные) не зависят от объёма: аренда, оклады руководства, налог на имущество, амортизация (линейная).',
  'breakeven': 'Q* = FC / (Цена − VC на единицу). Под целевую прибыль: Q = (FC + Целевая прибыль) / (Цена − VC на единицу). Округление всегда ВВЕРХ. Если известна только общая VC — сначала найдите VC на единицу = Общие VC / Кол-во проданных.',
  'fv-pv': 'FV = PV×(1+r)ⁿ — простой процент. С капитализацией m раз в год: FV = PV×(1+r/m)^(m×n). PV = FV/(1+r)ⁿ — дисконтирование (обратная операция).',
  'investment-types': 'Реальные — в физические активы (оборудование, недвижимость). Финансовые — в ценные бумаги, доли других компаний. Интеллектуальные — в нематериальные активы (патенты, бренд, ПО, R&D).',
  'financing-sources': 'Собственные — прибыль, резервные/целевые фонды. Заёмные — кредиты и займы (нужно возвращать с процентом). Привлечённые — взносы в капитал, эмиссия акций/облигаций (инвестор становится совладельцем, без обязательства возврата).',
  'ebit-profitability': 'EBIT = Выручка − VC − FC − Амортизация (до процентов и налога). ROS = Прибыль / Выручка. ROI = Прибыль / Инвестиции. Чистая прибыль = (EBIT − Проценты) × (1 − ставка налога).',
  'cash-flows': 'OCF (операционный) = Чистая прибыль + Амортизация − ΔNWC. ICF (инвестиционный) = −CAPEX (+ продажа активов). CFF (финансовый) = + Привлечённые кредиты/капитал − Погашение долга. Амортизация — не реальные деньги, поэтому её прибавляют обратно.',
  'irr-npv-dpp': 'NPV = Σ [Денежный поток / (1+r)ⁿ] − Инвестиции. IRR — ставка, при которой NPV=0. DPP ≥ PP всегда (дисконтирование замедляет накопление). Один PP/DPP недостаточен для решения без остальных показателей.',
  'unit-economics': 'LTV = Средний чек × Частота × Срок жизни клиента − Переменные затраты. CAC = Затраты на маркетинг и продажи / Число привлечённых клиентов. LTV/CAC: <1 нежизнеспособно, 1–3 нужна оптимизация, 3–5 хорошо, >5 отлично.',
};
const GLOSSARY = [
// ---- Лекция 1: идея, бизнес-модель ----
{id:'g1',term:'Бизнес-план',lecture:1,def:'Документ, описывающий цели, стратегию и ресурсы проекта, оценивающий его привлекательность и служащий для привлечения финансирования.'},
{id:'g2',term:'Формальное планирование',lecture:1,def:'Подход, при котором план детально прописывается заранее и служит жёстким ориентиром действий.'},
{id:'g3',term:'Гибкое (адаптивное) планирование',lecture:1,def:'Подход, при котором план рассматривается как гипотеза, регулярно пересматриваемая по мере поступления новых данных о рынке.'},
{id:'g4',term:'Бизнес-модель',lecture:1,def:'Логика того, как компания создаёт, доставляет и извлекает ценность — то, как именно проект зарабатывает деньги.'},
{id:'g5',term:'Канва бизнес-модели (Остервальдер)',lecture:1,def:'Шаблон из 9 блоков для описания бизнес-модели: потребительские сегменты, ценностные предложения, каналы сбыта, взаимоотношения с клиентами, потоки дохода, ключевые ресурсы, ключевые виды деятельности, ключевые партнёры, структура издержек.'},
{id:'g6',term:'Потребительские сегменты',lecture:1,def:'Блок канвы: группы клиентов, для которых компания создаёт ценность. Формируются по потребностям/поведению, а не по описательным признакам (пол, возраст).'},
{id:'g7',term:'Ценностное предложение',lecture:1,def:'Блок канвы: сочетание продуктов/услуг, которое решает проблему клиента или удовлетворяет его потребность лучше альтернатив.'},
{id:'g8',term:'Каналы сбыта',lecture:1,def:'Блок канвы: способы, которыми компания достигает клиента и доставляет ценностное предложение (сайт, магазины, агенты и т.д.).'},
{id:'g9',term:'Взаимоотношения с клиентами',lecture:1,def:'Блок канвы: характер связи с каждым сегментом — личная поддержка, самообслуживание, сообщества и т.п.'},
{id:'g10',term:'Потоки поступления дохода',lecture:1,def:'Блок канвы: способы монетизации — продажа, подписка, плата за использование, аренда, комиссия и др.'},
{id:'g11',term:'Ключевые ресурсы',lecture:1,def:'Блок канвы: активы (материальные, человеческие, интеллектуальные, финансовые), без которых бизнес-модель не работает.'},
{id:'g12',term:'Ключевые виды деятельности',lecture:1,def:'Блок канвы: действия, необходимые для создания и доставки ценности (производство, платформа, решение проблем и т.д.).'},
{id:'g13',term:'Ключевые партнёры',lecture:1,def:'Блок канвы: поставщики и партнёры, которые снабжают ресурсами и снижают риски проекта.'},
{id:'g14',term:'Структура издержек',lecture:1,def:'Блок канвы: все затраты, возникающие при работе бизнес-модели — постоянные и переменные.'},
{id:'g15',term:'Value Proposition Canvas',lecture:1,def:'Инструмент для детальной проработки соответствия ценностного предложения потребностям клиента; состоит из профиля клиента и карты ценности.'},
{id:'g16',term:'Профиль клиента',lecture:1,def:'Часть VP Canvas: задачи клиента (jobs), его боли (pains) и выгоды, которые он ищет (gains).'},
{id:'g17',term:'Карта ценности',lecture:1,def:'Часть VP Canvas: продукты/услуги компании, обезболиватели (pain relievers) и создатели выгод (gain creators).'},
{id:'g18',term:'Дизайн-мышление',lecture:1,def:'Итеративный метод разработки продукта: эмпатия → анализ и синтез → генерация идей → прототипирование → тестирование.'},
{id:'g19',term:'Executive Summary',lecture:1,def:'Краткое резюме всего бизнес-плана (не введение!) — сжато представляет все разделы и ключевые цифры для инвестора; объём — не более 1,5 страниц.'},
{id:'g20',term:'Прототип',lecture:1,def:'Упрощённая, но конкретная реализация продукта или его части для проверки гипотез перед полноценной разработкой.'},
// ---- Лекция 2: рынок и маркетинг ----
{id:'g21',term:'Отрасль',lecture:2,def:'Совокупность компаний, производящих схожие товары/услуги; анализ отрасли отвечает на вопрос «где мы играем» на макроуровне.'},
{id:'g22',term:'Целевой рынок',lecture:2,def:'Конкретная группа потребителей и географическая зона, на которые ориентирован проект внутри отрасли.'},
{id:'g23',term:'TAM (Total Addressable Market)',lecture:2,def:'Общий (потенциальный) объём рынка — весь спрос на продукт при 100% доле рынка, без ограничений по сегменту или возможностям компании.'},
{id:'g24',term:'SAM (Serviceable Available Market)',lecture:2,def:'Доступный объём рынка — часть TAM, которую компания технически может обслужить с учётом географии, продукта, канала.'},
{id:'g25',term:'SOM (Serviceable Obtainable Market)',lecture:2,def:'Реально достижимый объём рынка — та доля SAM, которую компания реалистично может занять в обозримом периоде (например, за 1 год).'},
{id:'g26',term:'Модель 5 сил Портера',lecture:2,def:'Инструмент анализа привлекательности отрасли через 5 сил: внутриотраслевая конкуренция, угроза новых игроков, власть поставщиков, власть покупателей, угроза субститутов.'},
{id:'g27',term:'Внутриотраслевая конкуренция',lecture:2,def:'Сила, отражающая интенсивность соперничества между уже действующими в отрасли компаниями.'},
{id:'g28',term:'Угроза появления новых игроков',lecture:2,def:'Сила, зависящая от высоты барьеров входа: эффект масштаба, потребность в капитале, доступ к каналам сбыта, лояльность к брендам, IP.'},
{id:'g29',term:'Рыночная власть поставщиков',lecture:2,def:'Способность поставщиков диктовать цену и условия компании (bargaining power поставщиков).'},
{id:'g30',term:'Рыночная власть покупателей',lecture:2,def:'Способность покупателей диктовать цену и условия компании (bargaining power покупателей).'},
{id:'g31',term:'Угроза продуктов-субститутов',lecture:2,def:'Риск того, что потребность клиента закроют товары другой категории (например, поезд вместо самолёта).'},
{id:'g32',term:'Барьеры входа',lecture:2,def:'Факторы, затрудняющие выход новых игроков на рынок: капиталоёмкость, лицензии, эффект масштаба, лояльность к бренду.'},
{id:'g33',term:'Комплементоры',lecture:2,def:'Поставщики дополнительных составляющих — компании, чей продукт увеличивает ценность вашего (например, производитель контента для платформы).'},
{id:'g34',term:'STP (Segmentation, Targeting, Positioning)',lecture:2,def:'Последовательность: сегментировать рынок → выбрать целевые сегменты → определить позиционирование продукта.'},
{id:'g35',term:'Сегментация рынка',lecture:2,def:'Разделение рынка на группы потребителей со схожими потребностями и поведением.'},
{id:'g36',term:'Демографическая сегментация',lecture:2,def:'Деление аудитории по полу, возрасту, доходу, образованию и т.п.'},
{id:'g37',term:'Психографическая сегментация',lecture:2,def:'Деление аудитории по образу жизни, ценностям, интересам и чертам характера (например, «ведёт здоровый образ жизни»).'},
{id:'g38',term:'Поведенческая сегментация',lecture:2,def:'Деление аудитории по паттернам использования продукта, лояльности, поводу покупки.'},
{id:'g39',term:'Персона',lecture:2,def:'Собирательный портрет типичного представителя целевого сегмента с именем, целями и болями — инструмент для командной эмпатии.'},
{id:'g40',term:'Маркетинг-микс (4P)',lecture:2,def:'Классическая модель комплекса маркетинга: Product (продукт), Price (цена), Place (место/дистрибуция), Promotion (продвижение).'},
{id:'g41',term:'Product (Продукт)',lecture:2,def:'Элемент 4P: сам товар/услуга — функционал, качество, дизайн, упаковка, гарантия, состав.'},
{id:'g42',term:'Price (Цена)',lecture:2,def:'Элемент 4P: стоимость и условия оплаты — цена, скидки, кредит, рассрочка.'},
{id:'g43',term:'Place (Место)',lecture:2,def:'Элемент 4P: каналы и точки, где продукт становится доступен клиенту.'},
{id:'g44',term:'Promotion (Продвижение)',lecture:2,def:'Элемент 4P: реклама, PR, стимулирование сбыта, личные продажи, бонусные программы.'},
{id:'g45',term:'Модель 4C',lecture:2,def:'Эволюция 4P с фокусом на клиента: Customer value (ценность для клиента), Cost (затраты клиента), Convenience (удобство), Communication (коммуникация).'},
{id:'g46',term:'Позиционирование',lecture:2,def:'То, как продукт воспринимается в сознании целевого сегмента относительно конкурентов.'},
// ---- Лекция 3: оргплан, ОПФ, налоги ----
{id:'g47',term:'Организационно-правовая форма (ОПФ)',lecture:3,def:'Юридическая форма ведения предпринимательской деятельности (ИП, ООО, АО и др.), определяющая права, ответственность и порядок налогообложения.'},
{id:'g48',term:'Индивидуальный предприниматель (ИП)',lecture:3,def:'Физлицо, зарегистрированное для ведения бизнеса; отвечает по обязательствам личным имуществом, простая регистрация и закрытие.'},
{id:'g49',term:'Общество с ограниченной ответственностью (ООО)',lecture:3,def:'Юрлицо с одним или несколькими участниками (до 50), отвечающее уставным капиталом; сложнее регистрация, но проще привлечение инвесторов.'},
{id:'g50',term:'Акционерное общество (АО)',lecture:3,def:'Юрлицо, капитал которого разделён на акции; бывает публичным (ПАО) и непубличным (НАО).'},
{id:'g51',term:'Производственный кооператив',lecture:3,def:'Коммерческая организация — добровольное объединение лиц для совместной производственной деятельности на основе личного трудового участия.'},
{id:'g52',term:'Самозанятый (НПД)',lecture:3,def:'Налоговый режим для физлиц без сотрудников с доходом до 2,4 млн руб/год; ставка 4% (с физлицами) или 6% (с юрлицами), без отчётности.'},
{id:'g53',term:'Общая система налогообложения (ОСНО)',lecture:3,def:'Базовый налоговый режим: НДС + налог на прибыль (юрлица) или НДФЛ (ИП) + налог на имущество; подходит крупному бизнесу и работе с НДС.'},
{id:'g54',term:'Упрощённая система налогообложения (УСН)',lecture:3,def:'Спецрежим для малого бизнеса с уплатой одного налога вместо нескольких; объект — «Доходы» (от 6%) или «Доходы минус расходы» (от 15%).'},
{id:'g55',term:'УСН «Доходы»',lecture:3,def:'Вариант УСН: налог считается от всей выручки по ставке от 6%; выгоден при низкой доле расходов (примерно менее 60% выручки).'},
{id:'g56',term:'УСН «Доходы минус расходы»',lecture:3,def:'Вариант УСН: налог считается с разницы доходов и расходов по ставке от 15%; выгоден при высокой доле подтверждённых расходов.'},
{id:'g57',term:'Патентная система налогообложения (ПСН)',lecture:3,def:'Спецрежим только для ИП по ограниченному перечню видов деятельности; стоимость патента фиксирована и не зависит от фактического дохода.'},
{id:'g58',term:'НДС',lecture:3,def:'Налог на добавленную стоимость; с конца 2025 года его обязаны платить и плательщики УСН при превышении лимита дохода.'},
{id:'g59',term:'НДФЛ',lecture:3,def:'Налог на доходы физлиц; для дивидендов ООО ставка 13%, для трудовых доходов — прогрессивная шкала.'},
{id:'g60',term:'Страховые взносы',lecture:3,def:'Обязательные платежи работодателя сверх зарплаты: пенсионное (22%), по временной нетрудоспособности (2,9%), медицинское (5,1%) — итого около 30% от ФОТ.'},
{id:'g61',term:'ФОТ (фонд оплаты труда)',lecture:3,def:'Сумма всех начисленных зарплат сотрудников за период — база для расчёта страховых взносов.'},
{id:'g62',term:'Полная стоимость сотрудника',lecture:3,def:'ФОТ сотрудника + страховые взносы (~30%) + прочие затраты на найм и удержание.'},
{id:'g63',term:'Штатное расписание',lecture:3,def:'Документ с перечнем должностей, окладов и количества штатных единиц компании (форма Т-3).'},
{id:'g64',term:'Организационная структура',lecture:3,def:'Схема распределения полномочий и обязанностей в компании: линейная, функциональная, матричная, дивизиональная и др.'},
{id:'g65',term:'Сдельная оплата труда',lecture:3,def:'Форма оплаты, зависящая от объёма выполненной работы.'},
{id:'g66',term:'Повременная оплата труда',lecture:3,def:'Форма оплаты, зависящая от отработанного времени, а не от объёма выработки.'},
// ---- Лекция 4: операционный план, ценность, юнит-экономика ----
{id:'g67',term:'Цепочка создания ценности (Портер)',lecture:4,def:'Модель, разбивающая деятельность компании на основные и вспомогательные виды деятельности, каждая из которых добавляет ценность продукту.'},
{id:'g68',term:'Основные виды деятельности',lecture:4,def:'В цепочке ценности: входящие поставки, операции (производство), исходящие поставки, маркетинг и продажи, послепродажное обслуживание.'},
{id:'g69',term:'Вспомогательные виды деятельности',lecture:4,def:'В цепочке ценности: инфраструктура фирмы, управление трудовыми ресурсами, технологические разработки, материально-техническое снабжение.'},
{id:'g70',term:'Переменные затраты (VC)',lecture:4,def:'Затраты, размер которых меняется пропорционально объёму производства/продаж (сырьё, сдельная зарплата, логистика по заказу).'},
{id:'g71',term:'Постоянные затраты (FC)',lecture:4,def:'Затраты, не зависящие напрямую от объёма производства (аренда, оклады руководства, налог на имущество).'},
{id:'g72',term:'Точка безубыточности (Break-Even Point)',lecture:4,def:'Объём продаж, при котором выручка равна суммарным затратам, а прибыль равна нулю. Q* = FC / (P − VC на ед.).'},
{id:'g73',term:'Запас финансовой прочности',lecture:4,def:'На сколько фактический объём продаж/выручки может упасть, прежде чем компания уйдёт в убыток: (Факт − БЕП)/Факт × 100%.'},
{id:'g74',term:'Теория ограничений (Theory of Constraints)',lecture:4,def:'Подход к масштабированию, при котором производительность всей системы определяется самым узким местом (bottleneck); автоматизировать в первую очередь нужно именно его.'},
{id:'g75',term:'Узкое место (bottleneck)',lecture:4,def:'Этап процесса с наименьшей пропускной способностью, ограничивающий производительность всей цепочки.'},
{id:'g76',term:'CAPEX',lecture:4,def:'Капитальные затраты — вложения в долгосрочные активы (оборудование, недвижимость), которые амортизируются, а не списываются сразу.'},
{id:'g77',term:'OPEX',lecture:4,def:'Операционные затраты — регулярные расходы на текущую деятельность (аренда, зарплата, материалы).'},
{id:'g78',term:'Амортизация',lecture:4,def:'Постепенное списание стоимости актива на затраты в течение срока полезного использования; уменьшает прибыль в P&L, но не является реальным оттоком денег в ДДС.'},

{id:'g100',term:'CAC (Customer Acquisition Cost)',lecture:5,def:'Стоимость привлечения одного клиента = затраты на маркетинг и продажи / число привлечённых клиентов.'},
{id:'g101',term:'LTV/CAC',lecture:5,def:'Ключевая метрика устойчивости бизнес-модели. <1 — нежизнеспособна, 1–3 — нужна оптимизация, 3–5 — хорошо, >5 — отлично.'},
{id:'g102',term:'CAC Payback',lecture:5,def:'Срок, за который клиент окупает затраты на своё привлечение; желательно — менее 12 месяцев.'},

{id:'g107',term:'Анализ чувствительности',lecture:5,def:'Проверка того, как меняется NPV/другой показатель при изменении одного ключевого параметра (цена, объём, ставка).'},
{id:'g108',term:'Сценарный анализ',lecture:5,def:'Расчёт результата проекта в нескольких сценариях — пессимистичном, базовом, оптимистичном.'},

  html: `<h3>1.1. Зачем вообще нужен бизнес-план</h3>
<p>Начнём с базового вопроса, который часто кажется очевидным, но на экзамене формулируется строго. <b>Бизнес-план</b> — это документ, который описывает цели проекта, стратегию их достижения, необходимые ресурсы, и оценивает экономическую привлекательность проекта. Он выполняет три разные функции одновременно, и их важно различать:</p>

<div class="callout"><b>Главная мысль курса, которую стоит запомнить дословно:</b> цель планирования — совершить ошибки на бумаге, а не с реальными деньгами. Неструктурированная идея стоит дёшево, но её реализация без плана обходится дорого: непроверенные допущения о рынке, клиенте и деньгах вскрываются уже после того, как ресурсы потрачены.</div>

<h4>Цена неструктурированных идей</h4>
<p>Идея сама по себе не имеет ценности до тех пор, пока не проверена. Типичный путь провала выглядит так: предприниматель видит проблему → сразу придумывает решение → вкладывает деньги в разработку → выходит на рынок → обнаруживает, что либо проблемы не существует в том масштабе, в каком казалось, либо клиент не готов платить, либо решение уже есть и дешевле. Каждый из этих трёх провалов можно было обнаружить на этапе планирования, потратив несоизмеримо меньше ресурсов.</p>

<h3>1.2. Две философии планирования: формальное и гибкое</h3>
<p>Это один из первых теоретических тезисов курса, и его любят спрашивать в формате «какой подход уместнее для такого-то проекта».</p>
<table>
  <tr><th>Критерий</th><th>Формальное планирование</th><th>Гибкое (адаптивное) планирование</th></tr>

  <tr><td>Горизонт</td><td>Длинный, детально расписанный</td><td>Короткие итерации, детализация только на ближайший шаг</td></tr>
  <tr><td>Когда уместно</td><td>Предсказуемые, капиталоёмкие проекты: строительство завода, инфраструктура, франшиза известной сети</td><td>Инновационные проекты и стартапы, где рынок и продукт ещё не проверены</td></tr>
  <tr><td>Главный риск подхода</td><td>План устаревает, но по нему продолжают идти</td><td>Отсутствие дисциплины: «мы всё время меняем курс и никуда не приходим»</td></tr>
</table>
<p>На практике почти всегда используется комбинация: стратегические рамки (кто наш клиент, в чём наша ценность, каков предельный бюджет) фиксируются формально, а тактика внутри этих рамок остаётся гибкой.</p>

<h3>1.3. От идеи к проверяемой гипотезе</h3>
<p>Любая бизнес-идея — это <b>гипотеза</b>, а не факт. Формулировать её нужно так, чтобы её можно было опровергнуть. Плохая формулировка: «людям нужен удобный сервис доставки продуктов». Хорошая: «работающие родители детей до 7 лет в городах-миллионниках готовы платить 400 руб. за доставку продуктов в течение часа минимум 4 раза в месяц».</p>
<p>Разница в том, что вторую формулировку можно проверить: найти этих людей, спросить, посчитать. Три вопроса, на которые нужно ответить до подробного планирования:</p>
<ul>
  <li><b>Существует ли проблема?</b> Насколько она болезненна и как часто возникает.</li>
  <li><b>Готов ли клиент платить за решение?</b> Готовность платить проверяется не вопросом «купили бы вы?», а поведением: как он решает эту проблему сейчас и сколько тратит.</li>
  <li><b>Чем клиент закрывает эту потребность сегодня?</b> Если ответ «ничем» — это тревожный знак: возможно, проблема недостаточно болезненна.</li>
</ul>

<h3>1.4. Бизнес-модель: что это и чем отличается от бизнес-плана</h3>
<p>Эти два понятия часто путают, и на экзамене это может стать вопросом.</p>
<table>
  <tr><th></th><th>Бизнес-модель</th><th>Бизнес-план</th></tr>
  <tr><td>Что описывает</td><td>Логику: как компания создаёт, доставляет и извлекает ценность</td><td>Конкретный план реализации с цифрами, сроками и ресурсами</td></tr>
  <tr><td>Формат</td><td>Схема, канва на одну страницу</td><td>Документ на десятки страниц с расчётами</td></tr>
  <tr><td>Горизонт</td><td>Вневременная логика зарабатывания денег</td><td>Конкретный период: 3 года, 5 лет</td></tr>
</table>
<p>Иначе говоря: бизнес-модель отвечает на вопрос <b>«как мы вообще зарабатываем?»</b>, бизнес-план — на вопрос <b>«что конкретно и когда мы для этого сделаем и сколько это стоит?»</b>. Бизнес-модель — это фундамент, на котором строится бизнес-план.</p>

<h3>1.5. Канва бизнес-модели Остервальдера: все 9 блоков подробно</h3>
<p>Ключевой инструмент занятия. Канва (Business Model Canvas) А. Остервальдера и И. Пинье состоит ровно из <b>9 блоков</b>. Разберём каждый: какой вопрос он задаёт, какие бывают варианты, и какие ошибки на нём чаще всего делают.</p>

<h4>Блок 1. Потребительские сегменты (Customer Segments)</h4>
<p><b>Вопрос:</b> для кого мы создаём ценность? Кто наш самый важный клиент?</p>
<p>Типы сегментов, которые выделяет модель:</p>
<ul>
  <li><b>Массовый рынок</b> — не различаем сегменты (пример: производитель бытовой электроники широкого потребления).</li>
  <li><b>Нишевый рынок</b> — узкий специализированный сегмент (поставщик деталей для одного автоконцерна).</li>
  <li><b>Дробное сегментирование</b> — сегменты со схожими, но чуть различающимися потребностями (банк для клиентов с разным уровнем капитала).</li>
  <li><b>Многопрофильное предприятие</b> — два совершенно разных сегмента (компания продаёт и облачные услуги бизнесу, и книги розничным покупателям).</li>
  <li><b>Многосторонние платформы</b> — сегменты, которые нужны друг другу, и без одного из них модель не работает (маркетплейс: продавцы и покупатели; такси-агрегатор: водители и пассажиры).</li>
</ul>
<div class="callout"><b>Частая ошибка:</b> описывать сегмент демографией («женщины 25–35 лет»). Это слишком грубо: люди одного возраста и дохода имеют совершенно разные потребности. Правильный подход — объединять людей по <b>общей потребности и поведению</b>: «те, кто регулярно не успевает готовить и заказывает еду на работу».</div>

<h4>Блок 2. Ценностные предложения (Value Propositions)</h4>
<p><b>Вопрос:</b> какую проблему клиента мы решаем? Почему клиент выберет нас, а не альтернативу?</p>
<p>Источники ценности бывают количественные и качественные:</p>
<table>
  <tr><th>Тип ценности</th><th>Пример</th></tr>
  <tr><td>Новизна</td><td>Продукт закрывает потребность, которой раньше не существовало (первые мобильные телефоны)</td></tr>
  <tr><td>Производительность</td><td>Делает то же, что конкуренты, но быстрее/мощнее</td></tr>
  <tr><td>Изготовление на заказ</td><td>Адаптация под конкретного клиента</td></tr>
  <tr><td>«Делать свою работу»</td><td>Клиент передаёт задачу целиком (аутсорсинг бухгалтерии)</td></tr>
  <tr><td>Дизайн, бренд, статус</td><td>Ценность в восприятии, а не в функции</td></tr>
  <tr><td>Цена</td><td>То же самое дешевле (лоукостеры)</td></tr>
  <tr><td>Снижение расходов / рисков</td><td>Помогаем клиенту тратить или рисковать меньше (страхование, гарантия)</td></tr>
  <tr><td>Доступность</td><td>Делаем доступным то, что раньше было недоступно этому сегменту</td></tr>
  <tr><td>Удобство / применимость</td><td>Упрощаем то, что было сложным (онлайн-запись вместо звонка)</td></tr>
</table>
<div class="callout"><b>Экзаменационная логика (кейс Яндекс.Еда):</b> если компания работает как маркетплейс и <b>не имеет права собственности на товар</b>, то «производство еды» и «продажа еды» НЕ являются её ценностным предложением — это делают рестораны-партнёры. Ценность самой платформы — в доставке, выборе, удобстве, а для партнёров — в продвижении внутри платформы. Всегда смотрите, что делает именно ОПИСЫВАЕМАЯ компания, а не вся цепочка целиком.</div>

<h4>Блок 3. Каналы сбыта (Channels)</h4>
<p><b>Вопрос:</b> через какие каналы клиент хочет получать нашу ценность и как мы её доставляем?</p>
<p>Канал проходит <b>пять фаз</b>, и на экзамене могут спросить именно про них:</p>
<ol>
  <li><b>Информационная</b> — как клиент узнаёт о продукте.</li>
  <li><b>Оценочная</b> — как клиент оценивает наше ценностное предложение.</li>
  <li><b>Продажа</b> — как клиент может купить.</li>
  <li><b>Доставка</b> — как ценность физически доходит до клиента.</li>
  <li><b>Послепродажная</b> — как мы обслуживаем клиента после покупки.</li>
</ol>
<p>Каналы бывают <b>собственные</b> (свой сайт, свои магазины, свой отдел продаж) и <b>партнёрские</b> (маркетплейсы, дистрибьюторы, розничные сети). Собственные дают больше маржи и контроля, партнёрские — быстрее охват, но ниже маржа и выше зависимость.</p>

<h4>Блок 4. Взаимоотношения с клиентами (Customer Relationships)</h4>
<p><b>Вопрос:</b> каких отношений ждёт каждый сегмент и какие мы установили?</p>
<ul>
  <li><b>Персональная поддержка</b> — живой человек помогает клиенту.</li>
  <li><b>Особая персональная поддержка</b> — за клиентом закреплён конкретный менеджер (private banking).</li>
  <li><b>Самообслуживание</b> — компания даёт инструменты, клиент справляется сам.</li>
  <li><b>Автоматизированное обслуживание</b> — самообслуживание плюс персонализация (рекомендации в онлайн-магазине).</li>
  <li><b>Сообщества</b> — компания поддерживает площадку, где клиенты помогают друг другу.</li>
  <li><b>Совместное создание</b> — клиенты создают контент/ценность (отзывы, пользовательские видео).</li>
</ul>
<p>Отдельно этот блок решает три задачи: <b>привлечение</b> клиентов, их <b>удержание</b> и <b>увеличение продаж</b> существующим клиентам.</p>

<h4>Блок 5. Потоки поступления дохода (Revenue Streams)</h4>
<p><b>Вопрос:</b> за что клиент действительно готов платить? Как он платит сейчас и как предпочёл бы?</p>
<p>Различают доход <b>разовый</b> (от единичной сделки) и <b>регулярный</b> (от повторяющихся платежей). Основные способы монетизации:</p>
<table>
  <tr><th>Способ</th><th>Суть</th><th>Пример</th></tr>
  <tr><td>Продажа актива</td><td>Передача права собственности на товар</td><td>Розничный магазин</td></tr>
  <tr><td>Плата за использование</td><td>Чем больше пользуешься, тем больше платишь</td><td>Мобильная связь, каршеринг</td></tr>
  <tr><td>Оплата подписки</td><td>Фиксированная плата за период доступа</td><td>Онлайн-кинотеатр, фитнес-абонемент</td></tr>
  <tr><td>Аренда / лизинг</td><td>Временное право пользования за плату</td><td>Аренда оборудования</td></tr>
  <tr><td>Лицензия</td><td>Плата за право использования IP</td><td>Софт, франшиза</td></tr>
  <tr><td>Брокерские / комиссионные</td><td>Процент за посредничество</td><td>Маркетплейс, риелтор</td></tr>
  <tr><td>Реклама</td><td>Плата за внимание аудитории</td><td>Медиа, бесплатные приложения</td></tr>
</table>
<p>Механизмы ценообразования делятся на <b>фиксированные</b> (прайс-лист, зависимость от характеристик продукта или сегмента, от объёма) и <b>динамические</b> (переговоры, управление доходностью, аукцион, рыночная цена в реальном времени).</p>

<h4>Блок 6. Ключевые ресурсы (Key Resources)</h4>
<p><b>Вопрос:</b> какие активы необходимы, чтобы бизнес-модель вообще работала?</p>
<ul>
  <li><b>Материальные</b> — здания, оборудование, транспорт, точки продаж.</li>
  <li><b>Интеллектуальные</b> — бренд, патенты, авторские права, базы данных, партнёрские соглашения.</li>
  <li><b>Людские</b> — команда, ключевые специалисты (критично в наукоёмких и креативных отраслях).</li>
  <li><b>Финансовые</b> — денежные средства, кредитные линии, опционный фонд для найма звёзд.</li>
</ul>

<h4>Блок 7. Ключевые виды деятельности (Key Activities)</h4>
<p><b>Вопрос:</b> что мы обязаны делать хорошо, чтобы модель работала?</p>
<ul>
  <li><b>Производство</b> — разработка, изготовление, поставка продукта (производственные компании).</li>
  <li><b>Решение проблем</b> — поиск индивидуальных решений для клиента (консалтинг, клиники).</li>
  <li><b>Платформа / сеть</b> — поддержание и развитие платформы (маркетплейсы, соцсети, платёжные системы).</li>
</ul>

<h4>Блок 8. Ключевые партнёры (Key Partners)</h4>
<p><b>Вопрос:</b> кто помогает нам и что именно даёт?</p>
<p>Четыре типа партнёрств: стратегическое сотрудничество между неконкурентами; competition (стратегическое партнёрство между конкурентами); совместные предприятия для запуска новых проектов; отношения «производитель — поставщик» для гарантии надёжности поставок.</p>
<p>Три мотива создавать партнёрство: <b>оптимизация и экономия</b> (аутсорсинг того, что партнёр делает дешевле), <b>снижение риска и неопределённости</b>, <b>поставка ресурсов и совместная деятельность</b> (получить доступ к тому, чего у нас нет).</p>

<h4>Блок 9. Структура издержек (Cost Structure)</h4>
<p><b>Вопрос:</b> какие расходы порождает наша модель и что самое дорогое?</p>
<p>Модели по структуре издержек делятся на два типа:</p>
<ul>
  <li><b>Ориентированные на издержки</b> — фокус на минимизации затрат, максимальная автоматизация, дешёвое ценностное предложение (лоукостеры).</li>
  <li><b>Ориентированные на ценность</b> — фокус на качестве и премиальности, издержки вторичны (люксовые отели).</li>
</ul>
<p>Характеристики структуры издержек, которые нужно уметь назвать: постоянные издержки, переменные издержки, экономия на масштабе (издержки на единицу падают с ростом объёма) и экономия на охвате (издержки падают за счёт совмещения нескольких направлений — например, один канал сбыта на несколько продуктов).</p>

<div class="callout"><b>Ловушка, которая встречается на экзамене почти всегда:</b> в канве НЕТ блоков «Организационная структура», «Финансовая модель» и «Маркетинговые инструменты». Это отдельные разделы бизнес-плана, но НЕ блоки канвы. Если вопрос звучит «каких элементов нет в канве» — ищите именно эти три.</div>

<h3>1.6. Value Proposition Canvas: доводим ценность до соответствия</h3>
<p>Основная канва даёт общий каркас, но связка «клиент — ценность» в ней описана крупными мазками. Для детальной проработки используется отдельный инструмент — <b>Value Proposition Canvas</b>, состоящий из двух половин.</p>
<h4>Правая половина: профиль клиента</h4>
<ul>
  <li><b>Задачи клиента (jobs)</b> — что клиент пытается сделать. Бывают функциональные (доехать до работы), социальные (выглядеть успешным) и эмоциональные (чувствовать себя в безопасности).</li>
  <li><b>Боли (pains)</b> — что мешает, раздражает, чего клиент боится: потеря времени, риск ошибки, лишние расходы.</li>
  <li><b>Выгоды (gains)</b> — какие результаты клиент считает выигрышем: экономия, статус, простота, предсказуемость.</li>
</ul>
<h4>Левая половина: карта ценности</h4>
<ul>
  <li><b>Продукты и услуги</b> — что мы предлагаем.</li>
  <li><b>Обезболиватели (pain relievers)</b> — как именно мы снимаем конкретные боли клиента.</li>
  <li><b>Создатели выгод (gain creators)</b> — как мы обеспечиваем ожидаемые выгоды.</li>
</ul>
<p><b>Соответствие (fit)</b> достигается, когда обезболиватели закрывают реальные, а не выдуманные боли, а создатели выгод соответствуют тому, что клиент действительно считает выигрышем. Типичная ошибка — «подгонять клиента под продукт»: сначала придумали функции, потом ищем, кому бы их продать.</p>

<h3>1.7. Дизайн-мышление: как проверять идею итерациями</h3>
<p>Метод разработки продукта, который курс рекомендует для проектов с новым продуктом. Пять стадий:</p>
<ol>
  <li><b>Эмпатия</b> — глубокое погружение в опыт пользователя. Рекомендация курса — минимум 8 интервью с представителями целевого сегмента. Задача — не проверить свою идею, а понять, как человек живёт с проблемой.</li>
  <li><b>Анализ и синтез</b> — выделение закономерностей из собранного материала, формулировка точной проблемы (problem statement).</li>
  <li><b>Генерация идей</b> — максимально широкий поиск вариантов решения без ранней критики.</li>
  <li><b>Прототипирование</b> — быстрая, дешёвая, упрощённая реализация решения, достаточная для проверки гипотезы.</li>
  <li><b>Тестирование</b> — проверка прототипа на реальных пользователях, сбор обратной связи и возврат к предыдущим стадиям.</li>
</ol>
<p>Цикл итеративен: после тестирования почти всегда возвращаются назад — уточнять проблему или менять решение. Для курсового проекта рекомендуется провести минимум одну полную итерацию.</p>

<h3>1.8. Executive Summary: как писать резюме бизнес-плана</h3>
<p>Это раздел, который читают первым, а пишут последним. Разберём подробно, потому что по нему регулярно бывают вопросы.</p>
<h4>Что это такое</h4>
<p>Executive Summary — <b>не введение</b>, а сжатое резюме всего бизнес-плана. Оно кратко представляет каждый раздел документа и содержит сводку ключевых цифр. Его задача — за несколько минут дать инвестору полное представление о проекте и мотивировать читать план дальше.</p>
<h4>Что обязательно включать</h4>
<ul>
  <li>Краткое описание компании, проекта и продукта — что мы делаем и для кого.</li>
  <li>Суть ценностного предложения и рынка — какую проблему решаем, каков объём рынка.</li>
  <li>Перспективы развития проекта — куда движемся дальше.</li>
  <li>Сводные финансовые показатели и показатели эффективности: объём продаж, валовая прибыль, требуемые инвестиции, ROI, NPV, IRR, срок окупаемости.</li>
</ul>
<h4>Что НЕ включать</h4>
<p>Всё, что относится к уровню детализации полных разделов: подробное описание каналов маркетинга с бюджетом, развёрнутый фонд оплаты труда и расчёт страховых взносов, организационная структура с подразделениями, подробное описание бизнес-процессов, тщательный разбор рисков. Для всего этого есть соответствующие разделы плана.</p>
<h4>Формальные требования</h4>
<p>Объём — <b>не более 1,5 страниц</b>. Пишется в последнюю очередь, когда все разделы готовы, поскольку резюмирует их содержание. Располагается в начале документа.</p>
<div class="callout"><b>Как проверить качество своего Summary:</b> если человек, прочитавший только его, не может ответить на вопросы «что за бизнес», «кто клиент», «сколько нужно денег» и «что инвестор получит» — резюме написано плохо. Если инвестор прочитал Summary и не захотел читать план дальше — это тоже провал Summary, а не плана.</div>

<h3>1.9. Структура бизнес-плана целиком</h3>
<p>Полезно с самого начала держать в голове карту документа, чтобы понимать, куда встраивается каждая тема курса:</p>
<table>
  <tr><th>Раздел</th><th>Что содержит</th><th>Занятие курса</th></tr>
  <tr><td>Титульный лист и оглавление</td><td>Формальные реквизиты проекта</td><td>—</td></tr>
  <tr><td>Executive Summary</td><td>Резюме всего плана и ключевые цифры</td><td>1</td></tr>
  <tr><td>Описание проекта и бизнес-модель</td><td>Идея, канва, ценностное предложение</td><td>1</td></tr>
  <tr><td>Анализ рынка</td><td>Отрасль, границы, объём, конкуренты, 5 сил, КФУ</td><td>2</td></tr>
  <tr><td>Маркетинговый план</td><td>Сегментация, позиционирование, 4P</td><td>2</td></tr>
  <tr><td>Организационный план</td><td>ОПФ, налоги, персонал, оргструктура</td><td>3</td></tr>
  <tr><td>Операционный план</td><td>Цепочка ценности, процессы, затраты, безубыточность</td><td>4</td></tr>
  <tr><td>План инвестиций</td><td>CAPEX, источники финансирования</td><td>4–5</td></tr>
  <tr><td>Финансовый план</td><td>P&amp;L, ДДС, баланс, денежные потоки</td><td>5</td></tr>
  <tr><td>Оценка эффективности</td><td>NPV, IRR, PP/DPP, рентабельность, чувствительность</td><td>5</td></tr>
  <tr><td>Риски</td><td>Идентификация и меры реагирования</td><td>5</td></tr>
</table>

<h3>1.10. Типовые бизнес-модели: узнать свою</h3>
<p>Полезно уметь опознать, к какому известному типу относится ваша модель — это сразу подсказывает, на что смотреть в экономике.</p>
<table>
  <tr><th>Модель</th><th>Как зарабатывает</th><th>Ключевая метрика</th><th>Главный риск</th></tr>
  <tr><td><b>Классическая продажа</b></td><td>Купил или произвёл дешевле, продал дороже</td><td>Маржа, оборачиваемость</td><td>Падение маржи из-за конкуренции</td></tr>
  <tr><td><b>Подписка</b></td><td>Регулярный платёж за доступ</td><td>Отток (churn), LTV</td><td>Клиенты уходят быстрее, чем окупается привлечение</td></tr>
  <tr><td><b>Маркетплейс / платформа</b></td><td>Комиссия с транзакций между сторонами</td><td>GMV, take rate, баланс сторон</td><td>Проблема курицы и яйца: без продавцов нет покупателей и наоборот</td></tr>
  <tr><td><b>Freemium</b></td><td>Базовая версия бесплатна, деньги с платных функций</td><td>Конверсия из free в paid</td><td>Бесплатные пользователи стоят денег, а платят единицы</td></tr>
  <tr><td><b>Рекламная</b></td><td>Аудитория бесплатно, платит рекламодатель</td><td>Охват, стоимость показа</td><td>Нужен огромный масштаб, чтобы реклама окупала контент</td></tr>
  <tr><td><b>Аренда / лизинг</b></td><td>Плата за временное пользование активом</td><td>Загрузка актива, срок окупаемости</td><td>Простой актива убивает экономику</td></tr>
  <tr><td><b>Бритва и лезвия</b></td><td>Основной продукт дёшево, расходники дорого</td><td>Частота покупки расходников</td><td>Появление совместимых расходников от конкурентов</td></tr>
  <tr><td><b>Франшиза</b></td><td>Продажа права работать под брендом плюс роялти</td><td>Число точек, выживаемость точек</td><td>Репутационный риск от действий франчайзи</td></tr>
</table>
<p>Важно: одна компания может совмещать несколько моделей. Яндекс.Еда — это платформа (комиссия с ресторанов) плюс рекламная модель (продвижение внутри платформы) плюс подписка (программы лояльности). В канве это отразится несколькими потоками дохода.</p>

<h3>1.11. Проверка гипотез и MVP</h3>
<p>Прежде чем строить полноценную финансовую модель, ключевые гипотезы стоит проверить дёшево.</p>
<table>
  <tr><th>Гипотеза</th><th>Дешёвый способ проверки</th><th>Что считаем успехом</th></tr>
  <tr><td>Проблема существует</td><td>Глубинные интервью (минимум 8)</td><td>Люди сами рассказывают о проблеме без наводящих вопросов</td></tr>
  <tr><td>Решение подходит</td><td>Прототип, макет, демонстрация</td><td>Человек понимает ценность за 30 секунд без объяснений</td></tr>
  <tr><td>Готовы платить</td><td>Предзаказ, лендинг с кнопкой оплаты, краудфандинг</td><td>Реальные деньги или оставленные контакты, а не слова «интересно»</td></tr>
  <tr><td>Канал работает</td><td>Тестовая рекламная кампания с небольшим бюджетом</td><td>Стоимость привлечения ниже расчётного CAC</td></tr>
  <tr><td>Экономика сходится</td><td>Пилотные продажи небольшой партии</td><td>Маржинальный доход положителен на реальных, а не плановых затратах</td></tr>
</table>
<div class="callout"><b>Правило «слова дешевле дел».</b> Ответ «да, я бы купил» стоит почти ничего. Ответ, подтверждённый предоплатой, оставленной картой или подписанным письмом о намерениях, стоит многого. При проверке готовности платить всегда ищите способ, где человек чем-то рискует — временем, деньгами или репутацией.</div>
<p><b>MVP (минимально жизнеспособный продукт)</b> — версия продукта с минимальным набором функций, достаточным для проверки ключевой гипотезы у реальных пользователей. Ключевое слово — «жизнеспособный»: MVP должен решать проблему клиента, пусть и неидеально, а не быть просто недоделанным продуктом.</p>

<h3>2.4. Модель пяти сил Портера — подробно</h3>
<p>Инструмент оценки <b>привлекательности отрасли</b>: насколько в ней в принципе можно зарабатывать. Логика модели: прибыль отрасли «съедается» пятью силами, и чем они сильнее, тем меньше остаётся её участникам.</p>

<h4>Сила 1. Внутриотраслевая конкуренция</h4>

<h4>Сила 2. Угроза появления новых игроков</h4>

<p>Способность поставщиков диктовать цену и условия. Власть поставщиков высока, если: поставщиков мало, а покупателей много; продукт поставщика уникален или переключение дорого; поставщик может пойти в нашу отрасль сам (прямая интеграция); наша отрасль — не главный клиент поставщика.</p>

<h4>Сила 4. Рыночная власть покупателей</h4>
<p>Способность покупателей давить на цену. Власть покупателей высока, если: покупателей мало, а объёмы закупок крупные; продукт стандартизирован (легко уйти к конкуренту); покупатель хорошо информирован о ценах; покупатель может начать производить сам.</p>

<h4>Сила 5. Угроза продуктов-субститутов</h4>
<p>Риск, что потребность клиента закроют товары ДРУГОЙ категории. Субститут — не прямой конкурент, а альтернативный способ решения задачи: для такси это каршеринг и подписка на авто; для авиаперелёта — скоростной поезд; для кинотеатра — домашний стриминг. Угроза выше, если у субститута лучше соотношение цена/качество и низкие издержки переключения.</p>

<h4>Как оформлять анализ</h4>
<p>Каждая сила оценивается по шкале <b>от 1 (компания не зависит от силы) до 6 (компания практически полностью зависима)</b>. Результат сводится в таблицу с обоснованием каждой оценки. Важно не просто поставить баллы, а объяснить, почему.</p>
<h4>Комплементоры — шестая «сила» за рамками модели</h4>
<p>Комплементоры — поставщики дополняющих товаров и услуг, которые увеличивают ценность вашего продукта: разработчики приложений для смартфона, производители игр для консоли, страховые компании для автодилера. Формально они не входят в классические 5 сил, но их влияние на привлекательность отрасли может быть решающим.</p>

<h3>2.5. Ключевые факторы успеха (КФУ)</h3>
<p><b>КФУ</b> — ограниченный набор условий, без выполнения которых компания не может рассчитывать на успех в отрасли. Это ответ на вопрос «что вообще нужно, чтобы побеждать в этой игре».</p>
<table>
  <tr><th>Свойство КФУ</th><th>Верно?</th><th>Пояснение</th></tr>
  <tr><td>Могут меняться со временем</td><td>Да</td><td>То, что было критично 10 лет назад, сегодня может не иметь значения</td></tr>
  <tr><td>Определяют успех или провал фирмы на рынке</td><td>Да</td><td>Это, по сути, определение КФУ</td></tr>
  <tr><td>Индивидуальны для каждой компании</td><td>Нет</td><td>КФУ общие для отрасли; индивидуально то, КАК компания их обеспечивает</td></tr>
  <tr><td>Это числовые показатели результативности</td><td>Нет</td><td>Это описание KPI, а не КФУ — их часто путают</td></tr>
  <tr><td>Это копирование стратегий конкурентов</td><td>Нет</td><td>Копирование не является фактором успеха</td></tr>
  <tr><td>Любые нововведения</td><td>Нет</td><td>Не всякое нововведение критично для успеха</td></tr>
</table>
<p><b>Отличие от конкурентного преимущества:</b> КФУ — общеотраслевые условия («в фарме нужна патентная защита»), конкурентное преимущество — то, как именно ВАША компания обеспечивает их лучше других («у нас портфель из 12 патентов и сильнейшая R&amp;D-команда»).</p>
<p>Оформляется КФУ обычно таблицей: список факторов, оценка компании по каждому и оценка основных конкурентов — чтобы видно было, где мы сильнее и где отстаём.</p>

<h3>2.6. Сегментация, таргетинг, позиционирование (STP)</h3>
<div class="formula">Segmentation → Targeting → Positioning</div>
<p><b>Сегментация</b> — разделение рынка на группы потребителей со схожими потребностями. <b>Таргетинг</b> — выбор сегментов, на которых мы сосредоточимся. <b>Позиционирование</b> — то, каким продукт должен восприниматься в сознании выбранных сегментов относительно конкурентов.</p>

<h4>Четыре принципа сегментации — точные определения</h4>
<table>
  <tr><th>Принцип</th><th>Определение</th><th>Примеры признаков</th></tr>
  <tr><td><b>Демографический</b></td><td>Деление рынка на группы потребителей на основе личных характеристик потребителей: возраста, пола, дохода, образования, семейного положения и этапа жизненного цикла</td><td>«Девушка 25–35 лет», «доход 500 тыс./мес», «высшее образование», «замужем, беременна»</td></tr>
  <tr><td><b>Географический</b></td><td>Деление рынка на группы потребителей по территориальному признаку (страна, регион, город, климат, плотность населения)</td><td>«Проживает в Балашихе», «юг Подмосковья», «города-миллионники»</td></tr>
  <tr><td><b>Психографический</b></td><td>Деление рынка на группы потребителей на основе их ментальных характеристик и предпочтений: образа жизни, ценностей, личностных качеств, интересов и убеждений</td><td>«Ведёт ЗОЖ», «подходит к решениям системно и логично», «ключевой параметр — качество», «любит отдыхать у моря», «вегетарианка», «занимается йогой»</td></tr>
  <tr><td><b>Поведенческий</b></td><td>Деление потребителей на группы на основе их действий, реакции на продукт, привычек покупки и использования</td><td>«Покупает только по акциям», «искомая выгода — экономия», «покупает шаурму три раза в неделю», «открывает приложение ежедневно, но не покупает»</td></tr>
</table>
<div class="callout"><b>Две ловушки на психографике.</b> Первая: «выбирает продукцию по цене (искомая выгода — экономия)» выглядит как ценность, но это <b>поведенческий</b> признак — сегментация по искомой выгоде. Вторая: «получила высшее образование» и «имеет доход X» — это демография, хотя интуитивно кажется, что это про образ жизни.</div>

<h4>Дополнительно для B2B</h4>
<p>В B2B к перечисленным добавляются: отрасль клиента, размер компании, объём закупок, модель принятия решения (кто ЛПР), критерии покупки. Для SaaS-компании, которая обслуживает и бизнес, и частных лиц, самый чёткий разделитель B2B/B2C — именно критерий покупки: корпоративные пакетные лицензии против индивидуальных подписок.</p>

<h4>Персона</h4>
<p>Собирательный портрет типичного представителя сегмента с именем, возрастом, работой, целями, болями и типичным днём. Нужна не для отчётности, а для командной эмпатии: гораздо легче принимать продуктовые решения, думая о конкретной «Анне, 32 года, руководитель отдела, двое детей, ест за рабочим столом», чем об абстрактном «сегменте 25–35».</p>

<h3>2.7. Маркетинг-микс: 4P и его развитие</h3>
<table>
  <tr><th>P</th><th>Что описывает</th><th>Конкретные элементы</th></tr>
  <tr><td><b>Product</b> (продукт)</td><td>Сам товар или услуга</td><td>Наименование продукции, описание функционала, состав, упаковка, гарантийный срок, качество, ассортиментная линейка, сервис</td></tr>
  <tr><td><b>Price</b> (цена)</td><td>Стоимость и условия оплаты</td><td>Цена, скидки, наценка, условия оплаты, рассрочка, кредит, ценовая стратегия</td></tr>
  <tr><td><b>Place</b> (место)</td><td>Каналы и точки доступа</td><td>Список магазинов, дистрибьюторы, онлайн-каналы, география покрытия, логистика</td></tr>
  <tr><td><b>Promotion</b> (продвижение)</td><td>Коммуникация с рынком</td><td>Реклама (ATL/BTL), PR, стимулирование сбыта, бонусные программы, личные продажи, УТП и позиционирование</td></tr>
</table>
<div class="callout"><b>Разбор экзаменационного списка по «Продукту».</b> Относятся: наименование продукции, описание функционала, указание гарантийного срока, упаковка товара, описание состава. НЕ относятся: указание УТП (это Promotion), список магазинов (Place), условия оплаты и возможность покупки в кредит (Price), продвижение через ATL-каналы и бонусная программа (Promotion).</div>

<h4>Расчёт цены через наценку</h4>
<div class="formula">Цена продажи = Себестоимость × (1 + Наценка)</div>
<p>Пример: себестоимость корзины 1 200 руб., наценка 35% на себестоимость → цена = 1 200 × 1,35 = <b>1 620 руб.</b> Важно различать <b>наценку</b> (считается ОТ СЕБЕСТОИМОСТИ) и <b>маржу</b> (считается ОТ ЦЕНЫ): при цене 1 620 и себестоимости 1 200 наценка равна 35%, а маржа = 420/1620 ≈ 26%.</p>

<h4>Эволюция модели: 4C</h4>
<table>
  <tr><th>4P (взгляд компании)</th><th>4C (взгляд клиента)</th><th>Смысл сдвига</th></tr>
  <tr><td>Product</td><td>Customer value</td><td>Важно не что мы произвели, а какую ценность клиент получил</td></tr>
  <tr><td>Price</td><td>Cost</td><td>Клиент считает не только цену, но все свои затраты: время, доставку, обучение</td></tr>
  <tr><td>Place</td><td>Convenience</td><td>Важна не наша дистрибуция, а удобство клиента</td></tr>
  <tr><td>Promotion</td><td>Communication</td><td>Не вещание на клиента, а двусторонний диалог</td></tr>
</table>
<p>Для услуг модель расширяют до <b>7P</b>, добавляя People (персонал), Process (процесс оказания услуги) и Physical evidence (физическое окружение, материальные свидетельства качества).</p>

<h4>Оптимизация компонента Place — разбор кейса</h4>
<p>Бренд здоровых закусок с национальным охватом усиливает дистрибуцию. Работают: прямая доставка через сайт бренда (снимает географию), партнёрство со специализированными магазинами здорового питания (точное попадание в сегмент), подписка на ежемесячную доставку (удобство и повторные покупки). Не работают: отказ от e-commerce «ради эксклюзивности» (режет охват), придорожные магазины у трасс (не тот профиль аудитории), опора ИСКЛЮЧИТЕЛЬНО на одну крупную сеть (рост зависимости и власти покупателя).</p>

<h3>2.8. Конкурентный анализ</h3>
<p>Пять сил Портера описывают отрасль в целом. Отдельно нужен анализ конкретных конкурентов.</p>
<h4>Три круга конкурентов</h4>
<ul>
  <li><b>Прямые</b> — предлагают тот же продукт той же аудитории (две кофейни на одной улице).</li>
  <li><b>Косвенные</b> — решают ту же задачу иначе (кофейня и вендинговый автомат с кофе).</li>
  <li><b>Субституты</b> — закрывают потребность принципиально другим способом (кофейня и энергетик из магазина).</li>
</ul>
<p>Ошибка — анализировать только прямых. Часто главная угроза приходит из второго и третьего круга.</p>
<h4>Что сравнивать</h4>
<table>
  <tr><th>Параметр</th><th>Что смотреть</th></tr>
  <tr><td>Продукт</td><td>Ассортимент, качество, уникальные характеристики</td></tr>
  <tr><td>Цена</td><td>Уровень цен, скидочная политика, средний чек</td></tr>
  <tr><td>Каналы</td><td>Где продают, насколько доступны</td></tr>
  <tr><td>Продвижение</td><td>Активность, каналы коммуникации, узнаваемость</td></tr>
  <tr><td>Масштаб</td><td>Выручка, число точек, доля рынка</td></tr>
  <tr><td>Сильные и слабые стороны</td><td>В чём объективно лучше и хуже нас</td></tr>
</table>
<p>Результат оформляется сравнительной таблицей: строки — параметры, столбцы — мы и 3–5 конкурентов. Такая таблица сразу показывает, где у нас есть реальное преимущество, а где мы просто повторяем рынок.</p>
<h4>Карта позиционирования</h4>
<p>Двумерная схема, где по осям откладываются два значимых для клиента параметра (например, цена и уровень сервиса), а конкуренты и мы размещаются точками. Она наглядно показывает свободные ниши — сочетания параметров, которые никто не занял. Важно выбирать оси, которые действительно важны клиенту, а не удобны для анализа.</p>

<h3>2.9. Анализ макросреды: PESTEL</h3>
<p>Инструмент оценки внешних факторов, на которые компания не может влиять, но должна учитывать.</p>
<table>
  <tr><th>Фактор</th><th>Что анализируем</th><th>Пример влияния</th></tr>
  <tr><td><b>P</b> — Political</td><td>Госполитика, регулирование, санкции, поддержка отраслей</td><td>Субсидии производителям меняют экономику проекта</td></tr>
  <tr><td><b>E</b> — Economic</td><td>Инфляция, ключевая ставка, курс, доходы населения</td><td>Рост ставки удорожает кредит и повышает ставку дисконтирования</td></tr>
  <tr><td><b>S</b> — Social</td><td>Демография, стиль жизни, ценности, тренды потребления</td><td>Рост интереса к ЗОЖ создаёт спрос на новый ассортимент</td></tr>
  <tr><td><b>T</b> — Technological</td><td>Новые технологии, автоматизация, цифровизация</td><td>Появление ИИ-инструментов меняет структуру затрат на персонал</td></tr>
  <tr><td><b>E</b> — Environmental</td><td>Экологические требования, климат, устойчивое развитие</td><td>Экологические нормативы делают низкоуглеродную технологию преимуществом</td></tr>
  <tr><td><b>L</b> — Legal</td><td>Законодательство, лицензии, трудовое и налоговое право</td><td>Изменение правил НДС на УСН меняет выбор налогового режима</td></tr>
</table>
<p><b>Как использовать:</b> не перечислять факторы ради объёма, а по каждому отвечать на вопрос «как конкретно это влияет на наш проект и что мы будем делать». Фактор без вывода бесполезен.</p>

<h3>2.10. Позиционирование и УТП</h3>
<div class="formula">Формула позиционирования: Для [сегмент], который [потребность], наш [продукт] — это [категория], который [ключевая выгода], в отличие от [альтернатива], потому что [обоснование]</div>
<p>Пример: «Для офисных сотрудников, которые не успевают завтракать дома, наш сервис — это доставка готовых завтраков к началу рабочего дня, который экономит 30 минут утром, в отличие от кафе поблизости, потому что заказ оформляется с вечера и ждёт на рабочем месте».</p>
<p><b>УТП (уникальное торговое предложение)</b> — короткая формулировка того, что отличает продукт. Хорошее УТП: конкретное, проверяемое, значимое для клиента и трудно копируемое. Плохое: «высокое качество и индивидуальный подход» — это говорят все, значит, это не отличает.</p>
<p>С точки зрения 4P, УТП относится к <b>Promotion</b> и позиционированию, а не к описанию самого продукта — это частая ошибка при разборе списка «что относится к Product».</p>

<h3>2.11. Прогноз продаж</h3>
<p>Прогноз продаж — мост между маркетинговым и финансовым разделами. Он должен вытекать из анализа рынка, а не быть «желаемой цифрой».</p>
<h4>Три способа построения</h4>
<table>
  <tr><th>Метод</th><th>Логика</th><th>Когда применим</th></tr>
  <tr><td><b>От рынка (сверху)</b></td><td>SOM × планируемая доля захвата</td><td>Когда есть надёжные данные по объёму рынка</td></tr>
  <tr><td><b>От мощности (снизу)</b></td><td>Пропускная способность × загрузка × средний чек</td><td>Когда ограничение — производство или площадь (кафе, салон, цех)</td></tr>
  <tr><td><b>От канала</b></td><td>Бюджет на маркетинг / CAC = число клиентов; далее × чек × частота</td><td>Когда рост упирается в маркетинговый бюджет (онлайн-бизнес)</td></tr>
</table>
<div class="callout"><b>Практический приём:</b> посчитайте прогноз минимум двумя способами. Если «от рынка» получается 10 000 клиентов, а мощность позволяет обслужить 3 000 — реалистичный прогноз равен меньшему из чисел. Расхождение в разы всегда означает, что где-то допущение оторвано от реальности.</div>
<h4>Учёт выхода на плановые показатели</h4>
<p>Новый бизнес не выходит на плановую выручку в первый же месяц. В модели закладывают период раскрутки: например, 30% плановой загрузки в первый квартал, 60% во второй, 100% с третьего. Прогноз без такого периода почти всегда завышает выручку первого года и занижает потребность в финансировании — ровно та ошибка, которая приводит к кассовому разрыву на старте.</p>

<h3>3.2. Организационно-правовые формы: полная картина</h3>
<h4>Юридические лица: коммерческие и некоммерческие</h4>
<p>По Гражданскому кодексу РФ все юридические лица делятся на две большие группы. <b>Коммерческие</b> — те, чья основная цель извлечение прибыли. <b>Некоммерческие</b> — те, у кого цель иная, и прибыль между участниками не распределяется.</p>

<h3>3.3. Системы налогообложения: полный разбор</h3>
<p>Это ключевая тема раздела. Выбор системы налогообложения напрямую связан с организационно-правовой формой: часть режимов доступна только ИП, часть — всем.</p>

<h4>Карта режимов: кому что доступно</h4>

<h4>ОСНО — общая система налогообложения</h4>
<p><b>Что это.</b> Базовый режим, который применяется по умолчанию, если не подано заявление о переходе на спецрежим. Предполагает уплату нескольких налогов и полноценный учёт.</p>
<p><b>Какие налоги платятся:</b></p>
<ul>
  <li><b>НДС</b> — налог на добавленную стоимость, актуальная ставка определяется Налоговым кодексом (в задачах курса встречается 20% и 22%).</li>
  <li><b>Налог на прибыль</b> для организаций — актуальная ставка определяется НК РФ (в задачах курса — 20% и 25%).</li>
  <li><b>НДФЛ</b> вместо налога на прибыль — для ИП на ОСНО.</li>
  <li><b>Налог на имущество организаций</b>.</li>
</ul>
<p><b>Кому подходит.</b> Крупному бизнесу и тем компаниям, кому по условиям деятельности нужен расчёт НДС при взаиморасчётах с контрагентами. На старте бизнеса ОСНО не всегда выгодна, поскольку предполагает сдачу большого объёма отчётности и уплату нескольких налогов.</p>
<p><b>Главный аргумент ЗА ОСНО — вычет по НДС у контрагентов.</b> Если ваши покупатели сами работают на ОСНО, они хотят получать от вас счета-фактуры с выделенным НДС, чтобы принять этот НДС к вычету. Поставщик на УСН такой возможности не даёт, и для покупателя сделка фактически становится дороже на сумму НДС. Поэтому в B2B с крупными контрагентами компания на УСН часто оказывается неконкурентоспособной, даже если её собственная налоговая нагрузка ниже.</p>

<h4>УСН — упрощённая система налогообложения</h4>
<p><b>Что это.</b> Специальный режим для малого и среднего бизнеса. Главное преимущество: вместо нескольких налогов платится <b>один</b>. Компания сама выбирает объект налогообложения.</p>
<table>

  <tr><td>Что облагается</td><td>Вся выручка, расходы не учитываются</td><td>Разница между доходами и подтверждёнными расходами</td></tr>
  <tr><td>Базовая ставка</td><td>от 6%</td><td>от 15%</td></tr>
  <tr><td>Регионы</td><td colspan="2">Регионы вправе снижать ставки в зависимости от вида деятельности и размера дохода</td></tr>
  <tr><td>Учёт расходов</td><td>Не нужен для налога — проще администрирование</td><td>Каждый расход нужно документально подтвердить и он должен входить в закрытый перечень НК</td></tr>
  <tr><td>Кому выгодно</td><td>Услуги, консалтинг, IT — там, где расходов мало</td><td>Торговля, производство — там, где расходы велики</td></tr>
</table>

<h4>Как выбрать между «Доходы» и «Доходы минус расходы»: вывод формулы</h4>
<p>Найдём точку, в которой оба варианта дают одинаковый налог. Обозначим выручку как В, расходы как Р:</p>
<div class="formula">0,06 × В = 0,15 × (В − Р)</div>
<div class="calc-line">0,06В = 0,15В − 0,15Р</div>
<div class="calc-line">0,15Р = 0,15В − 0,06В = 0,09В</div>
<div class="calc-line">Р = 0,09В / 0,15 = <b>0,6 В</b></div>
<div class="formula">Порог: расходы = 60% от выручки. Меньше 60% → выгоднее «Доходы» (6%). Больше 60% → выгоднее «Доходы минус расходы» (15%).</div>
<p>Это «правило 60%» — самый быстрый способ ответить на экзаменационный вопрос без полного расчёта. Но если в вариантах ответа указаны конкретные суммы налога, считать всё равно придётся.</p>

<h4>Важное изменение: НДС на УСН</h4>
<div class="callout"><b>С конца 2025 года плательщики УСН с доходом свыше установленного лимита обязаны уплачивать НДС.</b> Это принципиально меняет логику планирования для растущего бизнеса: раньше УСН означала полное освобождение от НДС, теперь при превышении лимита появляется обязанность его платить. При выборе режима для компании, которая планирует быстро расти, это нужно закладывать в модель заранее.</div>

<h4>ПСН — патентная система налогообложения</h4>
<p><b>Только для ИП.</b> Суть: предприниматель покупает патент на определённый вид деятельности на срок от 1 до 12 месяцев. Стоимость патента <b>фиксирована</b> и рассчитывается от потенциально возможного дохода, установленного региональным законом, а не от фактической выручки.</p>
<p><b>Плюсы:</b> предсказуемость (заранее знаешь сумму налога), простота (нет декларации по этому налогу), выгодно при доходе выше расчётного.</p>
<p><b>Минусы и ограничения:</b> доступна только по <b>ограниченному перечню видов деятельности</b> (в основном бытовые услуги, розница, общепит, перевозки, обучение и репетиторство); ограничения по числу работников и годовому доходу; если фактический доход оказался маленьким, патент всё равно оплачен полностью.</p>
<div class="callout"><b>Тонкость, на которой строят экзаменационные вопросы.</b> Обучение и репетиторство обычно ВХОДЯТ в перечень видов деятельности для ПСН — поэтому для онлайн-школы вариант «ИП и ПСН» может быть верным. А вот маркетинговый и управленческий консалтинг, как правило, в перечень НЕ входит — поэтому для консультанта по маркетингу «ИП и ПСН» будет неверным ответом, и правильным окажется «ИП и УСН Доходы».</div>

<h4>НПД — налог на профессиональный доход (самозанятость)</h4>
